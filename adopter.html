<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TNR流浪动物管理 - 领养人端</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tnr-traditional.css">
  <style>
    /* === 移动端专用样式 === */
    body { background: #e8e4de; }

    .mobile-frame {
      max-width: 420px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--rice-paper);
      position: relative;
      padding-bottom: 64px;
      box-shadow: 0 0 40px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    /* 登录页 */
    .login-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--sp-6);
      background: var(--grad-sidebar);
      color: #fff;
    }
    .login-logo {
      width: 72px; height: 72px;
      background: var(--grad-cinnabar);
      border-radius: var(--r-2xl);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      box-shadow: 0 8px 24px rgba(195,39,43,0.4);
      margin-bottom: var(--sp-5);
    }
    .login-title {
      font-family: var(--font-display);
      font-size: var(--fs-2xl);
      font-weight: 700;
      margin-bottom: var(--sp-1);
    }
    .login-subtitle {
      font-size: var(--fs-sm);
      color: rgba(255,255,255,0.5);
      margin-bottom: var(--sp-8);
    }
    .login-form {
      width: 100%;
      max-width: 320px;
    }
    .login-form .form-group { margin-bottom: var(--sp-4); }
    .login-form .form-label { color: rgba(255,255,255,0.7); }
    .login-form .form-input {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.15);
      color: #fff;
    }
    .login-form .form-input::placeholder { color: rgba(255,255,255,0.3); }
    .login-form .form-input:focus {
      border-color: var(--cinnabar);
      box-shadow: 0 0 0 3px rgba(195,39,43,0.2);
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      font-size: var(--fs-lg);
      margin-top: var(--sp-2);
    }
    .login-hint {
      text-align: center;
      font-size: var(--fs-xs);
      color: rgba(255,255,255,0.3);
      margin-top: var(--sp-5);
    }

    /* 移动端头部 */
    .mobile-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--grad-sidebar);
      color: #fff;
      padding: var(--sp-4) var(--sp-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
    }
    .mobile-header-title {
      font-family: var(--font-display);
      font-size: var(--fs-lg);
      font-weight: 600;
    }
    .mobile-header-back {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 20px;
      color: #fff;
      border-radius: var(--r-md);
      transition: background var(--t-fast);
    }
    .mobile-header-back:active { background: rgba(255,255,255,0.1); }
    .mobile-header-right { font-size: 18px; cursor: pointer; }

    /* 移动端底部导航 */
    .mobile-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 420px;
      background: var(--white);
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: space-around;
      padding: var(--sp-2) 0 calc(var(--sp-2) + env(safe-area-inset-bottom));
      z-index: 100;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.04);
    }
    .mobile-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: var(--sp-1) var(--sp-2);
      cursor: pointer;
      color: var(--ink-light);
      transition: color var(--t-fast);
      flex: 1;
    }
    .mobile-nav-item.active { color: var(--cinnabar); }
    .mobile-nav-icon { font-size: 20px; line-height: 1; }
    .mobile-nav-label { font-size: 10px; line-height: 1.2; }
    .mobile-nav-badge {
      position: absolute;
      top: 2px;
      right: 50%;
      margin-right: -24px;
      background: var(--cinnabar);
      color: #fff;
      font-size: 9px;
      min-width: 16px; height: 16px;
      border-radius: var(--r-full);
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px;
      font-weight: 600;
    }
    .mobile-nav-item { position: relative; }

    .mobile-content { padding: var(--sp-3) var(--sp-3) var(--sp-6); }

    /* 页面切换 */
    .page-view { display: none; animation: fadeInUp 0.3s ease; }
    .page-view.active { display: block; }

    /* 搜索栏 */
    .mobile-search-bar {
      position: relative;
      margin-bottom: var(--sp-3);
    }
    .mobile-search-bar .form-input {
      padding-left: 36px;
      padding-right: 12px;
      border-radius: var(--r-full);
      background: var(--white);
    }
    .mobile-search-bar .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--ink-light);
      pointer-events: none;
    }

    /* 宠物卡片 */
    .pet-card {
      background: var(--white);
      border-radius: var(--r-xl);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      margin-bottom: var(--sp-3);
      cursor: pointer;
      transition: all var(--t-base);
    }
    .pet-card:active { transform: scale(0.98); }
    .pet-card-photo {
      width: 80px;
      height: 80px;
      border-radius: var(--r-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      flex-shrink: 0;
    }
    .pet-card-body {
      display: flex;
      gap: var(--sp-3);
      padding: var(--sp-3);
    }
    .pet-card-info {
      flex: 1;
      min-width: 0;
    }
    .pet-card-name {
      font-family: var(--font-display);
      font-size: var(--fs-lg);
      font-weight: 600;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }
    .pet-card-code {
      font-size: var(--fs-xs);
      color: var(--ink-light);
      font-family: var(--font-mono);
      margin-top: 2px;
    }
    .pet-card-desc {
      font-size: var(--fs-sm);
      color: var(--ink-muted);
      margin-top: var(--sp-1);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pet-card-meta {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      margin-top: var(--sp-2);
      flex-wrap: wrap;
    }
    .pet-card-meta-item {
      font-size: var(--fs-xs);
      color: var(--ink-light);
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .pet-card-footer {
      padding: var(--sp-2) var(--sp-3);
      background: var(--rice-warm);
      border-top: 1px solid var(--border-faint);
      font-size: var(--fs-xs);
      color: var(--ink-muted);
      display: flex;
      align-items: center;
      gap: var(--sp-1);
    }

    /* 照片占位 */
    .photo-placeholder {
      background: var(--grad-cinnabar);
      color: rgba(255,255,255,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--r-lg);
      aspect-ratio: 1;
      font-size: 48px;
    }
    .photo-placeholder.cat { background: linear-gradient(135deg, #C89B3C 0%, #8B6914 100%); }
    .photo-placeholder.dog { background: linear-gradient(135deg, #5B7A4F 0%, #3D5535 100%); }
    .photo-placeholder.other { background: linear-gradient(135deg, #864E36 0%, #5C3623 100%); }

    /* 详情页覆盖层 */
    .mobile-overlay {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: var(--rice-paper);
      z-index: 500;
      overflow-y: auto;
      display: none;
      padding-bottom: var(--sp-8);
    }
    .mobile-overlay.show {
      display: block;
      animation: slideInFromRight 0.3s ease;
    }
    @keyframes slideInFromRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(-50%); opacity: 1; }
    }

    /* 详情页照片网格 */
    .detail-photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--sp-2);
      margin-bottom: var(--sp-4);
    }
    .detail-photo-item {
      aspect-ratio: 1;
      border-radius: var(--r-md);
      overflow: hidden;
      position: relative;
    }
    .detail-photo-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(28,28,28,0.65);
      color: #fff;
      font-size: 10px;
      padding: 2px 4px;
      text-align: center;
    }

    /* 详情页区块 */
    .detail-section {
      background: var(--white);
      border-radius: var(--r-xl);
      padding: var(--sp-4);
      margin-bottom: var(--sp-3);
      border: 1px solid var(--border-light);
    }
    .detail-section-title {
      font-family: var(--font-display);
      font-size: var(--fs-md);
      font-weight: 600;
      color: var(--ink);
      margin-bottom: var(--sp-3);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }
    .detail-section-title::before {
      content: '';
      width: 3px;
      height: 16px;
      background: var(--grad-cinnabar);
      border-radius: 2px;
    }

    /* 详情页信息行 */
    .info-row {
      display: flex;
      padding: var(--sp-2) 0;
      border-bottom: 1px solid var(--border-faint);
    }
    .info-row:last-child { border-bottom: none; }
    .info-label {
      width: 80px;
      flex-shrink: 0;
      font-size: var(--fs-sm);
      color: var(--ink-light);
    }
    .info-value {
      flex: 1;
      font-size: var(--fs-sm);
      color: var(--ink-text);
      font-weight: 500;
    }

    /* 时间线移动端 */
    .timeline { padding-left: var(--sp-5); }
    .timeline-item::before { left: -18px; }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: var(--sp-12) var(--sp-6);
      color: var(--ink-light);
    }
    .empty-state-icon { font-size: 48px; margin-bottom: var(--sp-3); opacity: 0.4; }
    .empty-state-text { font-size: var(--fs-md); }
    .empty-state-hint { font-size: var(--fs-sm); margin-top: var(--sp-2); }

    /* 回访打卡表单 */
    .checkin-form {
      background: var(--white);
      border-radius: var(--r-xl);
      padding: var(--sp-4);
      border: 1px solid var(--border-light);
      margin-bottom: var(--sp-4);
    }
    .checkin-pet-select {
      display: flex;
      gap: var(--sp-2);
      overflow-x: auto;
      margin-bottom: var(--sp-3);
      padding-bottom: var(--sp-2);
    }
    .checkin-pet-item {
      flex-shrink: 0;
      padding: var(--sp-2) var(--sp-3);
      border: 1px solid var(--border-ink);
      border-radius: var(--r-full);
      font-size: var(--fs-sm);
      color: var(--ink-muted);
      cursor: pointer;
      transition: all var(--t-fast);
      white-space: nowrap;
    }
    .checkin-pet-item.active {
      background: var(--cinnabar-light);
      border-color: var(--cinnabar);
      color: var(--cinnabar);
      font-weight: 600;
    }

    /* 照片上传 */
    .photo-upload-area {
      border: 2px dashed var(--border-ink);
      border-radius: var(--r-lg);
      padding: var(--sp-6);
      text-align: center;
      cursor: pointer;
      transition: all var(--t-base);
      background: var(--rice-light);
      position: relative;
    }
    .photo-upload-area:hover {
      border-color: var(--cinnabar);
      background: var(--cinnabar-light);
    }
    .photo-upload-area.has-photo {
      padding: 0;
      border-style: solid;
      border-color: var(--border-ink);
    }
    .photo-upload-preview {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: var(--r-md);
    }
    .photo-upload-placeholder {
      font-size: 36px;
      margin-bottom: var(--sp-2);
    }

    /* 打卡历史 */
    .checkin-history-item {
      background: var(--white);
      border-radius: var(--r-lg);
      padding: var(--sp-3);
      border: 1px solid var(--border-light);
      margin-bottom: var(--sp-2);
    }
    .checkin-history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--sp-1);
    }
    .checkin-history-month {
      font-family: var(--font-display);
      font-size: var(--fs-md);
      font-weight: 600;
    }
    .checkin-history-note {
      font-size: var(--fs-sm);
      color: var(--ink-muted);
      margin-top: var(--sp-1);
    }
    .checkin-history-date {
      font-size: var(--fs-xs);
      color: var(--ink-light);
    }

    /* 消息列表 */
    .message-item {
      background: var(--white);
      border-radius: var(--r-lg);
      padding: var(--sp-3) var(--sp-4);
      border: 1px solid var(--border-light);
      margin-bottom: var(--sp-2);
      cursor: pointer;
      transition: all var(--t-fast);
      display: flex;
      gap: var(--sp-3);
      align-items: flex-start;
    }
    .message-item:active { background: var(--rice-light); }
    .message-item.unread {
      border-left: 3px solid var(--cinnabar);
    }
    .message-icon {
      width: 36px; height: 36px;
      border-radius: var(--r-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .message-content { flex: 1; min-width: 0; }
    .message-title {
      font-size: var(--fs-md);
      font-weight: 500;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }
    .message-preview {
      font-size: var(--fs-sm);
      color: var(--ink-muted);
      margin-top: 2px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .message-time {
      font-size: var(--fs-xs);
      color: var(--ink-light);
      margin-top: var(--sp-1);
    }
    .message-unread-dot {
      width: 8px; height: 8px;
      border-radius: var(--r-full);
      background: var(--cinnabar);
      flex-shrink: 0;
    }

    /* 个人中心 */
    .profile-header {
      background: var(--grad-sidebar);
      padding: var(--sp-6) var(--sp-4);
      text-align: center;
      border-radius: var(--r-xl);
      margin-bottom: var(--sp-4);
      color: #fff;
    }
    .profile-avatar {
      width: 64px; height: 64px;
      border-radius: var(--r-full);
      background: var(--grad-cinnabar);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      margin: 0 auto var(--sp-3);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .profile-name {
      font-family: var(--font-display);
      font-size: var(--fs-xl);
      font-weight: 600;
    }
    .profile-phone {
      font-size: var(--fs-sm);
      color: rgba(255,255,255,0.6);
      margin-top: 2px;
    }
    .profile-section {
      background: var(--white);
      border-radius: var(--r-xl);
      overflow: hidden;
      border: 1px solid var(--border-light);
      margin-bottom: var(--sp-4);
    }
    .profile-section-header {
      padding: var(--sp-3) var(--sp-4);
      background: var(--rice-warm);
      font-family: var(--font-display);
      font-size: var(--fs-md);
      font-weight: 600;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }
    .profile-section-body { padding: var(--sp-4); }
    .profile-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp-3) var(--sp-4);
      border-bottom: 1px solid var(--border-faint);
      cursor: pointer;
      transition: background var(--t-fast);
    }
    .profile-row:active { background: var(--rice-light); }
    .profile-row:last-child { border-bottom: none; }
    .profile-row-label {
      font-size: var(--fs-md);
      color: var(--ink-text);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }
    .profile-row-value {
      font-size: var(--fs-sm);
      color: var(--ink-light);
      display: flex;
      align-items: center;
      gap: var(--sp-1);
    }
    .profile-row-arrow { color: var(--ink-light); font-size: 14px; }

    /* 联系指引 */
    .contact-guide {
      background: var(--autumn-light);
      border-radius: var(--r-lg);
      padding: var(--sp-3);
      border: 1px solid var(--autumn-gold);
    }
    .contact-guide-title {
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--autumn-gold);
      margin-bottom: var(--sp-1);
      display: flex;
      align-items: center;
      gap: var(--sp-1);
    }
    .contact-guide-text {
      font-size: var(--fs-sm);
      color: var(--ink-text);
      line-height: 1.8;
    }

    /* 领养流程须知 */
    .adoption-process {
      background: var(--azurite-light);
      border-radius: var(--r-lg);
      padding: var(--sp-3);
      border: 1px solid var(--azurite);
    }
    .adoption-process-title {
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--azurite);
      margin-bottom: var(--sp-2);
      display: flex;
      align-items: center;
      gap: var(--sp-1);
    }
    .adoption-process-step {
      font-size: var(--fs-sm);
      color: var(--ink-text);
      line-height: 1.8;
      padding-left: var(--sp-4);
      position: relative;
    }
    .adoption-process-step::before {
      content: counter(step);
      counter-increment: step;
      position: absolute;
      left: 0;
      top: 0;
      color: var(--azurite);
      font-weight: 600;
    }
    .adoption-process-list {
      counter-reset: step;
    }
    .adoption-process-list > div {
      padding-left: 20px;
      position: relative;
      margin-bottom: var(--sp-1);
    }
    .adoption-process-list > div::before {
      content: counter(step-counter);
      counter-increment: step-counter;
      position: absolute;
      left: 0;
      font-weight: 600;
      color: var(--azurite);
    }
    .adoption-process-list { counter-reset: step-counter; }

    /* Toast 适配移动端 */
    .toast-container {
      top: var(--sp-4);
      right: 50%;
      transform: translateX(50%);
      left: auto;
    }
    .toast {
      min-width: auto;
      max-width: 360px;
    }

    /* 领养卡片 */
    .adoption-card {
      background: var(--white);
      border-radius: var(--r-xl);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      margin-bottom: var(--sp-3);
      cursor: pointer;
      transition: all var(--t-base);
    }
    .adoption-card:active { transform: scale(0.98); }
    .adoption-card-header {
      display: flex;
      gap: var(--sp-3);
      padding: var(--sp-3);
    }
    .adoption-card-footer {
      padding: var(--sp-2) var(--sp-3);
      background: var(--bamboo-light);
      border-top: 1px solid var(--border-faint);
      font-size: var(--fs-sm);
      color: var(--bamboo-green);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }

    /* 消息详情弹窗 */
    .message-detail-content {
      padding: var(--sp-4);
    }
    .message-detail-title {
      font-family: var(--font-display);
      font-size: var(--fs-lg);
      font-weight: 600;
      color: var(--ink);
      margin-bottom: var(--sp-2);
    }
    .message-detail-meta {
      display: flex;
      gap: var(--sp-3);
      font-size: var(--fs-xs);
      color: var(--ink-light);
      margin-bottom: var(--sp-3);
      padding-bottom: var(--sp-3);
      border-bottom: 1px solid var(--border-faint);
    }
    .message-detail-body {
      font-size: var(--fs-md);
      color: var(--ink-text);
      line-height: 1.8;
    }

    /* 打卡月份标签 */
    .pending-month-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: var(--autumn-light);
      color: var(--autumn-gold);
      border-radius: var(--r-full);
      font-size: var(--fs-sm);
      font-weight: 600;
      margin-right: var(--sp-2);
    }

    .section-header-mobile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--sp-3);
    }
    .section-header-title {
      font-family: var(--font-display);

      font-weight: 600;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: var(--sp-2);

    .section-header-title::before {
      content: '';
      width: 3px;
      height: 16px;
      background: var(--grad-cinnabar);
      border-radius: 2px;
    }
  </style>
</head>

<script src="js/tnr-data.js"></script>
<script src="js/tnr-common.js"></script>
<script>
/* ============================================
   领养人小程序端 - 应用逻辑
   ============================================ */

// === 全局状态 ===
let currentPage = 'hall';
let overlayStack = [];
let selectedCheckinPet = null;
let uploadedPhotoData = null;

// === 工具函数 ===

function getCurrentUser() {
  return TNR_DB.getCurrentUser();
}

function getPetEmoji(species) {
  if (species === '猫') return '🐱';
  if (species === '狗') return '🐶';
  return '🐾';
}

function getPhotoClass(species) {
  if (species === '猫') return 'cat';
  if (species === '狗') return 'dog';
  return 'other';
}

function getInstitutionById(id) {
  return TNR_DB.getById(TNR_DB.KEYS.institutions, id);
}

function getCaptureByPetCode(petCode) {
  const captures = TNR_DB.getAllRaw(TNR_DB.KEYS.captures);
  return captures.find(c => c.petCodes && c.petCodes.includes(petCode));
}

function getTransfersByPetCode(petCode) {
  const transfers = TNR_DB.getAllRaw(TNR_DB.KEYS.transfers);
  return transfers.filter(t => t.petCodes && t.petCodes.includes(petCode));
}

function getTreatmentByPetId(petId) {
  const treatments = TNR_DB.getAllRaw(TNR_DB.KEYS.treatments);
  return treatments.find(t => t.petId === petId);
}

function getAdoptionByPetId(petId) {
  const adoptions = TNR_DB.getAllRaw(TNR_DB.KEYS.adoptions);
  return adoptions.find(a => a.petId === petId);
}

function getMyAdoptions() {
  const user = getCurrentUser();
  if (!user) return [];
  return TNR_DB.getAllRaw(TNR_DB.KEYS.adoptions).filter(a =>
    a.adopterId === user.id || a.adopterName === user.name || a.adopterPhone === user.phone
  );
}

function getMyCheckIns() {
  const user = getCurrentUser();
  if (!user) return [];
  return TNR_DB.getAllRaw(TNR_DB.KEYS.checkIns).filter(c => c.adopterId === user.id);
}

function getMyMessages() {
  const user = getCurrentUser();
  if (!user) return [];
  return TNR_DB.getAllRaw(TNR_DB.KEYS.messages).filter(m => m.userId === user.id);
}

function getUnreadMessageCount() {
  return getMyMessages().filter(m => !m.isRead).length;
}

function getMessageTypeIcon(type) {
  const map = {
    'approval': '📋',
    'checkin_reminder': '⏰',
    'system': '📢',
    'policy': '📜'
  };
  return map[type] || '📨';
}

function getMessageTypeLabel(type) {
  const map = {
    'approval': '审核通知',
    'checkin_reminder': '打卡提醒',
    'system': '系统公告',
    'policy': '政策通知'
  };
  return map[type] || '消息';
}

function getCheckinStatusBadge(status) {
  const map = {
    'approved': '<span class="badge badge-success">已通过</span>',
    'rejected': '<span class="badge badge-danger">已驳回</span>',
    'pending': '<span class="badge badge-warning">待审核</span>'
  };
  return map[status] || '<span class="badge badge-default">未知</span>';
}

// === 登录/登出 ===

function doLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  if (!username || !password) {
    TNR_UI.toast('请输入用户名和密码', 'warning');
    return;
  }
  const user = TNR_DB.login(username, password);
  if (user) {
    if (user.role !== 'adopter') {
      TNR_UI.toast('该账号非领养人角色', 'warning');
      TNR_DB.logout();
      return;
    }
    TNR_DB.setCurrentUser(user);
    TNR_UI.toast('登录成功', 'success');
    showMainApp();
  } else {
    TNR_UI.toast('用户名或密码错误', 'danger');
  }
}

function doLogout() {
  TNR_UI.confirm('确定要退出登录吗？', '退出登录').then(ok => {
    if (ok) {
      TNR_DB.logout();
      document.getElementById('mainApp').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      TNR_UI.toast('已退出登录', 'info');
    }
  });
}

function showMainApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  switchTab('hall');
}

// === 导航 ===

const tabTitles = {
  'hall': '领养大厅',
  'my-adoption': '我的领养',
  'checkin': '回访打卡',
  'messages': '消息中心',
  'profile': '个人中心'
};

function switchTab(tabId) {
  currentPage = tabId;
  document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tabId).classList.add('active');
  document.querySelectorAll('.mobile-nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector('.mobile-nav-item[data-tab="' + tabId + '"]').classList.add('active');
  document.getElementById('headerTitle').textContent = tabTitles[tabId] || '';
  document.getElementById('headerBack').classList.add('hidden');

  // 渲染对应页面
  if (tabId === 'hall') renderHall();
  else if (tabId === 'my-adoption') renderMyAdoption();
  else if (tabId === 'checkin') renderCheckin();
  else if (tabId === 'messages') renderMessages();
  else if (tabId === 'profile') renderProfile();

  // 更新消息角标
  updateMessageBadge();
}

function updateMessageBadge() {
  const count = getUnreadMessageCount();
  const navItem = document.querySelector('.mobile-nav-item[data-tab="messages"]');
  let badge = navItem.querySelector('.mobile-nav-badge');
  if (count > 0) {
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'mobile-nav-badge';
      navItem.appendChild(badge);
    }
    badge.textContent = count > 99 ? '99+' : count;
  } else {
    if (badge) badge.remove();
  }
}

function goBack() {
  if (overlayStack.length > 0) {
    const overlayId = overlayStack.pop();
    closeOverlay(overlayId);
  }
}

function showOverlay(overlayId) {
  document.getElementById(overlayId).classList.add('show');
  overlayStack.push(overlayId);
}

function closeOverlay(overlayId) {
  document.getElementById(overlayId).classList.remove('show');
  overlayStack = overlayStack.filter(id => id !== overlayId);
}

// === 1. 领养大厅 ===

function renderHall() {
  const keyword = (document.getElementById('hallSearch')?.value || '').trim().toLowerCase();
  let pets = TNR_DB.getAllRaw(TNR_DB.KEYS.pets).filter(p => p.status === 'pending_adopt');

  if (keyword) {
    pets = pets.filter(p =>
      (p.name && p.name.toLowerCase().includes(keyword)) ||
      (p.code && p.code.toLowerCase().includes(keyword)) ||
      (p.breed && p.breed.toLowerCase().includes(keyword)) ||
      (p.species && p.species.toLowerCase().includes(keyword))
    );
  }

  const container = document.getElementById('hallList');
  if (pets.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🐾</div>
        <div class="empty-state-text">暂无可领养的宠物</div>
        <div class="empty-state-hint">请稍后再来查看</div>
      </div>`;
    return;
  }

  let html = '<div style="font-size:12px;color:var(--ink-light);margin-bottom:8px;">共 ' + pets.length + ' 只待领养宠物</div>';
  pets.forEach(pet => {
    const hospital = getInstitutionById(pet.hospitalId);
    const hospitalName = hospital ? hospital.name : '未知医院';
    const photoClass = getPhotoClass(pet.species);
    const emoji = getPetEmoji(pet.species);
    const genderIcon = pet.gender === '公' ? '♂' : '♀';
    const genderColor = pet.gender === '公' ? 'var(--azurite)' : 'var(--cinnabar)';

    html += `
      <div class="pet-card" onclick="showPetDetail('${pet.id}')">
        <div class="pet-card-body">
          <div class="pet-card-photo photo-placeholder ${photoClass}">${emoji}</div>
          <div class="pet-card-info">
            <div class="pet-card-name">
              ${TNR_UI.escape(pet.name)}
              <span class="badge badge-cinnabar">待领养</span>
            </div>
            <div class="pet-card-code">${TNR_UI.escape(pet.code)}</div>
            <div class="pet-card-desc">${TNR_UI.escape(pet.description || '暂无描述')}</div>
            <div class="pet-card-meta">
              <span class="pet-card-meta-item">${TNR_UI.escape(pet.species)} · ${TNR_UI.escape(pet.breed)}</span>
              <span class="pet-card-meta-item" style="color:${genderColor};font-weight:600;">${genderIcon} ${TNR_UI.escape(pet.gender)}</span>
              <span class="pet-card-meta-item">${TNR_UI.escape(pet.age || '')}</span>
            </div>
          </div>
        </div>
        <div class="pet-card-footer">
          <span>🏥 ${TNR_UI.escape(hospitalName)}</span>
          <span style="margin-left:auto;color:var(--cinnabar);">查看详情 ›</span>
        </div>
      </div>`;
  });

  // 线下联系指引
  html += `
    <div class="contact-guide" style="margin-top:12px;">
      <div class="contact-guide-title">📌 线下联系指引</div>
      <div class="contact-guide-text">
        领养流程为线下办理，请自主联系对应医院/捕捉点咨询。<br>
        领养资格审核、承诺书签署及领养协议均在线下完成。
      </div>
    </div>`;

  container.innerHTML = html;
}

// === 2. 宠物详情页 ===

function showPetDetail(petId) {
  const pet = TNR_DB.getById(TNR_DB.KEYS.pets, petId);
  if (!pet) {
    TNR_UI.toast('宠物信息不存在', 'danger');
    return;
  }

  const hospital = getInstitutionById(pet.hospitalId);
  const capture = getCaptureByPetCode(pet.code);
  const treatment = getTreatmentByPetId(petId);
  const photoClass = getPhotoClass(pet.species);
  const emoji = getPetEmoji(pet.species);
  const genderIcon = pet.gender === '公' ? '♂' : '♀';

  let html = '';

  // 照片区
  html += '<div class="detail-section">';
  html += '<div class="detail-section-title">宠物照片</div>';
  html += '<div class="detail-photo-grid">';
  html += `<div class="detail-photo-item"><div class="photo-placeholder ${photoClass}">${emoji}</div><div class="detail-photo-label">捕捉前</div></div>`;
  html += `<div class="detail-photo-item"><div class="photo-placeholder ${photoClass}">${emoji}</div><div class="detail-photo-label">捕捉后</div></div>`;
  html += `<div class="detail-photo-item"><div class="photo-placeholder ${photoClass}">${emoji}</div><div class="detail-photo-label">诊疗后</div></div>`;
  html += '</div>';
  html += '</div>';

  // 基本信息
  html += '<div class="detail-section">';
  html += '<div class="detail-section-title">基本信息</div>';
  html += `<div class="info-row"><div class="info-label">编号</div><div class="info-value" style="font-family:var(--font-mono);">${TNR_UI.escape(pet.code)}</div></div>`;
  html += `<div class="info-row"><div class="info-label">名称</div><div class="info-value">${TNR_UI.escape(pet.name)}</div></div>`;
  html += `<div class="info-row"><div class="info-label">物种</div><div class="info-value">${TNR_UI.escape(pet.species)}</div></div>`;
  html += `<div class="info-row"><div class="info-label">品种</div><div class="info-value">${TNR_UI.escape(pet.breed)}</div></div>`;
  html += `<div class="info-row"><div class="info-label">性别</div><div class="info-value">${genderIcon} ${TNR_UI.escape(pet.gender)}</div></div>`;
  html += `<div class="info-row"><div class="info-label">年龄</div><div class="info-value">${TNR_UI.escape(pet.age || '—')}</div></div>`;
  html += `<div class="info-row"><div class="info-label">毛色</div><div class="info-value">${TNR_UI.escape(pet.color || '—')}</div></div>`;
  html += `<div class="info-row"><div class="info-label">体重</div><div class="info-value">${TNR_UI.escape(pet.weight || '—')}</div></div>`;
  html += `<div class="info-row"><div class="info-label">芯片号</div><div class="info-value" style="font-family:var(--font-mono);">${TNR_UI.escape(pet.chipNo || '未植入')}</div></div>`;
  html += '</div>';

  // 捕捉记录
  html += '<div class="detail-section">';
  html += '<div class="detail-section-title">捕捉记录</div>';
  if (capture) {
    html += `<div class="info-row"><div class="info-label">捕捉小区</div><div class="info-value">${TNR_UI.escape(capture.communityName || '—')}</div></div>`;
    html += `<div class="info-row"><div class="info-label">详细地址</div><div class="info-value">${TNR_UI.escape(capture.address || '—')}</div></div>`;
    html += `<div class="info-row"><div class="info-label">捕捉点</div><div class="info-value">${TNR_UI.escape(capture.shelterName || '—')}</div></div>`;
    html += `<div class="info-row"><div class="info-label">捕捉日期</div><div class="info-value">${TNR_UI.escape(capture.createdAt || '—')}</div></div>`;
    html += `<div class="info-row"><div class="info-label">物业联系</div><div class="info-value">${TNR_UI.escape(capture.contactPerson || '—')} ${TNR_UI.escape(capture.contactPhone || '')}</div></div>`;
  } else {
    html += '<div class="info-row"><div class="info-label">捕捉记录</div><div class="info-value text-muted">暂无</div></div>';
  }
  html += '</div>';

  // 诊疗记录
  html += '<div class="detail-section">';
  html += '<div class="detail-section-title">诊疗记录</div>';
  if (treatment) {
    const items = treatment.items || {};
    html += `<div class="info-row"><div class="info-label">绝育手术</div><div class="info-value">${items.sterilization ? '<span class="badge badge-success">已绝育</span>' : '<span class="badge badge-default">未绝育</span>'}</div></div>`;
    if (items.sterilization && treatment.sterilization) {
      html += `<div class="info-row"><div class="info-label">手术日期</div><div class="info-value">${TNR_UI.escape(treatment.sterilization.surgeryDate || '—')}</div></div>`;
      html += `<div class="info-row"><div class="info-label">主刀医生</div><div class="info-value">${TNR_UI.escape(treatment.sterilization.surgeon || '—')}</div></div>`;
    }
    html += `<div class="info-row"><div class="info-label">疫苗接种</div><div class="info-value">${items.vaccine ? '<span class="badge badge-success">已接种</span>' : '<span class="badge badge-default">未接种</span>'}</div></div>`;
    if (items.vaccine && treatment.vaccine) {
      html += `<div class="info-row"><div class="info-label">疫苗类型</div><div class="info-value">${TNR_UI.escape(treatment.vaccine.type || '—')}</div></div>`;
      html += `<div class="info-row"><div class="info-label">接种日期</div><div class="info-value">${TNR_UI.escape(treatment.vaccine.date || '—')}</div></div>`;
    }
    html += `<div class="info-row"><div class="info-label">驱虫护理</div><div class="info-value">${items.deworming ? '<span class="badge badge-success">已驱虫</span>' : '<span class="badge badge-default">未驱虫</span>'}</div></div>`;
    html += `<div class="info-row"><div class="info-label">芯片植入</div><div class="info-value">${items.chip ? '<span class="badge badge-success">已植入</span>' : '<span class="badge badge-default">未植入</span>'}</div></div>`;
    html += `<div class="info-row"><div class="info-label">诊疗医院</div><div class="info-value">${TNR_UI.escape(treatment.hospitalName || '—')}</div></div>`;
  } else {
    html += '<div class="info-row"><div class="info-label">诊疗记录</div><div class="info-value text-muted">暂无</div></div>';
  }
  html += '</div>';

  // 所属医院 + 联系信息
  html += '<div class="detail-section">';
  html += '<div class="detail-section-title">所属医院</div>';
  if (hospital) {
    html += `<div class="info-row"><div class="info-label">医院名称</div><div class="info-value">${TNR_UI.escape(hospital.name)}</div></div>`;
    html += `<div class="info-row"><div class="info-label">医院地址</div><div class="info-value">${TNR_UI.escape(hospital.address || '—')}</div></div>`;
    html += `<div class="info-row"><div class="info-label">联系人</div><div class="info-value">${TNR_UI.escape(hospital.contact || '—')}</div></div>`;
    html += `<div class="info-row"><div class="info-label">联系电话</div><div class="info-value"><a href="tel:${TNR_UI.escape(hospital.phone || '')}" style="color:var(--cinnabar);">${TNR_UI.escape(hospital.phone || '—')}</a></div></div>`;
  } else {
    html += '<div class="info-row"><div class="info-label">所属医院</div><div class="info-value text-muted">暂无</div></div>';
  }
  html += '</div>';

  // 领养要求

// === 生命周期溯源 ===

function showLifecycle(petId) {
  const pet = TNR_DB.getById(TNR_DB.KEYS.pets, petId);
  if (!pet) return;

  const capture = getCaptureByPetCode(pet.code);
  const transfers = getTransfersByPetCode(pet.code);
  const treatment = getTreatmentByPetId(petId);
  const adoption = getAdoptionByPetId(petId);

  let html = '';

  // 宠物概要
  html += '<div class="detail-section" style="text-align:center;">';
  const photoClass = getPhotoClass(pet.species);
  const emoji = getPetEmoji(pet.species);
  html += `<div class="pet-card-photo photo-placeholder ${photoClass}" style="width:80px;height:80px;margin:0 auto 12px;font-size:40px;">${emoji}</div>`;
  html += `<div style="font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--ink);">${TNR_UI.escape(pet.name)}</div>`;
  html += `<div style="font-size:12px;color:var(--ink-light);font-family:var(--font-mono);margin-top:4px;">${TNR_UI.escape(pet.code)}</div>`;
  html += `<div style="margin-top:8px;">${TNR_UI.statusBadge(TNR_DB.getPetStatusText(pet.status), TNR_DB.getPetStatusBadge(pet.status).replace('badge-',''))}</div>`;
  html += '</div>';

  // 时间线
  html += '<div class="detail-section">';
  html += '<div class="detail-section-title">全生命周期溯源</div>';
  html += '<div class="timeline">';

  // 1. 捕捉
  if (capture) {
    html += `<div class="timeline-item done">
      <div class="timeline-time">${TNR_UI.escape(capture.createdAt)}</div>
      <div class="timeline-title">捕捉登记</div>
      <div class="timeline-desc">捕捉小区：${TNR_UI.escape(capture.communityName)}<br>捕捉点：${TNR_UI.escape(capture.shelterName)}<br>操作人：${TNR_UI.escape(capture.operatorName)}</div>
    </div>`;
  }

  // 2. 转运
  transfers.forEach(trf => {
    const isDone = trf.status === 'received';
    html += `<div class="timeline-item ${isDone ? 'done' : ''}">
      <div class="timeline-time">${TNR_UI.escape(trf.createdAt)}</div>
      <div class="timeline-title">转运交接 ${isDone ? '（已接收）' : '（待接收）'}</div>
      <div class="timeline-desc">从：${TNR_UI.escape(trf.fromShelterName)}<br>到：${TNR_UI.escape(trf.toHospitalName)}<br>${trf.receivedAt ? '接收日期：' + TNR_UI.escape(trf.receivedAt) : ''}</div>
    </div>`;
  });

  // 3. 诊疗
  if (treatment) {
    const items = treatment.items || {};
    const treatmentsDone = [];
    if (items.sterilization) treatmentsDone.push('绝育');
    if (items.vaccine) treatmentsDone.push('疫苗');
    if (items.deworming) treatmentsDone.push('驱虫');
    if (items.chip) treatmentsDone.push('芯片');

    html += `<div class="timeline-item done">
      <div class="timeline-time">${TNR_UI.escape(treatment.createdAt)}</div>
      <div class="timeline-title">诊疗完成</div>
      <div class="timeline-desc">医院：${TNR_UI.escape(treatment.hospitalName)}<br>项目：${treatmentsDone.join('、') || '无'}<br>状态：${treatment.status === 'completed' ? '已完成' : '进行中'}</div>
    </div>`;
  }

  // 4. 领养
  if (adoption) {
    html += `<div class="timeline-item done">
      <div class="timeline-time">${TNR_UI.escape(adoption.adoptedAt)}</div>
      <div class="timeline-title">领养完成</div>
      <div class="timeline-desc">领养人：${TNR_UI.escape(adoption.adopterName)}<br>医院：${TNR_UI.escape(adoption.hospitalName)}<br>协议：${TNR_UI.escape(adoption.adoptionAgreement || '线下已签')}</div>
    </div>`;
  }

  html += '</div>';
  html += '</div>';

  document.getElementById('lifecycleContent').innerHTML = html;
  showOverlay('lifecycleOverlay');
}

// === 4. 回访打卡 ===

function renderCheckin() {
  const adoptions = getMyAdoptions();
  const checkIns = getMyCheckIns();
  const container = document.getElementById('checkinContent');

  if (adoptions.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📷</div>
        <div class="empty-state-text">暂无领养宠物</div>
        <div class="empty-state-hint">领养宠物后可进行月度回访打卡</div>
      </div>`;
    return;
  }

  let html = '';

  // 待打卡提醒
  const now = new Date();
  const currentMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  const pendingPets = adoptions.filter(adoption => {
    const petCheckIns = checkIns.filter(c => c.petId === adoption.petId);
    return !petCheckIns.some(c => c.month === currentMonth);
  });

  if (pendingPets.length > 0) {
    html += '<div class="section-header-mobile">';
    html += '<div class="section-header-title">待打卡月份</div>';
    html += '</div>';
    html += '<div style="margin-bottom:16px;">';
    pendingPets.forEach(adoption => {
      const pet = TNR_DB.getById(TNR_DB.KEYS.pets, adoption.petId);
      if (!pet) return;
      html += `<span class="pending-month-tag">⏰ ${TNR_UI.escape(pet.name)} - ${currentMonth}</span>`;
    });
    html += '</div>';
  }

  // 打卡表单
  html += '<div class="section-header-mobile">';
  html += '<div class="section-header-title">提交月度打卡</div>';
  html += '</div>';

  html += '<div class="checkin-form">';
  // 宠物选择
  html += '<div class="form-label">选择宠物</div>';
  html += '<div class="checkin-pet-select">';
  adoptions.forEach((adoption, idx) => {
    const pet = TNR_DB.getById(TNR_DB.KEYS.pets, adoption.petId);
    if (!pet) return;
    const active = (idx === 0) ? ' active' : '';
    html += `<div class="checkin-pet-item${active}" data-pet-id="${pet.id}" onclick="selectCheckinPet('${pet.id}', this)">${TNR_UI.escape(pet.name)} · ${TNR_UI.escape(pet.code)}</div>`;
  });
  html += '</div>';

  // 当前月份显示
  html += `<div class="form-label">打卡月份</div>`;
  html += `<div style="margin-bottom:12px;"><span class="badge badge-cinnabar" style="font-size:13px;">${currentMonth}</span></div>`;

  // 照片上传
  html += '<div class="form-label">宠物近期照片</div>';
  html += `<div class="photo-upload-area" id="photoUploadArea" onclick="document.getElementById('checkinPhotoInput').click()">
    <div class="photo-upload-placeholder">📷</div>
    <div style="font-size:13px;color:var(--ink-muted);">点击上传照片</div>
    <div style="font-size:11px;color:var(--ink-light);margin-top:4px;">支持 JPG/PNG 格式</div>
  </div>`;
  html += `<input type="file" id="checkinPhotoInput" accept="image/*" style="display:none;" onchange="onPhotoSelected(event)">`;

  // 状态说明
  html += '<div class="form-group" style="margin-top:16px;">';
  html += '<label class="form-label">近况说明</label>';
  html += '<textarea class="form-textarea" id="checkinNote" placeholder="请简要描述宠物近期状况（食欲、精神、健康等）" rows="3"></textarea>';
  html += '</div>';

  // 提交按钮
  html += `<button class="btn btn-primary w-full" onclick="submitCheckin('${currentMonth}')">提交打卡</button>`;
  html += '</div>';

  // 打卡历史
  html += '<div class="section-header-mobile" style="margin-top:16px;">';
  html += '<div class="section-header-title">打卡历史</div>';
  html += '</div>';

  if (checkIns.length === 0) {
    html += `
      <div class="empty-state" style="padding:24px;">
        <div class="empty-state-icon" style="font-size:36px;">📋</div>
        <div class="empty-state-text" style="font-size:13px;">暂无打卡记录</div>
      </div>`;
  } else {
    // 按时间倒序
    const sorted = [...checkIns].sort((a, b) => (b.month || '').localeCompare(a.month || ''));
    sorted.forEach(checkin => {
      const pet = TNR_DB.getById(TNR_DB.KEYS.pets, checkin.petId);
      const petName = pet ? pet.name : checkin.petCode;
      html += `
        <div class="checkin-history-item">
          <div class="checkin-history-header">
            <span class="checkin-history-month">${TNR_UI.escape(checkin.month)}</span>
            ${getCheckinStatusBadge(checkin.status)}
          </div>
          <div style="font-size:12px;color:var(--ink-light);">${TNR_UI.escape(petName)} · ${TNR_UI.escape(checkin.petCode)}</div>
          ${checkin.note ? `<div class="checkin-history-note">${TNR_UI.escape(checkin.note)}</div>` : ''}
          <div class="checkin-history-date">提交时间：${TNR_UI.escape(checkin.createdAt)}</div>
        </div>`;
    });
  }

  container.innerHTML = html;

  // 设置默认选中的宠物
  if (adoptions.length > 0) {
    const firstPet = TNR_DB.getById(TNR_DB.KEYS.pets, adoptions[0].petId);
    if (firstPet) selectedCheckinPet = firstPet.id;
  }
  uploadedPhotoData = null;
}

function selectCheckinPet(petId, el) {
  selectedCheckinPet = petId;
  document.querySelectorAll('.checkin-pet-item').forEach(item => item.classList.remove('active'));
  el.classList.add('active');
}

function onPhotoSelected(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    uploadedPhotoData = e.target.result;
    const area = document.getElementById('photoUploadArea');
    area.classList.add('has-photo');
    area.innerHTML = `<img src="${e.target.result}" class="photo-upload-preview" alt="预览"><div style="position:absolute;top:8px;right:8px;background:rgba(157,41,51,0.9);color:#fff;border:none;padding:4px 8px;border-radius:4px;font-size:12px;cursor:pointer;" onclick="event.stopPropagation();resetPhotoUpload()">重新上传</div>`;
  };
  reader.readAsDataURL(file);
}

function resetPhotoUpload() {
  uploadedPhotoData = null;
  document.getElementById('checkinPhotoInput').value = '';
  const area = document.getElementById('photoUploadArea');
  area.classList.remove('has-photo');
  area.innerHTML = `
    <div class="photo-upload-placeholder">📷</div>
    <div style="font-size:13px;color:var(--ink-muted);">点击上传照片</div>
    <div style="font-size:11px;color:var(--ink-light);margin-top:4px;">支持 JPG/PNG 格式</div>`;
}

function submitCheckin(month) {
  if (!selectedCheckinPet) {
    TNR_UI.toast('请选择打卡宠物', 'warning');
    return;
  }
  const note = document.getElementById('checkinNote').value.trim();
  if (!note) {
    TNR_UI.toast('请填写近况说明', 'warning');
    return;
  }

  const user = getCurrentUser();
  const pet = TNR_DB.getById(TNR_DB.KEYS.pets, selectedCheckinPet);
  if (!pet) {
    TNR_UI.toast('宠物信息不存在', 'danger');
    return;
  }

  // 检查是否已打卡
  const existing = TNR_DB.getAllRaw(TNR_DB.KEYS.checkIns).find(c =>
    c.petId === selectedCheckinPet && c.month === month
  );
  if (existing) {
    TNR_UI.toast('本月已打卡，请勿重复提交', 'warning');
    return;
  }

  TNR_DB.create(TNR_DB.KEYS.checkIns, {
    petId: selectedCheckinPet,
    petCode: pet.code,
    adopterId: user.id,
    adopterName: user.name,
    month: month,
    photo: uploadedPhotoData || '',
    note: note,
    status: 'pending',
    createdAt: TNR_UI.formatDateTime(new Date())
  });

  TNR_UI.toast('打卡提交成功，等待审核', 'success');
  renderCheckin();
}

function renderMessages() {
  const messages = getMyMessages();
  const container = document.getElementById('messagesList');

  if (messages.length === 0) {
    container.innerHTML = `
      <div class="empty-state">

  let html = '<div style="font-size:12px;color:var(--ink-light);margin-bottom:8px;">共 ' + messages.length + ' 条消息，' + messages.filter(m => !m.isRead).length + ' 条未读</div>';

  sorted.forEach(msg => {
    const icon = getMessageTypeIcon(msg.type);
    const typeLabel = getMessageTypeLabel(msg.type);
    const iconBg = msg.isRead ? 'var(--rice-warm)' : 'var(--cinnabar-light)';

    html += `
      <div class="message-item ${msg.isRead ? '' : 'unread'}" onclick="showMessageDetail('${msg.id}')">

        <div class="message-content">

          <div class="message-preview">${TNR_UI.escape(msg.content || '')}</div>
          <div class="message-time">${TNR_UI.escape(msg.createdAt || '')} · ${typeLabel}</div>
        </div>
      </div>`;
  });

  container.innerHTML = html;
  updateMessageBadge();
}

function showMessageDetail(messageId) {
  const msg = TNR_DB.getById(TNR_DB.KEYS.messages, messageId);
  if (!msg) return;

  // 标记已读
  if (!msg.isRead) {
    TNR_DB.update(TNR_DB.KEYS.messages, messageId, { isRead: true });
  }

  const icon = getMessageTypeIcon(msg.type);
  const typeLabel = getMessageTypeLabel(msg.type);

  let html = '<div class="message-detail-content">';
  html += `<div class="message-detail-title">${TNR_UI.escape(msg.title)}</div>`;
  html += `<div class="message-detail-meta">`;
  html += `<span>${icon} ${typeLabel}</span>`;
  html += `<span>${TNR_UI.escape(msg.createdAt || '—')}</span>`;
  html += `</div>`;
  html += `<div class="message-detail-body">${TNR_UI.escape(msg.content || '暂无内容')}</div>`;
  html += `</div>`;

  document.getElementById('messageDetailContent').innerHTML = html;
  showOverlay('messageDetailOverlay');

  // 重新渲染消息列表和角标
  setTimeout(() => {
    renderMessages();
    updateMessageBadge();
  }, 300);
}

  html += `<input type="tel" class="form-input" id="profilePhone" value="${TNR_UI.escape(user.phone || '')}" placeholder="请输入手机号码">`;
  html += '</div>';
  html += '<div class="form-group">';
  html += '<label class="form-label">联系地址</label>';
  html += `<input type="text" class="form-input" id="profileAddress" value="${TNR_UI.escape(user.address || '')}" placeholder="请输入联系地址">`;
  html += '</div>';
  html += `<button class="btn btn-primary w-full" onclick="saveProfile()">保存修改</button>`;
  html += '</div>';
  html += '</div>';

  // 其他
  html += '<div class="profile-section">';
  html += '<div class="profile-section-header">⚙️ 其他</div>';
  html += '<div class="profile-row" onclick="aboutApp()">';
  html += '<div class="profile-row-label">ℹ️ 关于系统</div>';
  html += '<div class="profile-row-value"><span class="profile-row-arrow">›</span></div>';
  html += '</div>';
  html += '<div class="profile-row" onclick="doLogout()">';
  html += '<div class="profile-row-label" style="color:var(--cinnabar);">🚪 退出登录</div>';
  html += '<div class="profile-row-value"><span class="profile-row-arrow">›</span></div>';
  html += '</div>';
  html += '</div>';

  // 版本信息
  html += '<div style="text-align:center;padding:16px;color:var(--ink-light);font-size:11px;">';
  html += 'TNR流浪动物管理系统 · 领养人端<br>v1.0.0';
  html += '</div>';

  document.getElementById('profileContent').innerHTML = html;
}

function saveProfile() {
  const user = getCurrentUser();
  if (!user) return;

  const name = document.getElementById('profileName').value.trim();
  const phone = document.getElementById('profilePhone').value.trim();
  const address = document.getElementById('profileAddress').value.trim();

  if (!name) {
    TNR_UI.toast('请输入姓名', 'warning');
    return;
  }
  if (!phone) {
    TNR_UI.toast('请输入手机号码', 'warning');
    return;
  }

  const updated = TNR_DB.update(TNR_DB.KEYS.users, user.id, { name, phone, address });
  if (updated) {
    TNR_DB.setCurrentUser(updated);
    TNR_UI.toast('资料修改成功', 'success');
    renderProfile();
  } else {
    TNR_UI.toast('修改失败，请重试', 'danger');
  }
}

function aboutApp() {
  TNR_UI.modal({
    title: '关于系统',
    body: `
      <div style="text-align:center;padding:16px 0;">
        <div style="font-size:48px;margin-bottom:12px;">🐾</div>
        <div style="font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--ink);margin-bottom:4px;">TNR流浪动物管理系统</div>
        <div style="font-size:13px;color:var(--ink-light);margin-bottom:16px;">领养人端 v1.0.0</div>
        <div style="font-size:13px;color:var(--ink-muted);line-height:1.8;text-align:left;padding:0 16px;">
          TNR（捕捉-绝育-放养）是一种人道化的流浪动物治理模式。本系统致力于规范流浪动物管理全流程，实现可溯源、可监管、可闭环治理。
        </div>
        <div style="margin-top:16px;font-size:12px;color:var(--ink-light);">
          © 2025 TNR管理系统
        </div>
      </div>
    `,
    actions: '<button class="btn btn-primary" onclick="document.querySelector(\'.modal-overlay\').remove()">确定</button>'
  });
}

// === 初始化 ===

(function init() {
  // 检查是否已登录
  const user = getCurrentUser();
  if (user && user.role === 'adopter') {
    showMainApp();
  } else {
    // 未登录，显示登录页
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('mainApp').classList.add('hidden');
  }

  // 回车键登录
  document.getElementById('loginPassword').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('loginUsername').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
})();

</script>
