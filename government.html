<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>政府监管端 - TNR流浪动物管理系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tnr-traditional.css">
  <style>
    .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--grad-sidebar);padding:var(--sp-4)}
    .login-card{background:var(--white);border-radius:var(--r-2xl);box-shadow:var(--shadow-lg);padding:var(--sp-10);max-width:400px;width:100%}
    .login-header{text-align:center;margin-bottom:var(--sp-8)}
    .login-header .seal-decoration{margin:0 auto var(--sp-4);width:64px;height:64px;font-size:var(--fs-3xl)}
    .login-header h1{font-family:var(--font-display);font-size:var(--fs-2xl);color:var(--ink);margin-bottom:var(--sp-1)}
    .login-header p{font-size:var(--fs-md);color:var(--ink-muted)}
    .login-quick{display:flex;gap:var(--sp-3);margin-top:var(--sp-4)}
    .login-quick button{flex:1}
    .chart-bar-container{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3)}
    .chart-bar-label{width:80px;font-size:var(--fs-sm);color:var(--ink-muted);text-align:right;flex-shrink:0}
    .chart-bar-track{flex:1;height:24px;background:var(--rice-warm);border-radius:var(--r-sm);overflow:hidden}
    .chart-bar-fill{height:100%;background:var(--grad-cinnabar);border-radius:var(--r-sm);transition:width .6s;display:flex;align-items:center;justify-content:flex-end;padding-right:var(--sp-2);color:#fff;font-size:var(--fs-xs);font-weight:600;min-width:30px}
    .chart-bar-fill.green{background:var(--grad-bamboo)}
    .chart-bar-fill.gold{background:var(--grad-gold)}
    .chart-bar-fill.blue{background:var(--azurite)}
    .log-entry{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-faint);display:flex;align-items:center;gap:var(--sp-3)}
    .log-time{font-size:var(--fs-xs);color:var(--ink-light);white-space:nowrap;font-variant-numeric:tabular-nums}
    .log-action{font-size:var(--fs-sm);color:var(--ink-text);font-weight:500;min-width:100px}
    .log-detail{font-size:var(--fs-xs);color:var(--ink-muted);flex:1}
    .alert-item{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);margin-bottom:var(--sp-2)}
    .alert-item.warning{background:var(--autumn-light);border-left:3px solid var(--autumn-gold)}
    .alert-item.danger{background:var(--rouge-light);border-left:3px solid var(--rouge)}
    .alert-icon{font-size:20px}
    .alert-text{flex:1;font-size:var(--fs-sm)}
    .topbar-logout{width:36px;height:36px;border:none;background:var(--rice-paper);border-radius:var(--r-md);cursor:pointer;font-size:16px;color:var(--ink-muted);display:flex;align-items:center;justify-content:center}
    .topbar-logout:hover{background:var(--rouge-light);color:var(--rouge)}
    .role-perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--sp-3)}
    .role-perm-card{padding:var(--sp-3) var(--sp-4);border:1px solid var(--border-light);border-radius:var(--r-md);background:var(--rice-light)}
    .role-perm-card h4{font-family:var(--font-display);font-size:var(--fs-md);color:var(--ink);margin-bottom:var(--sp-2)}
    .role-perm-card p{font-size:var(--fs-xs);color:var(--ink-muted);line-height:1.6}
    .dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-5);margin-bottom:var(--sp-5)}
    @media(max-width:1024px){.dashboard-grid{grid-template-columns:1fr}}
    .district-compare-table td{text-align:center}
    .district-compare-table th{text-align:center}
  </style>
</head>
<body>

<!-- ====== 登录页 ====== -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-header">
      <div class="seal-decoration">TNR</div>
      <h1>TNR流浪动物管理系统</h1>
      <p>政府监管端 · 捕捉-绝育-放养</p>
    </div>
    <div class="form-group">
      <label class="form-label">用户名</label>
      <input type="text" class="form-input" id="loginUsername" value="admin" placeholder="请输入用户名">
    </div>
    <div class="form-group">
      <label class="form-label">密码</label>
      <input type="password" class="form-input" id="loginPassword" value="123456" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-primary w-full" style="margin-top:var(--sp-4);" onclick="doLogin()">登 录</button>
    <div class="login-quick">
      <button class="btn btn-secondary btn-sm" onclick="quickLogin('admin','123456')">市级管理员</button>
      <button class="btn btn-secondary btn-sm" onclick="quickLogin('cy_gov','123456')">区级管理员(朝阳)</button>
    </div>
  </div>
</div>

<!-- ====== 主应用 ====== -->
<div id="app" class="hidden">
  <div class="admin-layout">
    <div id="sidebarContainer"></div>
    <div class="admin-main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="topbar-toggle" id="sidebarToggle">☰</button>
          <div class="topbar-title" id="topbarTitle">数据大屏</div>
        </div>
        <div class="topbar-right">
          <div class="topbar-district" id="topbarDistrict">
            <span class="topbar-district-dot"></span>
            <span id="topbarDistrictText">全市</span>
          </div>
          <div class="topbar-time" id="topbarTime"></div>
          <button class="topbar-logout" id="logoutBtn" title="退出登录">⏻</button>
        </div>
      </div>
      <div class="admin-content">
        <div class="page-view active" id="page-dashboard"></div>
        <div class="page-view" id="page-institutions"></div>
        <div class="page-view" id="page-accounts"></div>
        <div class="page-view" id="page-districts"></div>
        <div class="page-view" id="page-supervision"></div>
        <div class="page-view" id="page-material"></div>
        <div class="page-view" id="page-ledger"></div>
        <div class="page-view" id="page-settings"></div>
        <div class="page-view" id="page-profile"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/tnr-data.js"></script>
<script src="js/tnr-common.js"></script>
<script>
/* ============================================
   政府监管端 - 应用逻辑
   ============================================ */

// ===== 全局状态 =====
let currentUser = null;
const instState = { tab: 'community' };
const supState = { tab: 'capture' };
const ledgerState = { tab: 'capture' };
const settingsState = { tab: 'prefix' };

// ===== 导航配置 =====
const NAV_GROUPS = [
  { title: '数据总览', items: [
    { id: 'dashboard', icon: '📊', label: '数据大屏' }
  ]},
  { title: '机构管理', items: [
    { id: 'institutions', icon: '🏢', label: '机构基础管理' }
  ]},
  { title: '权限管理', items: [
    { id: 'accounts', icon: '🔐', label: '账号权限管理' },
    { id: 'districts', icon: '🗺️', label: '区县管理' }
  ]},
  { title: '业务监管', items: [
    { id: 'supervision', icon: '📋', label: '全业务监管' }
  ]},
  { title: '物料监管', items: [
    { id: 'material', icon: '📦', label: '物料全局监管' }
  ]},
  { title: '台账中心', items: [
    { id: 'ledger', icon: '📑', label: '全局台账中心' }
  ]},
  { title: '系统配置', items: [
    { id: 'settings', icon: '⚙️', label: '系统配置' }
  ]},
  { title: '系统', items: [
    { id: 'profile', icon: '👤', label: '个人中心' }
  ]}
];

const PAGES = {
  dashboard: { title: '数据大屏', render: renderDashboard },
  institutions: { title: '机构基础管理', render: renderInstitutions },
  accounts: { title: '账号权限管理', render: renderAccounts },
  districts: { title: '区县管理', render: renderDistricts },
  supervision: { title: '全业务监管', render: renderSupervision },
  material: { title: '物料全局监管', render: renderMaterial },
  ledger: { title: '全局台账中心', render: renderLedger },
  settings: { title: '系统配置', render: renderSettings },
  profile: { title: '个人中心', render: renderProfile }
};

// ===== 辅助函数 =====
function getDistrictName(id) {
  if (!id) return '全市';
  const d = TNR_DB.getById(TNR_DB.KEYS.districts, id);
  return d ? d.name : id;
}
function getInstitutionName(id) {
  if (!id) return '—';
  const inst = TNR_DB.getById(TNR_DB.KEYS.institutions, id);
  return inst ? inst.name : id;
}
function getRoleName(role) {
  return { gov_city: '市级管理员', gov_district: '区级管理员', shelter: '捕捉点操作员', hospital: '医院操作员', adopter: '领养人' }[role] || role;
}
function getRoleBadge(role) {
  return { gov_city: 'badge-ink', gov_district: 'badge-info', shelter: 'badge-cinnabar', hospital: 'badge-success', adopter: 'badge-warning' }[role] || 'badge-default';
}
function getStatusBadge(status) {
  const map = { active: { text: '启用', badge: 'badge-success' }, disabled: { text: '停用', badge: 'badge-danger' } };
  return map[status] || { text: status, badge: 'badge-default' };
}
function getInstTypeLabel(type) {
  return { community: '小区', hospital: '医院', shelter: '捕捉点' }[type] || type;
}
function logOperation(action, detail) {
  const logs = JSON.parse(localStorage.getItem('tnr_operation_logs') || '[]');
  logs.unshift({
    id: 'LOG' + Date.now(),
    action, detail,
    operator: currentUser.name,
    operatorId: currentUser.id,
    time: new Date().toISOString().replace('T', ' ').substr(0, 19)
  });
  if (logs.length > 200) logs.length = 200;
  localStorage.setItem('tnr_operation_logs', JSON.stringify(logs));
}
function getOperationLogs(userId) {
  const logs = JSON.parse(localStorage.getItem('tnr_operation_logs') || '[]');
  return userId ? logs.filter(l => l.operatorId === userId) : logs;
}
function getUsersForCurrentUser() {
  const all = TNR_DB.getAllRaw(TNR_DB.KEYS.users);
  if (currentUser.role === 'gov_city') return all;
  return all.filter(u => u.districtId === currentUser.districtId);
}
function canCreateRole(role) {
  if (currentUser.role === 'gov_city') return true;
  if (currentUser.role === 'gov_district') return ['shelter', 'hospital', 'adopter'].includes(role);
  return false;
}
function isCityLevel() { return currentUser && currentUser.role === 'gov_city'; }

// ===== 登录/登出 =====
function showLogin() {
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}
function doLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const user = TNR_DB.login(username, password);
  if (!user) { TNR_UI.toast('用户名或密码错误', 'danger'); return; }
  if (user.role !== 'gov_city' && user.role !== 'gov_district') {
    TNR_UI.toast('该账号无权访问政府监管端', 'danger');
    TNR_DB.logout();
    return;
  }
  currentUser = user;
  showApp();
  TNR_UI.toast('登录成功，欢迎回来', 'success');
}
function quickLogin(u, p) {
  document.getElementById('loginUsername').value = u;
  document.getElementById('loginPassword').value = p;
  doLogin();
}
function doLogout() {
  TNR_UI.confirm('确认退出登录？', '退出确认').then(ok => {
    if (ok) { TNR_DB.logout(); currentUser = null; showLogin(); }
  });
}

// ===== 应用初始化 =====
function showApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  const sidebarHTML = TNR_UI.renderSidebar({
    brand: { name: 'TNR监管端', icon: '🏛️' },
    brandSub: '流浪动物管理系统',
    navGroups: NAV_GROUPS,
    user: {
      avatar: currentUser.name.substr(0, 1),
      name: currentUser.name,
      role: getRoleName(currentUser.role)
    },
    activeId: 'dashboard'
  });
  document.getElementById('sidebarContainer').innerHTML = sidebarHTML;
  TNR_UI.bindSidebar(onNavigate);
  TNR_UI.startClock();

  document.getElementById('topbarDistrictText').textContent = isCityLevel() ? '全市' : getDistrictName(currentUser.districtId);
  document.getElementById('logoutBtn').addEventListener('click', doLogout);

  onNavigate('dashboard');
}

function onNavigate(navId) {
  const page = PAGES[navId];
  if (!page) return;
  document.getElementById('topbarTitle').textContent = page.title;
  page.render();
}

/* ============================================
   1. 数据大屏
   ============================================ */
function renderDashboard() {
  const captures = TNR_DB.getAll(TNR_DB.KEYS.captures);
  const treatments = TNR_DB.getAll(TNR_DB.KEYS.treatments);
  const releases = TNR_DB.getAll(TNR_DB.KEYS.releases);
  const adoptions = TNR_DB.getAll(TNR_DB.KEYS.adoptions);
  const euthanasia = TNR_DB.getAll(TNR_DB.KEYS.euthanasia);
  const pets = TNR_DB.getAll(TNR_DB.KEYS.pets);

  const totalCaptures = captures.reduce((s, c) => s + (c.petCount || 0), 0);
  const totalTreatments = treatments.length;
  const totalReleases = releases.length;
  const totalAdoptions = adoptions.length;
  const totalEuthanasia = euthanasia.length;
  const inTransit = pets.filter(p => p.status === 'in_transit').length;

  // 区县统计
  let districts = TNR_DB.getAllRaw(TNR_DB.KEYS.districts);
  const df = TNR_DB.getDistrictFilter();
  if (df) districts = districts.filter(d => d.id === df);

  const districtStats = districts.map(d => {
    const dc = TNR_DB.getAllRaw(TNR_DB.KEYS.captures).filter(c => c.districtId === d.id);
    const dt = TNR_DB.getAllRaw(TNR_DB.KEYS.treatments).filter(t => t.districtId === d.id);
    const dr = TNR_DB.getAllRaw(TNR_DB.KEYS.releases).filter(r => r.districtId === d.id);
    const da = TNR_DB.getAllRaw(TNR_DB.KEYS.adoptions).filter(a => a.districtId === d.id);
    const de = TNR_DB.getAllRaw(TNR_DB.KEYS.euthanasia).filter(e => e.districtId === d.id);
    const dp = TNR_DB.getAllRaw(TNR_DB.KEYS.pets).filter(p => p.districtId === d.id);
    return {
      d,
      captures: dc.reduce((s, c) => s + (c.petCount || 0), 0),
      treatments: dt.length, releases: dr.length,
      adoptions: da.length, euthanasia: de.length,
      inTransit: dp.filter(p => p.status === 'in_transit').length
    };
  });

  // 物料统计
  const txns = TNR_DB.getAll(TNR_DB.KEYS.materialTxns);
  const matPurchase = txns.filter(t => t.type === 'purchase').reduce((s, t) => s + t.quantity, 0);
  const matDispatch = txns.filter(t => t.type === 'dispatch').reduce((s, t) => s + t.quantity, 0);
  const matConsume = txns.filter(t => t.type === 'consume').reduce((s, t) => s + t.quantity, 0);

  // 物料消耗柱状图
  const materials = TNR_DB.getAllRaw(TNR_DB.KEYS.materials);
  const matChart = materials.map(m => {
    const consumed = txns.filter(t => t.materialId === m.id && t.type === 'consume').reduce((s, t) => s + t.quantity, 0);
    return { label: m.name, value: consumed, color: '' };
  });
  const matMax = Math.max(...matChart.map(m => m.value), 1);

  // 最近活动
  const activities = [];
  captures.forEach(c => activities.push({ time: c.createdAt, title: '捕捉登记', desc: c.communityName + ' · ' + c.petCount + '只', type: 'capture' }));
  const transfers = TNR_DB.getAll(TNR_DB.KEYS.transfers);
  transfers.forEach(t => activities.push({ time: t.createdAt, title: '转运交接', desc: t.fromShelterName + ' → ' + t.toHospitalName, type: 'transfer' }));
  treatments.forEach(t => activities.push({ time: t.createdAt, title: '诊疗记录', desc: t.petCode + ' · ' + t.hospitalName, type: 'treatment' }));
  releases.forEach(r => activities.push({ time: r.createdAt, title: '放养登记', desc: r.petCode + ' → ' + r.communityName, type: 'release' }));
  adoptions.forEach(a => activities.push({ time: a.createdAt, title: '领养登记', desc: a.petCode + ' · ' + a.adopterName, type: 'adoption' }));
  euthanasia.forEach(e => activities.push({ time: e.createdAt, title: '安乐死处置', desc: e.petCode + ' · ' + e.hospitalName, type: 'euthanasia' }));
  activities.sort((a, b) => new Date(b.time) - new Date(a.time));
  const recentActivities = activities.slice(0, 8);

  const activityIcons = { capture: '🐾', transfer: '🚐', treatment: '🏥', release: '🌱', adoption: '🏠', euthanasia: '⚖️' };

  const el = document.getElementById('page-dashboard');
  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-card-icon">🐾</div>
        <div><div class="stat-card-value">${totalCaptures}</div><div class="stat-card-label">捕捉总量</div></div>
      </div>
      <div class="stat-card blue">
        <div class="stat-card-icon">🏥</div>
        <div><div class="stat-card-value">${totalTreatments}</div><div class="stat-card-label">诊疗总量</div></div>
      </div>
      <div class="stat-card green">
        <div class="stat-card-icon">🌱</div>
        <div><div class="stat-card-value">${totalReleases}</div><div class="stat-card-label">放养总量</div></div>
      </div>
      <div class="stat-card gold">
        <div class="stat-card-icon">🏠</div>
        <div><div class="stat-card-value">${totalAdoptions}</div><div class="stat-card-label">领养总量</div></div>
      </div>
      <div class="stat-card rouge">
        <div class="stat-card-icon">⚖️</div>
        <div><div class="stat-card-value">${totalEuthanasia}</div><div class="stat-card-label">安乐死数量</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon">🚐</div>
        <div><div class="stat-card-value">${inTransit}</div><div class="stat-card-label">在途动物</div></div>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><span class="card-title-bar"></span>区县业务统计</div>
        </div>
        <div class="card-body card-body-flush">
          <div class="table-wrapper" style="border:none;">
            <table class="data-table district-compare-table">
              <thead><tr>
                <th style="text-align:left;">区县</th>
                <th>捕捉</th><th>诊疗</th><th>放养</th><th>领养</th><th>安乐死</th><th>在途</th>
              </tr></thead>
              <tbody>
                ${districtStats.length ? districtStats.map(ds => `
                  <tr>
                    <td style="text-align:left;font-weight:600;">${ds.d.name}</td>
                    <td>${ds.captures}</td><td>${ds.treatments}</td><td>${ds.releases}</td>
                    <td>${ds.adoptions}</td><td>${ds.euthanasia}</td><td>${ds.inTransit}</td>
                  </tr>
                `).join('') : '<tr><td colspan="7" class="table-empty">暂无数据</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title"><span class="card-title-bar"></span>物料消耗统计</div>
        </div>
        <div class="card-body">
          <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:var(--sp-5);">
            <div><div class="fs-2xl font-bold font-display" style="color:var(--ink);">${matPurchase}</div><div class="fs-sm text-muted">采购总量</div></div>
            <div><div class="fs-2xl font-bold font-display" style="color:var(--azurite);">${matDispatch}</div><div class="fs-sm text-muted">下发总量</div></div>
            <div><div class="fs-2xl font-bold font-display" style="color:var(--cinnabar);">${matConsume}</div><div class="fs-sm text-muted">消耗总量</div></div>
          </div>
          ${matChart.map(m => `
            <div class="chart-bar-container">
              <div class="chart-bar-label">${m.label}</div>
              <div class="chart-bar-track">
                <div class="chart-bar-fill" style="width:${(m.value / matMax * 100).toFixed(1)}%">${m.value}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="card-title-bar"></span>最近业务动态</div>
      </div>
      <div class="card-body">
        <div class="timeline">
          ${recentActivities.length ? recentActivities.map(a => `
            <div class="timeline-item">
              <div class="timeline-time">${a.time || '—'}</div>
              <div class="timeline-title">${activityIcons[a.type] || '📋'} ${a.title}</div>
              <div class="timeline-desc">${TNR_UI.escape(a.desc)}</div>
            </div>
          `).join('') : '<div class="table-empty">暂无动态</div>'}
        </div>
      </div>
    </div>
  `;
}

/* ============================================
   2. 机构基础管理
   ============================================ */
function renderInstitutions() {
  const el = document.getElementById('page-institutions');
  const typeLabels = { community: '小区', hospital: '医院', shelter: '捕捉点' };
  el.innerHTML = `
    <div class="tabs">
      ${Object.keys(typeLabels).map(t => `
        <div class="tab-item ${instState.tab === t ? 'active' : ''}" data-inst-tab="${t}">${typeLabels[t]}管理</div>
      `).join('')}
    </div>
    <div id="instContent"></div>
  `;
  el.querySelectorAll('[data-inst-tab]').forEach(tab => {
    tab.addEventListener('click', () => { instState.tab = tab.dataset.instTab; renderInstitutions(); });
  });
  renderInstitutionsContent();
}

function renderInstitutionsContent() {
  const districts = TNR_DB.getAllRaw(TNR_DB.KEYS.districts).filter(d => d.status === 'active');
  const typeLabels = { community: '小区', hospital: '医院', shelter: '捕捉点' };
  const contentEl = document.getElementById('instContent');
  contentEl.innerHTML = TNR_UI.renderFilterBar([
    { key: 'district', label: '区县', type: 'select', options: districts.map(d => ({ value: d.id, label: d.name })) },
    { key: 'status', label: '状态', type: 'select', options: [{ value: 'active', label: '启用' }, { value: 'disabled', label: '停用' }] },
    { key: 'search', label: '搜索', type: 'search', placeholder: '名称/地址/联系人' }
  ], `<button class="btn btn-primary btn-sm" onclick="showInstitutionModal()">+ 新增${typeLabels[instState.tab]}</button>`)
    + '<div class="table-wrapper" id="instTableWrapper"></div>';
  renderInstitutionsTable();

}

function renderInstitutionsTable() {
  const filters = TNR_UI.getFilterValues();
  let data = TNR_DB.getAllRaw(TNR_DB.KEYS.institutions).filter(i => i.type === instState.tab);
  if (!isCityLevel()) data = data.filter(i => i.districtId === currentUser.districtId);
  if (filters.district) data = data.filter(i => i.districtId === filters.district);
  if (filters.status) data = data.filter(i => i.status === filters.status);
  if (filters.search) {
    const s = filters.search;
    data = data.filter(i => (i.name && i.name.toLowerCase().includes(s)) || (i.address && i.address.toLowerCase().includes(s)) || (i.contact && i.contact.toLowerCase().includes(s)));
  }

  const columns = [
    { key: 'id', title: '编号', width: '90px' },
    { key: 'name', title: '名称', render: r => TNR_UI.escape(r.name) },
    { key: 'districtId', title: '区县', render: r => getDistrictName(r.districtId) },
    { key: 'address', title: '地址', render: r => TNR_UI.escape(r.address || '—') },
    { key: 'contact', title: '联系人', render: r => TNR_UI.escape(r.contact || '—') },
    { key: 'phone', title: '电话', render: r => TNR_UI.escape(r.phone || '—') },
    { key: 'status', title: '状态', render: r => { const s = getStatusBadge(r.status); return `<span class="badge ${s.badge}">${s.text}</span>`; } }
  ];
  const rowActions = r => `
    <button class="btn-link" onclick="showInstitutionModal('${r.id}')">编辑</button>
    <button class="btn-link ${r.status === 'active' ? 'danger' : 'success'}" onclick="toggleInstitutionStatus('${r.id}')">${r.status === 'active' ? '停用' : '启用'}</button>
    <button class="btn-link danger" onclick="deleteInstitution('${r.id}')">删除</button>
  `;
  document.getElementById('instTableWrapper').innerHTML = TNR_UI.renderTable({ columns, data, rowActions, emptyText: '暂无机构数据' });
}

function showInstitutionModal(id) {
  const inst = id ? TNR_DB.getById(TNR_DB.KEYS.institutions, id) : null;
  const districts = TNR_DB.getAllRaw(TNR_DB.KEYS.districts).filter(d => d.status === 'active');
  const typeLabels = { community: '小区', hospital: '医院', shelter: '捕捉点' };

  const body = `
    <div class="form-group">
      <label class="form-label">名称<span class="req">*</span></label>
      <input type="text" class="form-input" id="inst-name" value="${inst ? TNR_UI.escape(inst.name) : ''}" placeholder="请输入${typeLabels[instState.tab]}名称">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">所属区县<span class="req">*</span></label>
        <select class="form-select" id="inst-district">
          ${districts.map(d => `<option value="${d.id}" ${inst && inst.districtId === d.id ? 'selected' : ''}>${d.name}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">状态</label>
        <select class="form-select" id="inst-status">
          <option value="active" ${!inst || inst.status === 'active' ? 'selected' : ''}>启用</option>
          <option value="disabled" ${inst && inst.status === 'disabled' ? 'selected' : ''}>停用</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">地址</label>
      <input type="text" class="form-input" id="inst-address" value="${inst ? TNR_UI.escape(inst.address || '') : ''}" placeholder="请输入详细地址">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">联系人</label>
        <input type="text" class="form-input" id="inst-contact" value="${inst ? TNR_UI.escape(inst.contact || '') : ''}" placeholder="请输入联系人">
      </div>
      <div class="form-group">
        <label class="form-label">联系电话</label>
        <input type="text" class="form-input" id="inst-phone" value="${inst ? TNR_UI.escape(inst.phone || '') : ''}" placeholder="请输入电话">
      </div>
    </div>
  `;

  const m = TNR_UI.modal({
    title: inst ? `编辑${typeLabels[instState.tab]}` : `新增${typeLabels[instState.tab]}`,
    body, size: 'lg',
    actions: `<button class="btn btn-secondary" data-action="cancel">取消</button><button class="btn btn-primary" id="instSave">保存</button>`
  });
  m.overlay.querySelector('[data-action="cancel"]').addEventListener('click', m.close);
  m.overlay.querySelector('#instSave').addEventListener('click', () => {
    const name = document.getElementById('inst-name').value.trim();
    if (!name) { TNR_UI.toast('请输入名称', 'warning'); return; }
    const data = {
      name, type: instState.tab,
      districtId: document.getElementById('inst-district').value,
      address: document.getElementById('inst-address').value.trim(),
      contact: document.getElementById('inst-contact').value.trim(),
      phone: document.getElementById('inst-phone').value.trim(),
      status: document.getElementById('inst-status').value
    };
    if (inst) {
      TNR_DB.update(TNR_DB.KEYS.institutions, inst.id, data);
      logOperation('编辑机构', `${typeLabels[instState.tab]}：${name}`);
      TNR_UI.toast('机构更新成功', 'success');
    } else {
      TNR_DB.create(TNR_DB.KEYS.institutions, data);
      logOperation('新增机构', `${typeLabels[instState.tab]}：${name}`);
      TNR_UI.toast('机构创建成功', 'success');
    }
    m.close();
    renderInstitutionsTable();
  });
}

function toggleInstitutionStatus(id) {
  const inst = TNR_DB.getById(TNR_DB.KEYS.institutions, id);
  if (!inst) return;
  const newStatus = inst.status === 'active' ? 'disabled' : 'active';
  TNR_DB.update(TNR_DB.KEYS.institutions, id, { status: newStatus });
  logOperation(newStatus === 'active' ? '启用机构' : '停用机构', inst.name);
  TNR_UI.toast(`已${newStatus === 'active' ? '启用' : '停用'}：${inst.name}`, 'success');
  renderInstitutionsTable();
}

function deleteInstitution(id) {
  const inst = TNR_DB.getById(TNR_DB.KEYS.institutions, id);
  TNR_UI.confirm(`确认删除机构「${inst ? inst.name : id}」？此操作不可撤销。`, '删除确认').then(ok => {
    if (ok) {
      TNR_DB.delete(TNR_DB.KEYS.institutions, id);
      logOperation('删除机构', inst ? inst.name : id);
      TNR_UI.toast('机构已删除', 'success');
      renderInstitutionsTable();
    }
  });
}

function showAccountModal(id) {
  const user = id ? TNR_DB.getById(TNR_DB.KEYS.users, id) : null;
  const districts = TNR_DB.getAllRaw(TNR_DB.KEYS.districts).filter(d => d.status === 'active');
  const allRoles = [
    { value: 'gov_city', label: '市级管理员' }, { value: 'gov_district', label: '区级管理员' },
    { value: 'shelter', label: '捕捉点操作员' }, { value: 'hospital', label: '医院操作员' }, { value: 'adopter', label: '领养人' }
  ];
  const availableRoles = allRoles.filter(r => canCreateRole(r.value));

  const body = `
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">用户名<span class="req">*</span></label>
        <input type="text" class="form-input" id="acct-username" value="${user ? TNR_UI.escape(user.username) : ''}" placeholder="登录用户名" ${user ? 'disabled' : ''}>
      </div>
      <div class="form-group">
        <label class="form-label">${user ? '新密码（留空不改）' : '密码'}<span class="req">*</span></label>
        <input type="text" class="form-input" id="acct-password" value="${user ? '' : '123456'}" placeholder="请输入密码">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">姓名<span class="req">*</span></label>
        <input type="text" class="form-input" id="acct-name" value="${user ? TNR_UI.escape(user.name) : ''}" placeholder="请输入姓名">
      </div>
      <div class="form-group">
        <label class="form-label">角色<span class="req">*</span></label>
        <select class="form-select" id="acct-role" onchange="onAccountRoleChange()">
          ${availableRoles.map(r => `<option value="${r.value}" ${user && user.role === r.value ? 'selected' : ''}>${r.label}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">所属区县</label>
        <select class="form-select" id="acct-district" onchange="onAccountDistrictChange()">
          <option value="">无</option>
          ${districts.map(d => `<option value="${d.id}" ${user && user.districtId === d.id ? 'selected' : ''}>${d.name}</option>`).join('')}
        </select>
      </div>
      <div class="form-group" id="acct-institution-group">
        <label class="form-label">所属机构</label>
        <select class="form-select" id="acct-institution">
          <option value="">无</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">联系电话</label>
      <input type="text" class="form-input" id="acct-phone" value="${user ? TNR_UI.escape(user.phone || '') : ''}" placeholder="请输入电话">
    </div>
  `;

  const m = TNR_UI.modal({
    title: user ? '编辑账号' : '新增账号', body, size: 'lg',
    actions: `<button class="btn btn-secondary" data-action="cancel">取消</button><button class="btn btn-primary" id="acctSave">保存</button>`
  });
  m.overlay.querySelector('[data-action="cancel"]').addEventListener('click', m.close);
  if (user) onAccountRoleChange();
  else onAccountRoleChange();

  m.overlay.querySelector('#acctSave').addEventListener('click', () => {
    const username = document.getElementById('acct-username').value.trim();
    const name = document.getElementById('acct-name').value.trim();
    const role = document.getElementById('acct-role').value;
    if (!username) { TNR_UI.toast('请输入用户名', 'warning'); return; }
    if (!name) { TNR_UI.toast('请输入姓名', 'warning'); return; }

    const password = document.getElementById('acct-password').value.trim();
    const districtId = document.getElementById('acct-district').value || null;
    const institutionId = document.getElementById('acct-institution').value || null;
    const phone = document.getElementById('acct-phone').value.trim();

    // For gov_city, districtId should be null
    let finalDistrictId = districtId;
    if (role === 'gov_city' || role === 'adopter') finalDistrictId = null;

    if (user) {
      const updates = { name, role, districtId: finalDistrictId, institutionId, phone };
      if (password) updates.password = password;
      TNR_DB.update(TNR_DB.KEYS.users, user.id, updates);
      logOperation('编辑账号', `${username}（${getRoleName(role)}）`);
      TNR_UI.toast('账号更新成功', 'success');
    } else {
      // Check duplicate username
      const exists = TNR_DB.getAllRaw(TNR_DB.KEYS.users).find(u => u.username === username);
      if (exists) { TNR_UI.toast('用户名已存在', 'danger'); return; }
      TNR_DB.create(TNR_DB.KEYS.users, {
        username, password: password || '123456', name, role,
        districtId: finalDistrictId, institutionId, phone, status: 'active'
      });
      logOperation('新增账号', `${username}（${getRoleName(role)}）`);
      TNR_UI.toast('账号创建成功', 'success');
    }
    m.close();
    renderAccountsTable();
  });
}

function onAccountRoleChange() {
  const role = document.getElementById('acct-role').value;
  const group = document.getElementById('acct-institution-group');
  if (role === 'shelter' || role === 'hospital') {
    group.style.display = '';
    const districtId = document.getElementById('acct-district').value;
    const insts = TNR_DB.getAllRaw(TNR_DB.KEYS.institutions).filter(i =>
      i.type === (role === 'shelter' ? 'shelter' : 'hospital') && i.status === 'active' &&
      (!districtId || i.districtId === districtId)
    );
    document.getElementById('acct-institution').innerHTML = '<option value="">无</option>' +
      insts.map(i => `<option value="${i.id}">${i.name}</option>`).join('');
  } else {
    group.style.display = 'none';
  }
}

function onAccountDistrictChange() {
  onAccountRoleChange();
}

function toggleAccountStatus(id) {
  const user = TNR_DB.getById(TNR_DB.KEYS.users, id);
  if (!user) return;
  const newStatus = user.status === 'active' ? 'disabled' : 'active';
  TNR_DB.update(TNR_DB.KEYS.users, id, { status: newStatus });
  logOperation(newStatus === 'active' ? '启用账号' : '停用账号', user.name);
  TNR_UI.toast(`已${newStatus === 'active' ? '启用' : '停用'}：${user.name}`, 'success');
  renderAccountsTable();
}

function deleteAccount(id) {
  const user = TNR_DB.getById(TNR_DB.KEYS.users, id);
  TNR_UI.confirm(`确认删除账号「${user ? user.name : id}」？此操作不可撤销。`, '删除确认').then(ok => {
    if (ok) {
      TNR_DB.delete(TNR_DB.KEYS.users, id);
      logOperation('删除账号', user ? user.name : id);
      TNR_UI.toast('账号已删除', 'success');
      renderAccountsTable();
    }
  });
}

        <option value="disabled" ${dist && dist.status === 'disabled' ? 'selected' : ''}>停用</option>
      </select>
    </div>
  `;
  const m = TNR_UI.modal({
    title: dist ? '编辑区县' : '新增区县', body,
    actions: `<button class="btn btn-secondary" data-action="cancel">取消</button><button class="btn btn-primary" id="distSave">保存</button>`
  });
  m.overlay.querySelector('[data-action="cancel"]').addEventListener('click', m.close);
  m.overlay.querySelector('#distSave').addEventListener('click', () => {
    const name = document.getElementById('dist-name').value.trim();
    const code = document.getElementById('dist-code').value.trim();
    if (!name) { TNR_UI.toast('请输入区县名称', 'warning'); return; }
    if (!code) { TNR_UI.toast('请输入编码', 'warning'); return; }
    const data = { name, code, status: document.getElementById('dist-status').value };
    if (dist) {
      TNR_DB.update(TNR_DB.KEYS.districts, dist.id, data);
      logOperation('编辑区县', name);
      TNR_UI.toast('区县更新成功', 'success');
    } else {
      TNR_DB.create(TNR_DB.KEYS.districts, data);
      logOperation('新增区县', name);
      TNR_UI.toast('区县创建成功', 'success');
    }
    m.close();
    renderDistrictsTable();
  });
}

function renderSupervision() {
  const el = document.getElementById('page-supervision');
  const tabs = [
    { id: 'capture', label: '捕捉监管' },
    { id: 'transfer', label: '转运监管' },
    { id: 'treatment', label: '诊疗监管' },
    { id: 'release', label: '放养监管' },
    { id: 'adoption', label: '领养回访监管' }
  ];
  el.innerHTML = `
    <div class="tabs">
      ${tabs.map(t => `<div class="tab-item ${supState.tab === t.id ? 'active' : ''}" data-sup-tab="${t.id}">${t.label}</div>`).join('')}
    </div>
    <div id="supContent"></div>
    ${isCityLevel() ? '<div id="supCompare"></div>' : ''}
  `;
  el.querySelectorAll('[data-sup-tab]').forEach(tab => {
    tab.addEventListener('click', () => { supState.tab = tab.dataset.supTab; renderSupervision(); });
  });
  renderSupervisionContent();
  if (isCityLevel()) renderSupCompare();
}

function renderSupervisionContent() {
  const districts = TNR_DB.getAllRaw(TNR_DB.KEYS.districts).filter(d => d.status === 'active');
  const contentEl = document.getElementById('supContent');
  contentEl.innerHTML = TNR_UI.renderFilterBar([
    { key: 'district', label: '区县', type: 'select', options: districts.map(d => ({ value: d.id, label: d.name })) },
    { key: 'search', label: '搜索', type: 'search', placeholder: '编号/单据号/名称' }
  ]) + '<div class="table-wrapper" id="supTableWrapper"></div>';
  renderSupervisionTable();
  TNR_UI.bindFilter(() => renderSupervisionTable());
}

function renderSupervisionTable() {
  const filters = TNR_UI.getFilterValues();
  let data, columns, type = supState.tab;

  if (type === 'capture') {
    data = TNR_DB.getAll(TNR_DB.KEYS.captures);
    if (filters.district) data = data.filter(r => r.districtId === filters.district);
    if (filters.search) { const s = filters.search; data = data.filter(r => (r.ledgerNo && r.ledgerNo.toLowerCase().includes(s)) || (r.communityName && r.communityName.toLowerCase().includes(s)) || (r.shelterName && r.shelterName.toLowerCase().includes(s))); }
    columns = [
      { key: 'ledgerNo', title: '单据号', width: '160px' },
      { key: 'shelterName', title: '捕捉点', render: r => TNR_UI.escape(r.shelterName) },
      { key: 'communityName', title: '来源小区', render: r => TNR_UI.escape(r.communityName) },
      { key: 'petCount', title: '动物数', width: '70px' },
      { key: 'districtId', title: '区县', render: r => getDistrictName(r.districtId) },
      { key: 'createdAt', title: '时间', width: '140px' },
      { key: 'status', title: '状态', render: r => `<span class="badge badge-success">已完成</span>` }
    ];
  } else if (type === 'transfer') {
    data = TNR_DB.getAll(TNR_DB.KEYS.transfers);
    if (filters.district) data = data.filter(r => r.districtId === filters.district);
    if (filters.search) { const s = filters.search; data = data.filter(r => (r.ledgerNo && r.ledgerNo.toLowerCase().includes(s)) || (r.fromShelterName && r.fromShelterName.toLowerCase().includes(s)) || (r.toHospitalName && r.toHospitalName.toLowerCase().includes(s))); }
    columns = [
      { key: 'ledgerNo', title: '单据号', width: '160px' },
      { key: 'fromShelterName', title: '出发捕捉点', render: r => TNR_UI.escape(r.fromShelterName) },
      { key: 'toHospitalName', title: '到达医院', render: r => TNR_UI.escape(r.toHospitalName) },
      { key: 'petCount', title: '动物数', width: '70px' },
      { key: 'districtId', title: '区县', render: r => getDistrictName(r.districtId) },
      { key: 'createdAt', title: '时间', width: '140px' },
      { key: 'status', title: '状态', render: r => { const m = { pending: { t: '待接收', b: 'badge-warning' }, received: { t: '已接收', b: 'badge-success' }, rejected: { t: '已驳回', b: 'badge-danger' } }; const s = m[r.status] || { t: r.status, b: 'badge-default' }; return `<span class="badge ${s.b}">${s.t}</span>`; } }
    ];
  } else if (type === 'treatment') {
    data = TNR_DB.getAll(TNR_DB.KEYS.treatments);
    if (filters.district) data = data.filter(r => r.districtId === filters.district);
    if (filters.search) { const s = filters.search; data = data.filter(r => (r.petCode && r.petCode.toLowerCase().includes(s)) || (r.hospitalName && r.hospitalName.toLowerCase().includes(s))); }
    columns = [
      { key: 'petCode', title: '宠物编号', width: '130px' },
      { key: 'hospitalName', title: '诊疗医院', render: r => TNR_UI.escape(r.hospitalName) },
      { key: 'items', title: '诊疗项目', render: r => { const items = []; if (r.items && r.items.sterilization) items.push('绝育'); if (r.items && r.items.vaccine) items.push('疫苗'); if (r.items && r.items.deworming) items.push('驱虫'); if (r.items && r.items.chip) items.push('芯片'); return items.map(i => `<span class="badge badge-info" style="margin-right:4px;">${i}</span>`).join('') || '—'; } },
      { key: 'districtId', title: '区县', render: r => getDistrictName(r.districtId) },
      { key: 'createdAt', title: '时间', width: '140px' },
      { key: 'status', title: '状态', render: r => { const m = { in_progress: { t: '诊疗中', b: 'badge-info' }, completed: { t: '已完成', b: 'badge-success' } }; const s = m[r.status] || { t: r.status, b: 'badge-default' }; return `<span class="badge ${s.b}">${s.t}</span>`; } }
    ];
  } else if (type === 'release') {
    data = TNR_DB.getAll(TNR_DB.KEYS.releases);
    if (filters.district) data = data.filter(r => r.districtId === filters.district);
    if (filters.search) { const s = filters.search; data = data.filter(r => (r.petCode && r.petCode.toLowerCase().includes(s)) || (r.communityName && r.communityName.toLowerCase().includes(s))); }
    columns = [
      { key: 'ledgerNo', title: '单据号', width: '160px' },
      { key: 'petCode', title: '宠物编号', width: '130px' },
      { key: 'communityName', title: '放养小区', render: r => TNR_UI.escape(r.communityName) },
      { key: 'receiverName', title: '接收人', render: r => TNR_UI.escape(r.receiverName || '—') },
      { key: 'districtId', title: '区县', render: r => getDistrictName(r.districtId) },
      { key: 'releasedAt', title: '放养时间', width: '120px' },
      { key: 'status', title: '状态', render: r => `<span class="badge badge-success">已放养</span>` }
    ];
  } else if (type === 'adoption') {
    data = TNR_DB.getAll(TNR_DB.KEYS.adoptions);
    const checkIns = TNR_DB.getAll(TNR_DB.KEYS.checkIns);
    if (filters.district) data = data.filter(r => r.districtId === filters.district);
    if (filters.search) { const s = filters.search; data = data.filter(r => (r.petCode && r.petCode.toLowerCase().includes(s)) || (r.adopterName && r.adopterName.toLowerCase().includes(s))); }
    columns = [
      { key: 'ledgerNo', title: '单据号', width: '160px' },
      { key: 'petCode', title: '宠物编号', width: '130px' },
      { key: 'adopterName', title: '领养人', render: r => TNR_UI.escape(r.adopterName) },
      { key: 'adopterPhone', title: '联系电话', render: r => TNR_UI.escape(r.adopterPhone || '—') },
      { key: 'hospitalName', title: '所属医院', render: r => TNR_UI.escape(r.hospitalName) },
      { key: 'checkinCount', title: '回访打卡', render: r => { const cnt = checkIns.filter(c => c.petId === r.petId).length; return `<span class="badge ${cnt > 0 ? 'badge-success' : 'badge-warning'}">${cnt}次</span>`; } },
      { key: 'districtId', title: '区县', render: r => getDistrictName(r.districtId) },
      { key: 'adoptedAt', title: '领养时间', width: '120px' },
      { key: 'status', title: '状态', render: r => `<span class="badge badge-success">已完成</span>` }
    ];
  }

  const rowActions = r => `<button class="btn-link" onclick="showSupervisionDetail('${type}','${r.id}')">详情</button>`;
  document.getElementById('supTableWrapper').innerHTML = TNR_UI.renderTable({ columns, data, rowActions, emptyText: '暂无监管数据' });
}

function showSupervisionDetail(type, id) {
  let key, record;
  if (type === 'capture') key = TNR_DB.KEYS.captures;
  else if (type === 'transfer') key = TNR_DB.KEYS.transfers;
  else if (type === 'treatment') key = TNR_DB.KEYS.treatments;
  else if (type === 'release') key = TNR_DB.KEYS.releases;
  else if (type === 'adoption') key = TNR_DB.KEYS.adoptions;
  record = TNR_DB.getById(key, id);
  if (!record) return;

  let items = [];
  if (type === 'capture') {
    items = [
      { label: '单据号', value: record.ledgerNo },
      { label: '捕捉点', value: record.shelterName },
      { label: '来源小区', value: record.communityName },
      { label: '详细地址', value: record.address },
      { label: '物业交接人', value: record.contactPerson },
      { label: '联系电话', value: record.contactPhone },
      { label: '动物数量', value: record.petCount },
      { label: '宠物编号', value: (record.petCodes || []).join('、') },
      { label: '操作人', value: record.operatorName },
      { label: '区县', value: getDistrictName(record.districtId) },
      { label: '创建时间', value: record.createdAt }
    ];
  } else if (type === 'transfer') {
    items = [
      { label: '单据号', value: record.ledgerNo },
      { label: '出发捕捉点', value: record.fromShelterName },
      { label: '到达医院', value: record.toHospitalName },
      { label: '动物数量', value: record.petCount },
      { label: '宠物编号', value: (record.petCodes || []).join('、') },
      { label: '操作人', value: record.operatorName },
      { label: '区县', value: getDistrictName(record.districtId) },
      { label: '创建时间', value: record.createdAt },
      { label: '接收时间', value: record.receivedAt || '—' },
      { label: '驳回原因', value: record.rejectReason || '—' }
    ];
  } else if (type === 'treatment') {
    const ti = record.items || {};
    items = [
      { label: '宠物编号', value: record.petCode },
      { label: '诊疗医院', value: record.hospitalName },
      { label: '绝育', value: ti.sterilization ? '是' : '否' },
      { label: '疫苗', value: ti.vaccine ? (record.vaccine ? record.vaccine.type : '是') : '否' },
      { label: '驱虫', value: ti.deworming ? '是' : '否' },
      { label: '芯片', value: ti.chip ? (record.chip ? record.chip.chipNo : '是') : '否' },
      { label: '操作人', value: record.operatorName },
      { label: '区县', value: getDistrictName(record.districtId) },
      { label: '创建时间', value: record.createdAt }
    ];
  } else if (type === 'release') {
    items = [
      { label: '单据号', value: record.ledgerNo },
      { label: '宠物编号', value: record.petCode },
      { label: '放养小区', value: record.communityName },
      { label: '接收人', value: record.receiverName },
      { label: '接收电话', value: record.receiverPhone },
      { label: '操作人', value: record.operatorName },
      { label: '区县', value: getDistrictName(record.districtId) },
      { label: '放养时间', value: record.releasedAt }
    ];
  } else if (type === 'adoption') {
    const checkIns = TNR_DB.getAllRaw(TNR_DB.KEYS.checkIns).filter(c => c.petId === record.petId);
    items = [
      { label: '单据号', value: record.ledgerNo },
      { label: '宠物编号', value: record.petCode },
      { label: '领养人', value: record.adopterName },
      { label: '联系电话', value: record.adopterPhone },
      { label: '身份证号', value: record.adopterIdCard },
      { label: '地址', value: record.adopterAddress },
      { label: '资质情况', value: record.qualification },
      { label: '所属医院', value: record.hospitalName },
      { label: '操作人', value: record.operatorName },
      { label: '区县', value: getDistrictName(record.districtId) },
      { label: '领养时间', value: record.adoptedAt },
      { label: '回访打卡次数', value: checkIns.length + '次', full: true }
    ];
  }

  TNR_UI.drawer({
    title: '业务详情',
    body: bodyEl => {
      bodyEl.innerHTML = TNR_UI.renderDescList(items) +
        (type === 'adoption' && TNR_DB.getAllRaw(TNR_DB.KEYS.checkIns).filter(c => c.petId === record.petId).length > 0 ?
          '<div class="mt-5"><h4 class="font-display mb-3">回访打卡记录</h4><div class="timeline">' +
          TNR_DB.getAllRaw(TNR_DB.KEYS.checkIns).filter(c => c.petId === record.petId).map(c => `
            <div class="timeline-item ${c.status === 'approved' ? 'done' : ''}">
              <div class="timeline-time">${c.month || c.createdAt}</div>
              <div class="timeline-title">${c.status === 'approved' ? '已审核' : '待审核'}</div>
              <div class="timeline-desc">${TNR_UI.escape(c.note || '')}</div>
            </div>
          `).join('') + '</div></div>' : '');
    }
  });
}

function renderSupCompare() {
  const districts = TNR_DB.getAllRaw(TNR_DB.KEYS.districts);
  const data = districts.map(d => {
    const dc = TNR_DB.getAllRaw(TNR_DB.KEYS.captures).filter(c => c.districtId === d.id);
    const dt = TNR_DB.getAllRaw(TNR_DB.KEYS.treatments).filter(t => t.districtId === d.id);
    const dr = TNR_DB.getAllRaw(TNR_DB.KEYS.releases).filter(r => r.districtId === d.id);
    const da = TNR_DB.getAllRaw(TNR_DB.KEYS.adoptions).filter(a => a.districtId === d.id);
    return { name: d.name, captures: dc.reduce((s, c) => s + (c.petCount || 0), 0), treatments: dt.length, releases: dr.length, adoptions: da.length };
  });
  const maxVal = Math.max(...data.flatMap(d => [d.captures, d.treatments, d.releases, d.adoptions]), 1);

  document.getElementById('supCompare').innerHTML = `
    <div class="card mt-5">
      <div class="card-header">
        <div class="card-title"><span class="card-title-bar"></span>跨区县业务对比</div>
      </div>
      <div class="card-body">
        ${data.map(d => `
          <div class="chart-bar-container">
            <div class="chart-bar-label">${d.name}</div>
            <div class="chart-bar-track">
              <div class="chart-bar-fill" style="width:${(d.captures / maxVal * 100).toFixed(1)}%">捕捉 ${d.captures}</div>
            </div>
          </div>
          <div class="chart-bar-container">
            <div class="chart-bar-label"></div>
            <div class="chart-bar-track">
              <div class="chart-bar-fill blue" style="width:${(d.treatments / maxVal * 100).toFixed(1)}%">诊疗 ${d.treatments}</div>
            </div>
          </div>
          <div class="chart-bar-container">
            <div class="chart-bar-label"></div>
            <div class="chart-bar-track">
              <div class="chart-bar-fill green" style="width:${(d.releases / maxVal * 100).toFixed(1)}%">放养 ${d.releases}</div>
            </div>
          </div>
          <div class="chart-bar-container">
            <div class="chart-bar-label"></div>

   6. 物料全局监管
   ============================================ */
function renderMaterial() {
  const txns = TNR_DB.getAll(TNR_DB.KEYS.materialTxns);
  const materials = TNR_DB.getAllRaw(TNR_DB.KEYS.materials);
  let hospitals = TNR_DB.getAllRaw(TNR_DB.KEYS.institutions).filter(i => i.type === 'hospital' && i.status === 'active');
  if (!isCityLevel()) hospitals = hospitals.filter(h => h.districtId === currentUser.districtId);

  const matPurchase = txns.filter(t => t.type === 'purchase').reduce((s, t) => s + t.quantity, 0);
  const matDispatch = txns.filter(t => t.type === 'dispatch').reduce((s, t) => s + t.quantity, 0);
  const matConsume = txns.filter(t => t.type === 'consume').reduce((s, t) => s + t.quantity, 0);
  const totalStock = materials.reduce((s, m) => s + (m.shelterStock || 0) + Object.values(m.hospitalStock || {}).reduce((a, b) => a + b, 0), 0);

  // 异常预警
  const alerts = [];
  materials.forEach(m => {
    const totalHospital = Object.values(m.hospitalStock || {}).reduce((a, b) => a + b, 0);
    if (totalHospital < m.safetyStock) {
      alerts.push({ type: 'warning', text: `${m.name} 医院总库存 ${totalHospital} ${m.unit}，低于安全库存 ${m.safetyStock} ${m.unit}` });
    }
    if (m.expiryDate) {
      const exp = new Date(m.expiryDate);
      const now = new Date();
      const days = (exp - now) / (1000 * 60 * 60 * 24);
      if (days < 0) alerts.push({ type: 'danger', text: `${m.name} 批号 ${m.batchNo} 已过期（${m.expiryDate}）` });
      else if (days < 90) alerts.push({ type: 'warning', text: `${m.name} 批号 ${m.batchNo} 即将过期（${m.expiryDate}，剩余${Math.floor(days)}天）` });
    }
  });

  // 最近物料流水
  const recentTxns = [...txns].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 10);
  const txnTypeMap = { purchase: { text: '采购入库', badge: 'badge-success' }, dispatch: { text: '下发出库', badge: 'badge-info' }, consume: { text: '消耗', badge: 'badge-cinnabar' } };

  const el = document.getElementById('page-material');
  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card green"><div class="stat-card-icon">📦</div><div><div class="stat-card-value">${matPurchase}</div><div class="stat-card-label">采购总量</div></div></div>
      <div class="stat-card blue"><div class="stat-card-icon">📤</div><div><div class="stat-card-value">${matDispatch}</div><div class="stat-card-label">下发总量</div></div></div>
      <div class="stat-card"><div class="stat-card-icon">🔬</div><div><div class="stat-card-value">${matConsume}</div><div class="stat-card-label">消耗总量</div></div></div>
      <div class="stat-card gold"><div class="stat-card-icon">📊</div><div><div class="stat-card-value">${totalStock}</div><div class="stat-card-label">当前总库存</div></div></div>
    </div>

    <div class="dashboard-grid">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><span class="card-title-bar"></span>各医院库存明细</div>
        </div>
        <div class="card-body card-body-flush">
          <div class="table-wrapper" style="border:none;">
            <table class="data-table">
              <thead><tr>
                <th>医院</th>
                ${materials.map(m => `<th>${m.name}</th>`).join('')}
                <th>区县</th>
              </tr></thead>
              <tbody>
                ${hospitals.length ? hospitals.map(h => `
                  <tr>
                    <td><strong>${TNR_UI.escape(h.name)}</strong></td>
                    ${materials.map(m => {
                      const stock = m.hospitalStock && m.hospitalStock[h.id] ? m.hospitalStock[h.id] : 0;
                      const low = stock < (m.safetyStock / 4);
                      return `<td><span class="${low ? 'text-danger font-bold' : ''}">${stock} ${m.unit}</span></td>`;
                    }).join('')}
                    <td>${getDistrictName(h.districtId)}</td>
                  </tr>
                `).join('') : '<tr><td colspan="' + (materials.length + 2) + '" class="table-empty">暂无医院</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title"><span class="card-title-bar"></span>库存异常预警</div>
        </div>
        <div class="card-body">
          ${alerts.length ? alerts.map(a => `
            <div class="alert-item ${a.type}">
              <span class="alert-icon">${a.type === 'danger' ? '🔴' : '🟡'}</span>
              <span class="alert-text">${TNR_UI.escape(a.text)}</span>
            </div>
          `).join('') : '<div class="table-empty"><div class="table-empty-icon">✅</div><div class="table-empty-text">暂无异常</div></div>'}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="card-title-bar"></span>物料流水追踪</div>
      </div>
      <div class="card-body card-body-flush">
        <div class="table-wrapper" style="border:none;">
          <table class="data-table">
            <thead><tr>
              <th>单据号</th><th>类型</th><th>物料</th><th>数量</th><th>批号</th><th>来源/去向</th><th>操作人</th><th>区县</th><th>日期</th>
            </tr></thead>
            <tbody>
              ${recentTxns.length ? recentTxns.map(t => {
                const tm = txnTypeMap[t.type] || { text: t.type, badge: 'badge-default' };
                return `<tr>
                  <td>${TNR_UI.escape(t.ledgerNo || '—')}</td>
                  <td><span class="badge ${tm.badge}">${tm.text}</span></td>
                  <td>${TNR_UI.escape(t.materialName)}</td>
                  <td>${t.quantity} ${t.unit || ''}</td>
                  <td>${TNR_UI.escape(t.batchNo || '—')}</td>
                  <td>${TNR_UI.escape(t.fromTo || '—')}</td>
                  <td>${TNR_UI.escape(t.operatorName || '—')}</td>
                  <td>${getDistrictName(t.districtId)}</td>
                  <td>${TNR_UI.escape(t.date || '—')}</td>
                </tr>`;
              }).join('') : '<tr><td colspan="9" class="table-empty">暂无物料流水</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function renderLedgerTable() {
  const filters = TNR_UI.getFilterValues();
  let data, columns, type = ledgerState.tab;

  const filterData = (arr, dateField) => {
    let result = arr;
    if (filters.district) result = result.filter(r => r.districtId === filters.district);
    if (filters.search) { const s = filters.search; result = result.filter(r => JSON.stringify(r).toLowerCase().includes(s)); }
    if (filters.startDate) result = result.filter(r => r[dateField] && r[dateField] >= filters.startDate);
    if (filters.endDate) result = result.filter(r => r[dateField] && r[dateField] <= filters.endDate + ' 23:59:59');
    return result;
  };

  if (type === 'capture') {
    data = filterData(TNR_DB.getAll(TNR_DB.KEYS.captures), 'createdAt');
    columns = [
      { key: 'ledgerNo', title: '单据号' },
      { key: 'shelterName', title: '捕捉点' },
      { key: 'communityName', title: '来源小区' },
      { key: 'petCount', title: '数量' },
      { key: 'districtId', title: '区县', render: r => getDistrictName(r.districtId) },
      { key: 'operatorName', title: '操作人' },
      { key: 'createdAt', title: '时间' }
    ];
  } else if (type === 'transfer') {
    data = filterData(TNR_DB.getAll(TNR_DB.KEYS.transfers), 'createdAt');
    columns = [
      { key: 'ledgerNo', title: '单据号' },
      { key: 'fromShelterName', title: '出发捕捉点' },
      { key: 'toHospitalName', title: '到达医院' },
      { key: 'petCount', title: '数量' },
      { key: 'districtId', title: '区县', render: r => getDistrictName(r.districtId) },
      { key: 'createdAt', title: '时间' }
    ];
  } else if (type === 'treatment') {
    data = filterData(TNR_DB.getAll(TNR_DB.KEYS.treatments), 'createdAt');
    columns = [
      { key: 'petCode', title: '宠物编号' },
      { key: 'hospitalName', title: '医院' },
      { key: 'districtId', title: '区县', render: r => getDistrictName(r.districtId) },
      { key: 'operatorName', title: '操作人' },
      { key: 'createdAt', title: '时间' }
    ];
  } else if (type === 'release') {
    data = filterData(TNR_DB.getAll(TNR_DB.KEYS.releases), 'createdAt');
    columns = [
      { key: 'ledgerNo', title: '单据号' },
      { key: 'petCode', title: '宠物编号' },
      { key: 'communityName', title: '放养小区' },
      { key: 'districtId', title: '区县', render: r => getDistrictName(r.districtId) },
      { key: 'releasedAt', title: '放养时间' }
    ];
  } else if (type === 'adoption') {
    data = filterData(TNR_DB.getAll(TNR_DB.KEYS.adoptions), 'createdAt');
    columns = [
      { key: 'ledgerNo', title: '单据号' },
      { key: 'petCode', title: '宠物编号' },
      { key: 'adopterName', title: '领养人' },
      { key: 'hospitalName', title: '医院' },
      { key: 'districtId', title: '区县', render: r => getDistrictName(r.districtId) },
      { key: 'adoptedAt', title: '领养时间' }
    ];
  } else if (type === 'material') {
    data = filterData(TNR_DB.getAll(TNR_DB.KEYS.materialTxns), 'date');
    const tm = { purchase: '采购入库', dispatch: '下发出库', consume: '消耗' };
    columns = [
      { key: 'ledgerNo', title: '单据号' },
      { key: 'type', title: '类型', render: r => `<span class="badge badge-default">${tm[r.type] || r.type}</span>` },
      { key: 'materialName', title: '物料' },
      { key: 'quantity', title: '数量', render: r => r.quantity + ' ' + (r.unit || '') },
      { key: 'districtId', title: '区县', render: r => getDistrictName(r.districtId) },

function ledgerSourceTrace() {
  const petCode = document.getElementById('tracePetCode').value.trim();
  if (!petCode) { TNR_UI.toast('请输入宠物编号', 'warning'); return; }

  const results = [];
  TNR_DB.getAllRaw(TNR_DB.KEYS.captures).forEach(c => {
    if (c.petCodes && c.petCodes.includes(petCode)) results.push({ type: '捕捉登记', time: c.createdAt, desc: `${c.shelterName} · ${c.communityName}`, ledgerNo: c.ledgerNo });
  });
  TNR_DB.getAllRaw(TNR_DB.KEYS.transfers).forEach(t => {
    if (t.petCodes && t.petCodes.includes(petCode)) results.push({ type: '转运交接', time: t.createdAt, desc: `${t.fromShelterName} → ${t.toHospitalName}`, ledgerNo: t.ledgerNo });
  });
  TNR_DB.getAllRaw(TNR_DB.KEYS.treatments).forEach(t => {
    if (t.petCode === petCode) { const items = []; if (t.items && t.items.sterilization) items.push('绝育'); if (t.items && t.items.vaccine) items.push('疫苗'); if (t.items && t.items.deworming) items.push('驱虫'); if (t.items && t.items.chip) items.push('芯片'); results.push({ type: '诊疗记录', time: t.createdAt, desc: `${t.hospitalName} · ${items.join('、')}`, ledgerNo: '—' }); }
  });
  TNR_DB.getAllRaw(TNR_DB.KEYS.releases).forEach(r => {
    if (r.petCode === petCode) results.push({ type: '放养登记', time: r.releasedAt, desc: `${r.communityName}`, ledgerNo: r.ledgerNo });
  });
  TNR_DB.getAllRaw(TNR_DB.KEYS.adoptions).forEach(a => {
    if (a.petCode === petCode) results.push({ type: '领养登记', time: a.adoptedAt, desc: `领养人：${a.adopterName}`, ledgerNo: a.ledgerNo });
  });
  TNR_DB.getAllRaw(TNR_DB.KEYS.euthanasia).forEach(e => {
    if (e.petCode === petCode) results.push({ type: '安乐死', time: e.euthanizedAt, desc: `${e.hospitalName} · ${e.reason}`, ledgerNo: e.ledgerNo });
  });

  results.sort((a, b) => new Date(a.time) - new Date(b.time));
  document.getElementById('traceResult').innerHTML = results.length ? `
    <div class="timeline mt-4">
      ${results.map(r => `
        <div class="timeline-item done">
          <div class="timeline-time">${r.time || '—'}</div>
          <div class="timeline-title">${TNR_UI.escape(r.type)} · ${TNR_UI.escape(r.ledgerNo)}</div>
          <div class="timeline-desc">${TNR_UI.escape(r.desc)}</div>
        </div>
      `).join('')}
    </div>
  ` : '<div class="table-empty mt-4"><div class="table-empty-icon">🔍</div><div class="table-empty-text">未找到相关溯源记录</div></div>';
}

      <div class="card">
        <div class="card-header">
          <div class="card-title"><span class="card-title-bar"></span>系统参数</div>
        </div>
        <div class="card-body">
          ${TNR_UI.renderDescList([
            { label: '系统名称', value: 'TNR流浪动物管理系统' },
            { label: '当前版本', value: 'v1.0.0' },
            { label: '部署环境', value: '演示环境' },
            { label: '数据存储', value: '浏览器本地存储 (localStorage)' },
            { label: '当前用户', value: currentUser.name },
            { label: '用户角色', value: getRoleName(currentUser.role) },
            { label: '管辖范围', value: isCityLevel() ? '全市' : getDistrictName(currentUser.districtId) }
          ])}
        </div>
      </div>
      <div class="card mt-5">
        <div class="card-header">
          <div class="card-title"><span class="card-title-bar"></span>数据管理</div>
        </div>
        <div class="card-body">
          <p class="text-muted mb-4">重置将清除所有业务数据并恢复初始种子数据，此操作不可撤销。</p>
          <button class="btn btn-danger" onclick="resetAllData()">⚠️ 重置全部数据</button>
        </div>
      </div>
    `;
  }
}

function renderLogList(logs) {
  if (!logs || logs.length === 0) return '<div class="table-empty"><div class="table-empty-icon">📋</div><div class="table-empty-text">暂无操作日志</div></div>';
  return logs.map(log => `
    <div class="log-entry">
      <span class="log-time">${log.time}</span>
      <span class="log-action">${TNR_UI.escape(log.action)}</span>
      <span class="log-detail">${TNR_UI.escape(log.detail)}</span>
      <span class="text-muted fs-sm">${TNR_UI.escape(log.operator)}</span>
    </div>
  `).join('');
}

function savePrefixes() {
  const inputs = document.querySelectorAll('[data-prefix-idx]');
  const prefixes = JSON.parse(localStorage.getItem('tnr_settings_prefixes') || '[]');
  if (prefixes.length === 0) {
    // Initialize from current table if not stored
    const rows = document.querySelectorAll('[data-prefix-idx]');
    rows.forEach((input, i) => {
      if (!prefixes[i]) prefixes[i] = { type: '', prefix: '', example: '' };
      prefixes[i].prefix = input.value;
    });
  } else {
    inputs.forEach(input => { prefixes[input.dataset.prefixIdx].prefix = input.value; });
  }
  localStorage.setItem('tnr_settings_prefixes', JSON.stringify(prefixes));
  logOperation('保存编号规则', '系统配置-编号规则');
  TNR_UI.toast('编号规则已保存', 'success');
}

function clearLogs() {
  TNR_UI.confirm('确认清空所有操作日志？此操作不可撤销。', '清空确认').then(ok => {
    if (ok) {
      localStorage.removeItem('tnr_operation_logs');
      TNR_UI.toast('操作日志已清空', 'success');
      renderSettingsContent();
    }
  });
}

function resetAllData() {
  TNR_UI.confirm('确认重置全部数据？此操作将清除所有业务数据并恢复初始状态，不可撤销！', '危险操作').then(ok => {
    if (ok) {
      TNR_DB.resetAll();
      localStorage.removeItem('tnr_operation_logs');
      TNR_UI.toast('数据已重置，页面即将刷新...', 'success');
      setTimeout(() => location.reload(), 1500);
    }
  });
}

/* ============================================
   9. 个人中心
   ============================================ */
function renderProfile() {
  const el = document.getElementById('page-profile');
  const myLogs = getOperationLogs(currentUser.id);
  el.innerHTML = `
    <div class="card mb-4">
      <div class="card-header">
        <div class="card-title"><span class="card-title-bar"></span>账号信息</div>
      </div>
      <div class="card-body">
        ${TNR_UI.renderDescList([
          { label: '用户名', value: currentUser.username },
          { label: '姓名', value: currentUser.name },
          { label: '角色', value: `<span class="badge ${getRoleBadge(currentUser.role)}">${getRoleName(currentUser.role)}</span>` },
          { label: '区县', value: getDistrictName(currentUser.districtId) },
          { label: '联系电话', value: currentUser.phone || '—' },
          { label: '账号状态', value: `<span class="badge badge-success">启用</span>` },
          { label: '创建时间', value: currentUser.createdAt || '—' }
        ])}
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header">
        <div class="card-title"><span class="card-title-bar"></span>修改密码</div>
      </div>
      <div class="card-body">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">原密码<span class="req">*</span></label>
            <input type="password" class="form-input" id="profile-old-pwd" placeholder="请输入原密码">
          </div>
          <div class="form-group">
            <label class="form-label">新密码<span class="req">*</span></label>
            <input type="password" class="form-input" id="profile-new-pwd" placeholder="至少6位">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">确认新密码<span class="req">*</span></label>
          <input type="password" class="form-input" id="profile-confirm-pwd" placeholder="再次输入新密码">
        </div>
        <button class="btn btn-primary" onclick="changePassword()">修改密码</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="card-title-bar"></span>我的操作日志</div>
      </div>
      <div class="card-body card-body-flush">
        ${renderLogList(myLogs)}
      </div>
    </div>
  `;
}

function changePassword() {
  const oldPwd = document.getElementById('profile-old-pwd').value;
  const newPwd = document.getElementById('profile-new-pwd').value;
  const confirmPwd = document.getElementById('profile-confirm-pwd').value;
  if (oldPwd !== currentUser.password) { TNR_UI.toast('原密码错误', 'danger'); return; }
  if (newPwd.length < 6) { TNR_UI.toast('新密码至少6位', 'warning'); return; }
  if (newPwd !== confirmPwd) { TNR_UI.toast('两次密码不一致', 'warning'); return; }
  TNR_DB.update(TNR_DB.KEYS.users, currentUser.id, { password: newPwd });
  currentUser.password = newPwd;
  TNR_DB.setCurrentUser(currentUser);
  logOperation('修改密码', '个人密码修改');
  TNR_UI.toast('密码修改成功', 'success');
  document.getElementById('profile-old-pwd').value = '';
  document.getElementById('profile-new-pwd').value = '';
  document.getElementById('profile-confirm-pwd').value = '';
}

/* ============================================
   启动
   ============================================ */
window.addEventListener('DOMContentLoaded', () => {
  const user = TNR_DB.getCurrentUser();
  if (user && (user.role === 'gov_city' || user.role === 'gov_district')) {
    currentUser = user;
    showApp();
  } else {
    showLogin();
  }
});
</script>
