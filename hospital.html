<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宠物医院端 - TNR流浪动物管理系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tnr-traditional.css">
  <style>
    .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--grad-sidebar);padding:var(--sp-4);position:relative;overflow:hidden}
    .login-screen::before{content:'';position:absolute;top:-50%;right:-20%;width:600px;height:600px;background:radial-gradient(circle,rgba(195,39,43,0.15) 0%,transparent 70%);border-radius:50%}
    .login-screen::after{content:'';position:absolute;bottom:-30%;left:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(200,155,60,0.1) 0%,transparent 70%);border-radius:50%}
    .login-card{background:var(--white);border-radius:var(--r-2xl);padding:var(--sp-10);width:100%;max-width:420px;box-shadow:var(--shadow-lg);position:relative;z-index:1}
    .login-brand{display:flex;align-items:center;gap:var(--sp-4);margin-bottom:var(--sp-8)}
    .login-title{font-family:var(--font-display);font-size:var(--fs-3xl);font-weight:700;color:var(--ink);line-height:1.3}
    .login-subtitle{font-size:var(--fs-sm);color:var(--ink-muted);margin-top:2px}
    .login-hint{text-align:center;font-size:var(--fs-sm);color:var(--ink-light);padding:var(--sp-3);background:var(--rice-paper);border-radius:var(--r-md);margin-top:var(--sp-4)}
    .photo-placeholder{width:48px;height:48px;border-radius:var(--r-md);background:var(--rice-warm);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-light);flex-shrink:0}
    .treatment-item-card{border:2px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-4);cursor:pointer;transition:all var(--t-base);background:var(--white)}
    .treatment-item-card.checked{border-color:var(--cinnabar);background:var(--cinnabar-light)}
    .treatment-item-header{display:flex;align-items:center;gap:var(--sp-3)}
    .treatment-item-icon{width:36px;height:36px;border-radius:var(--r-md);background:var(--rice-warm);display:flex;align-items:center;justify-content:center;font-size:18px}
    .treatment-item-card.checked .treatment-item-icon{background:var(--cinnabar);color:#fff}
    .treatment-item-body{margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--border-faint)}
    .todo-item{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);cursor:pointer;transition:background var(--t-fast);border-bottom:1px solid var(--border-faint)}
    .todo-item:hover{background:var(--rice-light)}
    .todo-item:last-child{border-bottom:none}
    .todo-item-icon{width:32px;height:32px;border-radius:var(--r-md);background:var(--cinnabar-light);color:var(--cinnabar);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
    .todo-item-content{flex:1;min-width:0}
    .todo-item-title{font-size:var(--fs-md);font-weight:500;color:var(--ink-text)}
    .todo-item-desc{font-size:var(--fs-sm);color:var(--ink-muted)}
    .quick-action{display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);padding:var(--sp-5);border-radius:var(--r-lg);border:1px solid var(--border-light);cursor:pointer;transition:all var(--t-base);background:var(--white);text-align:center}
    .quick-action:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--cinnabar)}
    .quick-action-icon{width:44px;height:44px;border-radius:var(--r-lg);background:var(--cinnabar-light);color:var(--cinnabar);display:flex;align-items:center;justify-content:center;font-size:22px}
    .quick-action-label{font-size:var(--fs-sm);color:var(--ink-text);font-weight:500}
    .quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:var(--sp-3)}
    .pet-select-item{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);border:2px solid var(--border-light);border-radius:var(--r-md);cursor:pointer;transition:all var(--t-fast)}
    .pet-select-item:hover{border-color:var(--ink-light)}
    .pet-select-item.selected{border-color:var(--cinnabar);background:var(--cinnabar-light)}
    .stock-bar{height:6px;background:var(--rice-warm);border-radius:var(--r-full);overflow:hidden;margin-top:var(--sp-2)}
    .stock-bar-fill{height:100%;border-radius:var(--r-full);transition:width var(--t-slow)}
    .detail-section{margin-bottom:var(--sp-5)}
    .detail-section-title{font-family:var(--font-display);font-size:var(--fs-md);font-weight:600;color:var(--ink);margin-bottom:var(--sp-3);padding-bottom:var(--sp-2);border-bottom:1px solid var(--border-faint);display:flex;align-items:center;gap:var(--sp-2)}
    .detail-section-title::before{content:'';width:3px;height:14px;background:var(--grad-cinnabar);border-radius:2px}
    .empty-state{text-align:center;padding:var(--sp-12) var(--sp-6);color:var(--ink-light)}
    .empty-state-icon{font-size:56px;margin-bottom:var(--sp-4);opacity:0.3}
    .empty-state-text{font-size:var(--fs-lg);margin-bottom:var(--sp-2)}
    .empty-state-desc{font-size:var(--fs-sm)}
    .logout-btn{background:var(--rice-paper);border:1px solid var(--border-ink);color:var(--ink-muted);padding:6px 12px;border-radius:var(--r-md);font-size:var(--fs-sm);cursor:pointer;transition:all var(--t-fast)}
    .logout-btn:hover{background:var(--rouge-light);color:var(--rouge);border-color:var(--rouge)}
    .dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-5)}
    @media(max-width:768px){.dashboard-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="seal-decoration">医</div>
      <div>
        <div class="login-title">宠物医院端</div>
        <div class="login-subtitle">TNR流浪动物管理系统 · 水墨丹青</div>
      </div>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input type="text" id="loginUsername" class="form-input" value="aixin_hosp" placeholder="请输入用户名" required>
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" id="loginPassword" class="form-input" value="123456" placeholder="请输入密码" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-full">登 录</button>
    </form>
    <div class="login-hint">演示账号：aixin_hosp / 123456</div>
  </div>
</div>

<div id="app" class="hidden"></div>

<script src="js/tnr-data.js"></script>
<script src="js/tnr-common.js"></script>
<script>
'use strict';

var state = {
  currentPage: 'dashboard',
  receiveTab: 'pending',
  materialTab: 'pending',
  ledgerTab: 'transfer',
  treatmentPetId: null,
  treatmentData: { items: {}, sterilization: null, vaccine: null, deworming: null, chip: null },
  adoptionEditPetId: null
};

function currentUser(){ return TNR_DB.getCurrentUser(); }
function getHospitalId(){ var u=currentUser(); return u?u.institutionId:null; }
function getHospitalName(){ var u=currentUser(); if(!u) return ''; var inst=TNR_DB.getById(TNR_DB.KEYS.institutions,u.institutionId); return inst?inst.name:u.name; }
function getHospitalTransfers(){ var h=getHospitalId(); return TNR_DB.getAllRaw(TNR_DB.KEYS.transfers).filter(function(t){return t.toHospitalId===h;}); }
function getHospitalTreatments(){ var h=getHospitalId(); return TNR_DB.getAllRaw(TNR_DB.KEYS.treatments).filter(function(t){return t.hospitalId===h;}); }
function getHospitalPets(){ var h=getHospitalId(); return TNR_DB.getAllRaw(TNR_DB.KEYS.pets).filter(function(p){return p.hospitalId===h;}); }
function getHospitalEuthanasia(){ var h=getHospitalId(); return TNR_DB.getAllRaw(TNR_DB.KEYS.euthanasia).filter(function(e){return e.hospitalId===h;}); }
function getHospitalMaterials(){ return TNR_DB.getAllRaw(TNR_DB.KEYS.materials); }
function getHospitalStock(mid){ var h=getHospitalId(); var m=TNR_DB.getById(TNR_DB.KEYS.materials,mid); if(m&&m.hospitalStock) return m.hospitalStock[h]||0; return 0; }
function deductHospitalStock(mid,qty){ var h=getHospitalId(); var ms=TNR_DB.getAllRaw(TNR_DB.KEYS.materials); var m=ms.find(function(x){return x.id===mid;}); if(m&&m.hospitalStock&&m.hospitalStock[h]!==undefined){ m.hospitalStock[h]=Math.max(0,m.hospitalStock[h]-(qty||1)); TNR_DB._save(TNR_DB.KEYS.materials,ms); return true;} return false; }
function addHospitalStock(mid,qty){ var h=getHospitalId(); var ms=TNR_DB.getAllRaw(TNR_DB.KEYS.materials); var m=ms.find(function(x){return x.id===mid;}); if(m&&m.hospitalStock){ m.hospitalStock[h]=(m.hospitalStock[h]||0)+(qty||1); TNR_DB._save(TNR_DB.KEYS.materials,ms); return true;} return false; }

function getPendingMaterialDispatches(){
  var h=getHospitalId(), hn=getHospitalName();
  return TNR_DB.getAllRaw(TNR_DB.KEYS.materialTxns).filter(function(t){
    if(t.type!=='dispatch'||t.hospitalReceived) return false;
    if(t.toHospitalId===h) return true;
    if(t.fromTo&&t.fromTo.indexOf(hn)>=0) return true;
    return false;
  });
}

function getHospitalMaterialTxns(){
  var h=getHospitalId(), hn=getHospitalName();
  return TNR_DB.getAllRaw(TNR_DB.KEYS.materialTxns).filter(function(t){
    if(t.toHospitalId===h) return true;
    if(t.hospitalId===h) return true;
    if(t.fromTo&&t.fromTo.indexOf(hn)>=0) return true;
    if(t.operatorName===hn) return true;
    return false;
  });
}

function getTransferPetDetails(trf){
  var cap=TNR_DB.getById(TNR_DB.KEYS.captures,trf.captureId);
  var allPets=TNR_DB.getAllRaw(TNR_DB.KEYS.pets);
  var pets=(trf.petCodes||[]).map(function(c){return allPets.find(function(p){return p.code===c;});}).filter(function(p){return p;});
  return {capture:cap,pets:pets};
}

function transferStatusBadge(s){ var m={'pending':['待接收','badge-warning'],'received':['已接收','badge-success'],'rejected':['已驳回','badge-danger']}; var v=m[s]||[s,'badge-default']; return '<span class="badge '+v[1]+'">'+v[0]+'</span>'; }
function treatmentStatusBadge(s){ var m={'completed':['已完成','badge-success'],'in_progress':['进行中','badge-info']}; var v=m[s]||[s,'badge-default']; return '<span class="badge '+v[1]+'">'+v[0]+'</span>'; }

function logOperation(action){
  var u=currentUser(); if(!u) return;
  var logs=JSON.parse(localStorage.getItem('tnr_hospital_logs')||'[]');
  logs.unshift({id:'LOG'+Date.now(),userId:u.id,userName:u.name,action:action,time:new Date().toISOString().substr(0,19).replace('T',' ')});
  localStorage.setItem('tnr_hospital_logs',JSON.stringify(logs.slice(0,50)));
}
function getOperationLogs(){ var u=currentUser(); var logs=JSON.parse(localStorage.getItem('tnr_hospital_logs')||'[]'); return logs.filter(function(l){return l.userId===(u?u.id:'');}); }

function checkAndUpdatePetStatus(){
  var treatments=TNR_DB.getAllRaw(TNR_DB.KEYS.treatments);
  var pets=TNR_DB.getAllRaw(TNR_DB.KEYS.pets);
  var updated=false;
  treatments.forEach(function(t){
    if(t.status==='completed'&&t.completedAt){
      var pet=pets.find(function(p){return p.id===t.petId;});
      if(pet&&pet.status==='in_treatment'){
        var cd=new Date(t.completedAt), now=new Date();
        if((now-cd)/(1000*60*60*24)>=5){ pet.status='pending_adopt'; updated=true; }
      }
    }
  });
  if(updated) TNR_DB._save(TNR_DB.KEYS.pets,pets);
}

function migrateAndSeed(){
  var txns=TNR_DB.getAllRaw(TNR_DB.KEYS.materialTxns), tc=false;
  txns.forEach(function(t){ if(t.type==='dispatch'&&t.hospitalReceived===undefined){ t.hospitalReceived=true; tc=true; } });
  if(tc) TNR_DB._save(TNR_DB.KEYS.materialTxns,txns);
  var trts=TNR_DB.getAllRaw(TNR_DB.KEYS.treatments), trc=false;
  trts.forEach(function(t){ if(t.status==='completed'&&!t.completedAt){ t.completedAt=t.createdAt||'2025-01-20'; trc=true; } });
  if(trc) TNR_DB._save(TNR_DB.KEYS.treatments,trts);
  if(localStorage.getItem('hospital_demo_seeded_v2')) return;
  var h=getHospitalId(), hn=getHospitalName(), u=currentUser(); if(!u) return;
  var now=new Date();
  var ds=now.getFullYear().toString().substr(-2)+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0');
  var dpc='TNR'+ds+'001';
  var pets=TNR_DB.getAllRaw(TNR_DB.KEYS.pets);
  pets.push({id:'PET_DEMO_001',code:dpc,name:'演示橘猫',species:'猫',breed:'橘猫',gender:'公',age:'约1岁',color:'橘色',weight:'3.5kg',status:'in_transit',districtId:u.districtId,captureId:'CAP001',shelterId:'I001',hospitalId:h,photos:{group:'',before:'',after:'',treatment:''},chipNo:'',description:'小区流浪猫，性格温顺',createdAt:new Date().toISOString().substr(0,10)});
  TNR_DB._save(TNR_DB.KEYS.pets,pets);
  var trfs=TNR_DB.getAllRaw(TNR_DB.KEYS.transfers);
  trfs.push({id:'TRF_DEMO_001',captureId:'CAP001',fromShelterId:'I001',fromShelterName:'朝阳区流浪动物捕捉点',toHospitalId:h,toHospitalName:hn,petCodes:[dpc],petCount:1,status:'pending',receivedAt:'',rejectReason:'',operator:'U004',operatorName:'朝阳捕捉点操作员',createdAt:new Date().toISOString().substr(0,16).replace('T',' '),ledgerNo:TNR_DB._genLedgerNo('TRF'),districtId:u.districtId});
  TNR_DB._save(TNR_DB.KEYS.transfers,trfs);
  var mtx=TNR_DB.getAllRaw(TNR_DB.KEYS.materialTxns);
  mtx.push({id:'MTX_DEMO_001',type:'dispatch',materialId:'MAT002',materialName:'猫三联疫苗',quantity:10,unit:'支',batchNo:'B20250102',supplier:'',fromTo:hn,toHospitalId:h,operator:'U004',operatorName:'朝阳捕捉点操作员',date:new Date().toISOString().substr(0,10),ledgerNo:TNR_DB._genLedgerNo('DIS'),districtId:u.districtId,note:'捕捉点下发至医院，待确认接收',hospitalReceived:false});
  TNR_DB._save(TNR_DB.KEYS.materialTxns,mtx);
  localStorage.setItem('hospital_demo_seeded_v2','1');
}

function init(){
  var u=TNR_DB.getCurrentUser();
  if(u&&u.role==='hospital') showApp(); else showLogin();
  document.getElementById('loginForm').addEventListener('submit',handleLogin);
}
function showLogin(){ document.getElementById('loginScreen').classList.remove('hidden'); document.getElementById('app').classList.add('hidden'); }
function showApp(){ document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); migrateAndSeed(); checkAndUpdatePetStatus(); renderApp(); renderDashboard(); }
function handleLogin(e){ e.preventDefault(); var un=document.getElementById('loginUsername').value.trim(), pw=document.getElementById('loginPassword').value.trim(); var u=TNR_DB.login(un,pw); if(u&&u.role==='hospital'){TNR_DB.setCurrentUser(u);TNR_UI.toast('登录成功，欢迎回来！','success');showApp();} else if(u){TNR_UI.toast('该账号无医院端访问权限','danger');TNR_DB.logout();} else {TNR_UI.toast('用户名或密码错误','danger');} }
function handleLogout(){ TNR_DB.logout(); document.getElementById('app').innerHTML=''; showLogin(); TNR_UI.toast('已退出登录','info'); }

function renderApp(){
  var u=currentUser(), inst=TNR_DB.getById(TNR_DB.KEYS.institutions,u.institutionId), hn=inst?inst.name:u.name;
  var navGroups=[
    {title:'核心业务',items:[{id:'dashboard',icon:'📊',label:'首页看板'},{id:'receive',icon:'📥',label:'动物交接管理'}]},
    {title:'诊疗业务',items:[{id:'treatment',icon:'🔬',label:'诊疗操作'},{id:'treatment-list',icon:'📋',label:'诊疗记录'}]},
    {title:'物料库存',items:[{id:'material',icon:'📦',label:'物料库存管理'}]},
    {title:'领养维护',items:[{id:'adoption-info',icon:'🐾',label:'领养信息维护'}]},
    {title:'安乐死',items:[{id:'euthanasia',icon:'⚰️',label:'安乐死处置'}]},
    {title:'台账系统',items:[{id:'ledger',icon:'📊',label:'单据台账'}]},
    {title:'系统',items:[{id:'profile',icon:'⚙️',label:'个人中心'}]}
  ];
  var sidebarHTML=TNR_UI.renderSidebar({brand:{icon:'🏥',name:'宠物医院端'},brandSub:'TNR管理系统',navGroups:navGroups,user:{avatar:hn.charAt(0),name:hn,role:'医院操作员'},activeId:'dashboard'});
  var contentHTML='<div class="page-view active" id="page-dashboard"></div><div class="page-view" id="page-receive"></div><div class="page-view" id="page-treatment"></div><div class="page-view" id="page-treatment-list"></div><div class="page-view" id="page-material"></div><div class="page-view" id="page-adoption-info"></div><div class="page-view" id="page-euthanasia"></div><div class="page-view" id="page-ledger"></div><div class="page-view" id="page-profile"></div>';
  document.getElementById('app').innerHTML=TNR_UI.createPageStructure(sidebarHTML,'首页看板',contentHTML);
  TNR_UI.startClock(); TNR_UI.bindSidebar(onNavigate);
  var tr=document.querySelector('.topbar-right');
  if(tr){ var lb=document.createElement('button'); lb.className='logout-btn'; lb.textContent='退出登录'; lb.onclick=handleLogout; tr.appendChild(lb); }
}

function onNavigate(navId){
  state.currentPage=navId;
  var titles={'dashboard':'首页看板','receive':'动物交接管理','treatment':'诊疗操作','treatment-list':'诊疗记录','material':'物料库存管理','adoption-info':'领养信息维护','euthanasia':'安乐死处置','ledger':'单据台账','profile':'个人中心'};
  document.querySelector('.topbar-title').textContent=titles[navId]||'';
  if(navId==='dashboard') renderDashboard();
  else if(navId==='receive') renderReceive();
  else if(navId==='treatment') renderTreatment();
  else if(navId==='treatment-list') renderTreatmentList();
  else if(navId==='material') renderMaterial();
  else if(navId==='adoption-info') renderAdoptionInfo();
  else if(navId==='euthanasia') renderEuthanasia();
  else if(navId==='ledger') renderLedger();
  else if(navId==='profile') renderProfile();
}

function navigateTo(navId){ var el=document.querySelector('.nav-item[data-nav="'+navId+'"]'); if(el) el.click(); }

// ============================================
// 1. 首页看板
// ============================================
function renderDashboard(){
  var transfers=getHospitalTransfers(), treatments=getHospitalTreatments(), pets=getHospitalPets(), materials=getHospitalMaterials(), pendingDisp=getPendingMaterialDispatches();
  var pendRecv=transfers.filter(function(t){return t.status==='pending';}).length;
  var pendTreat=pets.filter(function(p){return p.status==='in_treatment';}).length;
  var stockWarn=materials.filter(function(m){return getHospitalStock(m.id)<m.safetyStock;}).length;
  var pendAdopt=pets.filter(function(p){return p.status==='pending_adopt';}).length;
  var page=document.getElementById('page-dashboard');
  page.innerHTML='<div class="stat-grid">'+
    '<div class="stat-card"><div class="stat-card-icon">📥</div><div><div class="stat-card-value">'+pendRecv+'</div><div class="stat-card-label">待接收动物</div></div></div>'+
    '<div class="stat-card blue"><div class="stat-card-icon">🔬</div><div><div class="stat-card-value">'+pendTreat+'</div><div class="stat-card-label">待诊疗任务</div></div></div>'+
    '<div class="stat-card gold"><div class="stat-card-icon">📦</div><div><div class="stat-card-value">'+stockWarn+'</div><div class="stat-card-label">库存预警</div></div></div>'+
    '<div class="stat-card green"><div class="stat-card-icon">🐾</div><div><div class="stat-card-value">'+pendAdopt+'</div><div class="stat-card-label">待领养资料待维护</div></div></div></div>'+
    '<div class="dashboard-grid"><div class="card"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>待办任务</div></div><div class="card-body-flush">'+renderTodoList(transfers,pets,pendingDisp)+'</div></div>'+
    '<div class="card"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>快捷操作</div></div><div class="card-body"><div class="quick-grid">'+
    '<div class="quick-action" onclick="navigateTo(\'receive\')"><div class="quick-action-icon">📥</div><div class="quick-action-label">动物交接</div></div>'+
    '<div class="quick-action" onclick="navigateTo(\'treatment\')"><div class="quick-action-icon">🔬</div><div class="quick-action-label">诊疗操作</div></div>'+
    '<div class="quick-action" onclick="navigateTo(\'material\')"><div class="quick-action-icon">📦</div><div class="quick-action-label">物料管理</div></div>'+
    '<div class="quick-action" onclick="navigateTo(\'adoption-info\')"><div class="quick-action-icon">🐾</div><div class="quick-action-label">领养维护</div></div>'+
    '<div class="quick-action" onclick="navigateTo(\'ledger\')"><div class="quick-action-icon">📊</div><div class="quick-action-label">单据台账</div></div>'+
    '<div class="quick-action" onclick="navigateTo(\'euthanasia\')"><div class="quick-action-icon">⚰️</div><div class="quick-action-label">安乐死处置</div></div>'+
    '</div></div></div></div>'+

}

function renderTodoList(transfers,pets,pendingDisp){
  var todos=[];
  transfers.filter(function(t){return t.status==='pending';}).forEach(function(t){
    todos.push({icon:'📥',title:'待接收转运单 '+(t.ledgerNo||''),desc:'来源：'+(t.fromShelterName||'')+' · '+t.petCount+'只动物',nav:'receive'});
  });
  pets.filter(function(p){return p.status==='in_treatment';}).forEach(function(p){
    todos.push({icon:'🔬',title:'待诊疗：'+p.code,desc:(p.name||'')+' · '+(p.species||'')+' · '+(p.breed||''),nav:'treatment'});
  });
  pendingDisp.forEach(function(t){
    todos.push({icon:'📦',title:'待接收物料：'+(t.materialName||''),desc:'数量：'+t.quantity+t.unit+' · 批号：'+(t.batchNo||''),nav:'material'});
  });
  pets.filter(function(p){return p.status==='pending_adopt';}).forEach(function(p){
    todos.push({icon:'🐾',title:'待领养资料维护：'+p.code,desc:(p.name||'')+' · 请完善照片和简介',nav:'adoption-info'});
  });
  if(todos.length===0) return '<div class="empty-state" style="padding:var(--sp-8);"><div class="empty-state-icon">✓</div><div class="empty-state-text">暂无待办任务</div></div>';
  return todos.map(function(t){return '<div class="todo-item" onclick="navigateTo(\''+t.nav+'\')"><div class="todo-item-icon">'+t.icon+'</div><div class="todo-item-content"><div class="todo-item-title">'+TNR_UI.escape(t.title)+'</div><div class="todo-item-desc">'+TNR_UI.escape(t.desc)+'</div></div><span style="color:var(--ink-light);font-size:14px;">›</span></div>';}).join('');
}

function renderStockOverview(materials){
  var h=getHospitalId();
  return materials.map(function(m){
    var stock=m.hospitalStock?(m.hospitalStock[h]||0):0;
    var pct=Math.min(100,(stock/(m.safetyStock*2))*100);
    var isLow=stock<m.safetyStock;
    var color=isLow?'var(--rouge)':(stock<m.safetyStock*1.5?'var(--autumn-gold)':'var(--bamboo-green)');
    return '<div style="display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-3) 0;border-bottom:1px solid var(--border-faint);"><div style="flex:1;">'+
      '<div style="display:flex;align-items:center;gap:var(--sp-2);margin-bottom:4px;"><span style="font-weight:500;">'+TNR_UI.escape(m.name)+'</span>'+
      '<span class="badge '+(isLow?'badge-danger':'badge-default')+'">'+TNR_DB.getMaterialCategoryText(m.category)+'</span>'+(isLow?'<span class="badge badge-danger">库存不足</span>':'')+'</div>'+
      '<div class="stock-bar"><div class="stock-bar-fill" style="width:'+pct+'%;background:'+color+';"></div></div></div>'+
      '<div style="text-align:right;min-width:100px;"><div style="font-family:var(--font-display);font-size:var(--fs-xl);font-weight:700;color:'+color+';">'+stock+'<span style="font-size:var(--fs-sm);color:var(--ink-muted);font-weight:400;"> / '+m.safetyStock+m.unit+'</span></div>'+
      '<div style="font-size:var(--fs-xs);color:var(--ink-light);">当前 / 安全库存</div></div></div>';
  }).join('');
}

function renderReceive(){
  var transfers=getHospitalTransfers();
  var pend=transfers.filter(function(t){return t.status==='pending';}).length;
  var recv=transfers.filter(function(t){return t.status==='received';}).length;
  var rej=transfers.filter(function(t){return t.status==='rejected';}).length;
  var page=document.getElementById('page-receive');
  page.innerHTML='<div class="tabs">'+
    '<div class="tab-item '+(state.receiveTab==='pending'?'active':'')+'" onclick="switchReceiveTab(\'pending\')">待接收 ('+pend+')</div>'+
    '<div class="tab-item '+(state.receiveTab==='received'?'active':'')+'" onclick="switchReceiveTab(\'received\')">已接收 ('+recv+')</div>'+
    '<div class="tab-item '+(state.receiveTab==='rejected'?'active':'')+'" onclick="switchReceiveTab(\'rejected\')">已驳回 ('+rej+')</div></div>'+
    '<div id="receiveTabContent"></div>';
  renderReceiveTab();
}
function switchReceiveTab(tab){ state.receiveTab=tab; document.querySelectorAll('#page-receive .tab-item').forEach(function(el,i){el.classList.toggle('active',['pending','received','rejected'][i]===tab);}); renderReceiveTab(); }
function renderReceiveTab(){
  var transfers=getHospitalTransfers().filter(function(t){return t.status===state.receiveTab;});
  var c=document.getElementById('receiveTabContent');
  if(transfers.length===0){ c.innerHTML='<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">暂无数据</div><div class="empty-state-desc">暂无'+({pending:'待接收',received:'已接收',rejected:'已驳回'}[state.receiveTab])+'的交接单</div></div>'; return; }
  var rows=transfers.map(function(t){
    var d=getTransferPetDetails(t);
    var petInfo=d.pets.map(function(p){return '<div style="display:flex;align-items:center;gap:var(--sp-2);padding:4px 0;"><div class="photo-placeholder">🐾</div><div><div style="font-weight:500;">'+TNR_UI.escape(p.code)+'</div><div style="font-size:var(--fs-sm);color:var(--ink-muted);">'+TNR_UI.escape(p.name||'')+' · '+TNR_UI.escape(p.species||'')+' · '+TNR_UI.escape(p.breed||'')+' · '+TNR_UI.escape(p.gender||'')+'</div></div></div>';}).join('');
    var actions='';
    if(t.status==='pending') actions='<button class="btn btn-success btn-sm" onclick="confirmReceive(\''+t.id+'\')">确认签收</button><button class="btn btn-danger btn-sm" onclick="rejectTransfer(\''+t.id+'\')">驳回</button>';
    else if(t.status==='rejected') actions='<button class="btn btn-secondary btn-sm" onclick="viewRejectReason(\''+t.id+'\')">查看驳回理由</button>';
    return '<tr><td><div style="font-weight:500;">'+TNR_UI.escape(t.ledgerNo||'')+'</div><div style="font-size:var(--fs-xs);color:var(--ink-light);">'+TNR_UI.escape(t.createdAt||'')+'</div></td>'+
      '<td>'+(petInfo||'<span class="text-muted">—</span>')+'<div style="font-size:var(--fs-sm);color:var(--ink-muted);margin-top:4px;">'+TNR_UI.escape(d.pets.map(function(p){return p.description||'';}).filter(Boolean).join('；')||'')+'</div></td>'+
      '<td>'+TNR_UI.escape(t.fromShelterName||'')+'</td><td>'+TNR_UI.escape(d.capture?d.capture.communityName:'—')+'</td><td>'+TNR_UI.escape(d.capture?d.capture.createdAt:'—')+'</td>'+
      '<td>'+transferStatusBadge(t.status)+'</td><td><div class="flex gap-2">'+actions+'</div></td></tr>';
  }).join('');
  c.innerHTML='<div class="table-wrapper"><table class="data-table"><thead><tr><th>交接单号</th><th>宠物信息</th><th>来源捕捉点</th><th>来源小区</th><th>捕捉时间</th><th>状态</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function confirmReceive(transferId){
  var trf=TNR_DB.getById(TNR_DB.KEYS.transfers,transferId); if(!trf) return;
  TNR_UI.confirm('确认签收该转运单？签收后宠物状态将变更为「待诊疗」。','确认签收').then(function(ok){
    if(!ok) return;
    TNR_DB.update(TNR_DB.KEYS.transfers,transferId,{status:'received',receivedAt:new Date().toISOString().substr(0,10)});
    var allPets=TNR_DB.getAllRaw(TNR_DB.KEYS.pets);
    trf.petCodes.forEach(function(code){var p=allPets.find(function(x){return x.code===code;}); if(p){p.status='in_treatment'; p.hospitalId=trf.toHospitalId;}});
    TNR_DB._save(TNR_DB.KEYS.pets,allPets);
    logOperation('签收转运单：'+trf.ledgerNo);
    TNR_UI.toast('签收成功，宠物已进入待诊疗状态','success');
    renderReceive();
  });
}

function rejectTransfer(transferId){
  var trf=TNR_DB.getById(TNR_DB.KEYS.transfers,transferId); if(!trf) return;
  TNR_UI.modal({title:'驳回转运单',body:function(bodyEl,closeFn){
    bodyEl.innerHTML='<div class="form-group"><label class="form-label">驳回理由<span class="req">*</span></label><textarea class="form-textarea" id="rejectReasonInput" placeholder="请填写驳回理由，如：信息有误、动物健康状态不符等" required></textarea></div><div style="display:flex;gap:var(--sp-3);justify-content:flex-end;margin-top:var(--sp-4);"><button class="btn btn-secondary" onclick="'+closeFn+'">取消</button><button class="btn btn-danger" id="confirmRejectBtn">确认驳回</button></div>';
    bodyEl.querySelector('#confirmRejectBtn').onclick=function(){
      var r=bodyEl.querySelector('#rejectReasonInput').value.trim();
      if(!r){TNR_UI.toast('请填写驳回理由','warning');return;}
      TNR_DB.update(TNR_DB.KEYS.transfers,transferId,{status:'rejected',rejectReason:r});
      logOperation('驳回转运单：'+trf.ledgerNo+'，理由：'+r);
      TNR_UI.toast('已驳回该转运单','success'); closeFn(); renderReceive();
    };
  }});
}

function viewRejectReason(transferId){
  var trf=TNR_DB.getById(TNR_DB.KEYS.transfers,transferId); if(!trf) return;
  TNR_UI.modal({title:'驳回理由',body:'<div style="padding:var(--sp-3);background:var(--rouge-light);border-radius:var(--r-md);font-size:var(--fs-md);color:var(--ink-text);line-height:1.8;">'+TNR_UI.escape(trf.rejectReason||'无')+'</div>',actions:'<button class="btn btn-primary" onclick="this.closest(\'.modal-overlay\').remove()">关闭</button>'});
}

function renderTreatment(){
  var page=document.getElementById('page-treatment');
  var pets=getHospitalPets().filter(function(p){return p.status==='in_treatment';});
  if(pets.length===0){
    page.innerHTML='<div class="empty-state"><div class="empty-state-icon">🔬</div><div class="empty-state-text">暂无待诊疗动物</div><div class="empty-state-desc">请先在「动物交接管理」中确认接收转运单</div><button class="btn btn-primary mt-4" onclick="navigateTo(\'receive\')">前往动物交接管理</button></div>';
    return;
  }
  var selectedPet=pets.find(function(p){return p.id===state.treatmentPetId;})||pets[0];
  state.treatmentPetId=selectedPet.id;
  var existingTreat=getHospitalTreatments().find(function(t){return t.petId===selectedPet.id;});

    state.treatmentData={items:Object.assign({},existingTreat.items),sterilization:existingTreat.sterilization||null,vaccine:existingTreat.vaccine||null,deworming:existingTreat.deworming||null,chip:existingTreat.chip||null,_loaded:true,_existingId:existingTreat.id};

function toggleTreatmentItem(item,card){
  var cb=card.querySelector('input[type="checkbox"]'); var checked=!cb.checked; cb.checked=checked;
  state.treatmentData.items[item]=checked;
  if(!checked){ if(item==='sterilization')state.treatmentData.sterilization=null; if(item==='vaccine')state.treatmentData.vaccine=null; if(item==='deworming')state.treatmentData.deworming=null; if(item==='chip')state.treatmentData.chip=null; }
  var pet=getHospitalPets().find(function(p){return p.id===state.treatmentPetId;}); renderTreatmentForm(pet);
}

function openSterilizationModal(){
  var td=state.treatmentData, ex=td.sterilization||{};
  TNR_UI.modal({title:'绝育手术病历档案',size:'lg',body:function(bodyEl,closeFn){

      '<div class="form-group"><label class="form-label">手术过程<span class="req">*</span></label><textarea class="form-textarea" id="sterProcedure" placeholder="请描述手术过程">'+TNR_UI.escape(ex.procedure||'')+'</textarea></div>'+
      '<div class="form-group"><label class="form-label">恢复情况<span class="req">*</span></label><textarea class="form-textarea" id="sterRecovery" placeholder="请描述术后恢复情况">'+TNR_UI.escape(ex.recovery||'')+'</textarea></div>'+
      '<div style="display:flex;gap:var(--sp-3);justify-content:flex-end;margin-top:var(--sp-4);"><button class="btn btn-secondary" onclick="'+closeFn+'">取消</button><button class="btn btn-primary" id="sterSaveBtn">保存病历</button></div>';

function onDewormerSelect(){

  var mat=TNR_DB.getById(TNR_DB.KEYS.materials,mid);

function resetTreatmentForm(){ state.treatmentData={items:{},sterilization:null,vaccine:null,deworming:null,chip:null}; var pet=getHospitalPets().find(function(p){return p.id===state.treatmentPetId;}); renderTreatmentForm(pet); }

function saveTreatment(){
  var td=state.treatmentData, pet=getHospitalPets().find(function(p){return p.id===state.treatmentPetId;});
  if(!pet){TNR_UI.toast('请先选择宠物','warning');return;}
  var items=td.items;
  if(!items.sterilization&&!items.vaccine&&!items.deworming&&!items.chip){TNR_UI.toast('请至少选择一项诊疗项目','warning');return;}
  if(items.sterilization&&!td.sterilization){TNR_UI.toast('请填写绝育手术病历','warning');return;}
  if(items.vaccine){ var vSel=document.getElementById('vaccineSelect'); if(!vSel||!vSel.value){TNR_UI.toast('请选择疫苗类型','warning');return;} var vStock=getHospitalStock(vSel.value); if(vStock<=0){TNR_UI.toast('疫苗库存不足','danger');return;} onVaccineSelect(); }
  if(items.deworming){ var dSel=document.getElementById('dewormerSelect'); if(!dSel||!dSel.value){TNR_UI.toast('请选择驱虫药类型','warning');return;} var dStock=getHospitalStock(dSel.value); if(dStock<=0){TNR_UI.toast('驱虫药库存不足','danger');return;} onDewormerSelect(); }
  if(items.chip){ var cSel=document.getElementById('chipSelect'); if(!cSel||!cSel.value){TNR_UI.toast('请选择芯片编号','warning');return;} td.chip={chipNo:cSel.value,date:document.getElementById('chipDate').value}; }

  var u=currentUser(), hid=getHospitalId(), hn=getHospitalName();
  var allChecked=items.sterilization&&items.vaccine&&items.deworming&&items.chip;
  var treatStatus=allChecked?'completed':'in_progress';
  var now=new Date().toISOString().substr(0,16).replace('T',' ');

  // 扣减库存
  if(items.vaccine&&td.vaccine){ deductHospitalStock(td.vaccine.materialId,1); TNR_DB.create(TNR_DB.KEYS.materialTxns,{type:'consume',materialId:td.vaccine.materialId,materialName:td.vaccine.type,quantity:1,unit:'支',batchNo:td.vaccine.batchNo,fromTo:'诊疗消耗',hospitalId:hid,operator:u.id,operatorName:hn,date:td.vaccine.date,ledgerNo:TNR_DB._genLedgerNo('CON'),note:'疫苗接种：'+pet.code}); }
  if(items.deworming&&td.deworming){ deductHospitalStock(td.deworming.materialId,1); TNR_DB.create(TNR_DB.KEYS.materialTxns,{type:'consume',materialId:td.deworming.materialId,materialName:td.deworming.type,quantity:1,unit:'盒',batchNo:td.deworming.batchNo,fromTo:'诊疗消耗',hospitalId:hid,operator:u.id,operatorName:hn,date:td.deworming.date,ledgerNo:TNR_DB._genLedgerNo('CON'),note:'驱虫护理：'+pet.code}); }
  if(items.chip&&td.chip){ TNR_DB.useChip(td.chip.chipNo,pet.id); var chipMat=TNR_DB.getAllRaw(TNR_DB.KEYS.materials).find(function(m){return m.category==='chip';}); if(chipMat) deductHospitalStock(chipMat.id,1); TNR_DB.update(TNR_DB.KEYS.pets,pet.id,{chipNo:td.chip.chipNo}); TNR_DB.create(TNR_DB.KEYS.materialTxns,{type:'consume',materialId:chipMat?chipMat.id:'',materialName:'宠物芯片',quantity:1,unit:'个',batchNo:'',fromTo:'诊疗消耗',hospitalId:hid,operator:u.id,operatorName:hn,date:td.chip.date,ledgerNo:TNR_DB._genLedgerNo('CON'),note:'芯片植入：'+pet.code+'，编号：'+td.chip.chipNo}); }

  var treatData={petId:pet.id,petCode:pet.code,hospitalId:hid,hospitalName:hn,items:Object.assign({},items),sterilization:td.sterilization,vaccine:td.vaccine,deworming:td.deworming,chip:td.chip,status:treatStatus,operator:u.id,operatorName:hn,districtId:u.districtId};
  if(treatStatus==='completed') treatData.completedAt=now;
  if(td._existingId){ TNR_DB.update(TNR_DB.KEYS.treatments,td._existingId,treatData); }
  else { treatData.id=TNR_DB._genId('TRE'); TNR_DB.create(TNR_DB.KEYS.treatments,treatData); }

  // 更新宠物状态
  if(treatStatus==='completed'){ TNR_DB.update(TNR_DB.KEYS.pets,pet.id,{status:'in_treatment'}); }
  else { TNR_DB.update(TNR_DB.KEYS.pets,pet.id,{status:'in_treatment'}); }

  logOperation('保存诊疗记录：'+pet.code+'（'+(allChecked?'全部完成':'部分完成')+'）');
  TNR_UI.toast('诊疗记录保存成功'+(allChecked?'，诊疗已完成':''),'success');
  state.treatmentData={items:{},sterilization:null,vaccine:null,deworming:null,chip:null};
  renderTreatment();
}

function renderTreatmentList(){
  var page=document.getElementById('page-treatment-list');
  page.innerHTML=TNR_UI.renderFilterBar([
    {type:'search',key:'petCode',label:'宠物编号',placeholder:'搜索宠物编号'},
    {type:'select',key:'itemType',label:'诊疗项目',options:[{value:'sterilization',label:'绝育'},{value:'vaccine',label:'疫苗'},{value:'deworming',label:'驱虫'},{value:'chip',label:'芯片植入'}]},
    {type:'select',key:'status',label:'状态',options:[{value:'completed',label:'已完成'},{value:'in_progress',label:'进行中'}]},
    {type:'date',key:'dateFrom',label:'开始日期',placeholder:''},
    {type:'date',key:'dateTo',label:'结束日期',placeholder:''}
  ],'<button class="btn btn-secondary btn-sm" onclick="renderTreatmentListTable()">查询</button>')+
  '<div id="treatmentListTable"></div>';
  renderTreatmentListTable();
  TNR_UI.bindFilter(renderTreatmentListTable);
}
function renderTreatmentListTable(){
  var filters=TNR_UI.getFilterValues();
  var treatments=getHospitalTreatments().filter(function(t){
    if(filters.petcode&&!(t.petCode||'').toLowerCase().includes(filters.petcode)) return false;
    if(filters.itemtype&&!(t.items&&t.items[filters.itemtype])) return false;
    if(filters.status&&t.status!==filters.status) return false;
    if(filters.datefrom&&t.createdAt&&t.createdAt.substr(0,10)<filters.datefrom) return false;
    if(filters.dateto&&t.createdAt&&t.createdAt.substr(0,10)>filters.dateto) return false;
    return true;
  }).sort(function(a,b){return (b.createdAt||'').localeCompare(a.createdAt||'');});
  var container=document.getElementById('treatmentListTable');
  if(treatments.length===0){ container.innerHTML='<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">暂无诊疗记录</div></div>'; return; }
  var rows=treatments.map(function(t){
    var items=[];
    if(t.items.sterilization)items.push('<span class="badge badge-cinnabar">绝育</span>');
    if(t.items.vaccine)items.push('<span class="badge badge-info">疫苗</span>');
    if(t.items.deworming)items.push('<span class="badge badge-success">驱虫</span>');
    if(t.items.chip)items.push('<span class="badge badge-warning">芯片</span>');
    return '<tr><td><div style="font-weight:500;">'+TNR_UI.escape(t.petCode||'')+'</div></td>'+
      '<td>'+(items.join(' ')||'—')+'</td>'+
      '<td>'+TNR_UI.escape(t.hospitalName||'')+'</td>'+
      '<td>'+TNR_UI.escape(t.sterilization?t.sterilization.surgeon:(t.operatorName||'—'))+'</td>'+
      '<td>'+TNR_UI.escape(t.createdAt||'—')+'</td>'+
      '<td>'+treatmentStatusBadge(t.status)+'</td>'+
      '<td><button class="btn-link" onclick="viewTreatmentDetail(\''+t.id+'\')">详情</button></td></tr>';
  }).join('');
  container.innerHTML='<div class="table-wrapper"><table class="data-table"><thead><tr><th>宠物编号</th><th>诊疗项目</th><th>医院</th><th>医生</th><th>日期</th><th>状态</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function renderMaterial(){
  var page=document.getElementById('page-material');
  var pending=getPendingMaterialDispatches().length;
  var stock=getHospitalMaterials().length;
  var txns=getHospitalMaterialTxns().length;
  var adjustments=getHospitalMaterialTxns().filter(function(t){return t.type==='adjustment';}).length;
  page.innerHTML='<div class="tabs">'+
    '<div class="tab-item '+(state.materialTab==='pending'?'active':'')+'" onclick="switchMaterialTab(\'pending\')">待接收物料 ('+pending+')</div>'+
    '<div class="tab-item '+(state.materialTab==='stock'?'active':'')+'" onclick="switchMaterialTab(\'stock\')">实时库存 ('+stock+')</div>'+
    '<div class="tab-item '+(state.materialTab==='adjustment'?'active':'')+'" onclick="switchMaterialTab(\'adjustment\')">库存异动 ('+adjustments+')</div>'+
    '<div class="tab-item '+(state.materialTab==='ledger'?'active':'')+'" onclick="switchMaterialTab(\'ledger\')">出入库台账 ('+txns+')</div></div>'+
    '<div id="materialTabContent"></div>';
  renderMaterialTab();
}
function switchMaterialTab(tab){ state.materialTab=tab; document.querySelectorAll('#page-material .tab-item').forEach(function(el,i){el.classList.toggle('active',['pending','stock','adjustment','ledger'][i]===tab);}); renderMaterialTab(); }
function renderMaterialTab(){
  var c=document.getElementById('materialTabContent');
  if(state.materialTab==='pending') renderMaterialPending(c);
  else if(state.materialTab==='stock') renderMaterialStock(c);
  else if(state.materialTab==='adjustment') renderMaterialAdjustment(c);
  else if(state.materialTab==='ledger') renderMaterialLedger(c);
}
function renderMaterialPending(c){
  var dispatches=getPendingMaterialDispatches();
  if(dispatches.length===0){ c.innerHTML='<div class="empty-state"><div class="empty-state-icon">📦</div><div class="empty-state-text">暂无待接收物料</div><div class="empty-state-desc">所有捕捉点下发的物料已确认接收</div></div>'; return; }
  var rows=dispatches.map(function(t){
    return '<tr><td><div style="font-weight:500;">'+TNR_UI.escape(t.materialName||'')+'</div><div style="font-size:var(--fs-xs);color:var(--ink-light);">'+TNR_UI.escape(t.ledgerNo||'')+'</div></td>'+
      '<td>'+TNR_DB.getMaterialCategoryText(TNR_DB.getById(TNR_DB.KEYS.materials,t.materialId)?TNR_DB.getById(TNR_DB.KEYS.materials,t.materialId).category:'')+'</td>'+
      '<td>'+t.quantity+' '+TNR_UI.escape(t.unit||'')+'</td><td>'+TNR_UI.escape(t.batchNo||'')+'</td>'+
      '<td>'+TNR_UI.escape(t.operatorName||'')+'</td><td>'+TNR_UI.escape(t.date||'')+'</td>'+
      '<td><button class="btn btn-success btn-sm" onclick="confirmMaterialReceive(\''+t.id+'\')">确认入库</button></td></tr>';
  }).join('');
  c.innerHTML='<div class="table-wrapper"><table class="data-table"><thead><tr><th>物料名称</th><th>分类</th><th>数量</th><th>批号</th><th>下发方</th><th>下发日期</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function confirmMaterialReceive(txnId){
  var txn=TNR_DB.getById(TNR_DB.KEYS.materialTxns,txnId); if(!txn) return;
  TNR_UI.confirm('确认接收该批物料？接收后医院库存将增加 '+txn.quantity+' '+txn.unit,'确认入库').then(function(ok){
    if(!ok) return;
    TNR_DB.update(TNR_DB.KEYS.materialTxns,txnId,{hospitalReceived:true,receivedAt:new Date().toISOString().substr(0,10)});
    addHospitalStock(txn.materialId,txn.quantity);
    var u=currentUser();
    TNR_DB.create(TNR_DB.KEYS.materialTxns,{type:'receive',materialId:txn.materialId,materialName:txn.materialName,quantity:txn.quantity,unit:txn.unit,batchNo:txn.batchNo,fromTo:'捕捉点下发接收',hospitalId:getHospitalId(),operator:u.id,operatorName:getHospitalName(),date:new Date().toISOString().substr(0,10),ledgerNo:TNR_DB._genLedgerNo('RCV'),note:'接收捕捉点下发物料'});
    logOperation('确认接收物料：'+txn.materialName+' x'+txn.quantity);
    TNR_UI.toast('物料入库成功','success'); renderMaterial();
  });
}
function renderMaterialStock(c){
  var materials=getHospitalMaterials();
  var h=getHospitalId();
  var cards=materials.map(function(m){
    var stock=m.hospitalStock?(m.hospitalStock[h]||0):0;
    var isLow=stock<m.safetyStock;
    var pct=Math.min(100,(stock/(m.safetyStock*2))*100);
    var color=isLow?'var(--rouge)':(stock<m.safetyStock*1.5?'var(--autumn-gold)':'var(--bamboo-green)');
    return '<div class="card"><div class="card-body"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3);">'+
      '<div><div style="font-weight:600;font-size:var(--fs-lg);">'+TNR_UI.escape(m.name)+'</div><div style="font-size:var(--fs-sm);color:var(--ink-muted);">'+TNR_DB.getMaterialCategoryText(m.category)+' · '+TNR_UI.escape(m.specification||'')+'</div></div>'+
      '<span class="badge '+(isLow?'badge-danger':'badge-success')+'">'+(isLow?'库存不足':'正常')+'</span></div>'+
      '<div style="display:flex;align-items:center;gap:var(--sp-4);"><div style="flex:1;">'+
      '<div class="stock-bar"><div class="stock-bar-fill" style="width:'+pct+'%;background:'+color+';"></div></div>'+
      '<div style="display:flex;justify-content:space-between;margin-top:4px;font-size:var(--fs-xs);color:var(--ink-light);"><span>当前库存</span><span>安全库存</span></div></div>'+
      '<div style="text-align:right;"><div style="font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:700;color:'+color+';">'+stock+'</div><div style="font-size:var(--fs-xs);color:var(--ink-light);">/ '+m.safetyStock+' '+TNR_UI.escape(m.unit||'')+'</div></div></div>'+
      '<div class="desc-list mt-4"><div class="desc-item"><div class="desc-label">供应商</div><div class="desc-value">'+TNR_UI.escape(m.supplier||'—')+'</div></div>'+
      '<div class="desc-item"><div class="desc-label">批号</div><div class="desc-value">'+TNR_UI.escape(m.batchNo||'—')+'</div></div>'+
      '<div class="desc-item"><div class="desc-label">有效期</div><div class="desc-value">'+TNR_UI.escape(m.expiryDate||'—')+'</div></div></div></div></div>';
  }).join('');

function saveStockAdjustment(){
  var mid=document.getElementById('adjMaterial').value, type=document.getElementById('adjType').value, qty=parseInt(document.getElementById('adjQty').value), date=document.getElementById('adjDate').value, reason=document.getElementById('adjReason').value.trim();
  if(!mid){TNR_UI.toast('请选择物料','warning');return;} if(!qty||qty<=0){TNR_UI.toast('请输入有效数量','warning');return;} if(!reason){TNR_UI.toast('请填写原因说明','warning');return;}
  var mat=TNR_DB.getById(TNR_DB.KEYS.materials,mid); var u=currentUser();
  var stock=getHospitalStock(mid); if(qty>stock){TNR_UI.toast('异动数量超过当前库存','danger');return;}
  deductHospitalStock(mid,qty);
  TNR_DB.create(TNR_DB.KEYS.materialTxns,{type:'adjustment',subtype:type,materialId:mid,materialName:mat?mat.name:'',quantity:qty,unit:mat?mat.unit:'',batchNo:mat?mat.batchNo:'',fromTo:'库存异动',hospitalId:getHospitalId(),operator:u.id,operatorName:getHospitalName(),date:date,ledgerNo:TNR_DB._genLedgerNo('ADJ'),note:reason});
  logOperation('库存异动报备：'+(mat?mat.name:'')+' '+type+' x'+qty);
  TNR_UI.toast('异动报备已提交，库存已扣减','success'); renderMaterial();
}
function renderMaterialLedger(c){

  var typeMap={'purchase':'采购入库','dispatch':'捕捉点下发','receive':'接收入库','consume':'诊疗消耗','adjustment':'库存异动'};
  var typeBadge={'purchase':'badge-success','dispatch':'badge-info','receive':'badge-success','consume':'badge-warning','adjustment':'badge-danger'};

}

function uploadPhoto(petId,photoType){
  TNR_UI.modal({title:'上传照片（'+{before:'收容前',after:'收容后',treatment:'诊疗后'}[photoType]+'）',body:function(bodyEl,closeFn){
    bodyEl.innerHTML='<div class="form-group"><label class="form-label">选择图片文件</label><input type="file" accept="image/*" id="photoFileInput" class="form-input" style="padding:4px;" /></div>'+
      '<div id="photoPreview" style="margin-top:var(--sp-3);"></div>'+
      '<div style="display:flex;gap:var(--sp-3);justify-content:flex-end;margin-top:var(--sp-4);"><button class="btn btn-secondary" onclick="'+closeFn+'">取消</button><button class="btn btn-primary" id="photoUploadBtn">上传</button></div>';
    bodyEl.querySelector('#photoFileInput').addEventListener('change',function(e){
      var file=e.target.files[0]; if(!file) return;
      var reader=new FileReader();
      reader.onload=function(ev){
        bodyEl.querySelector('#photoPreview').innerHTML='<img src="'+ev.target.result+'" style="width:100%;border-radius:var(--r-md);" />';
      };
      reader.readAsDataURL(file);
    });
    bodyEl.querySelector('#photoUploadBtn').onclick=function(){
      var file=bodyEl.querySelector('#photoFileInput').files[0];
      if(!file){TNR_UI.toast('请选择图片文件','warning');return;}
      var reader=new FileReader();
      reader.onload=function(ev){
        var pet=TNR_DB.getById(TNR_DB.KEYS.pets,petId);
        if(!pet.photos) pet.photos={group:'',before:'',after:'',treatment:''};
        pet.photos[photoType]=ev.target.result;
        TNR_DB.update(TNR_DB.KEYS.pets,petId,{photos:pet.photos});
        logOperation('上传照片：'+pet.code+' ('+{before:'收容前',after:'收容后',treatment:'诊疗后'}[photoType]+')');
        TNR_UI.toast('照片上传成功','success'); closeFn(); renderAdoptionInfo();
      };
      reader.readAsDataURL(file);
    };
  }});
}
function saveAdoptionInfo(petId){
  var desc=document.getElementById('desc_'+petId).value.trim();
  var personality=document.getElementById('personality_'+petId).value.trim();
  var health=document.getElementById('health_'+petId).value.trim();
  TNR_DB.update(TNR_DB.KEYS.pets,petId,{description:desc,personality:personality,healthCondition:health});
  logOperation('更新领养资料：'+petId);
  TNR_UI.toast('领养资料保存成功','success');
}
function publishToAdoptionHall(petId){
  var pet=TNR_DB.getById(TNR_DB.KEYS.pets,petId); if(!pet) return;
  var hallItems=TNR_DB.getAllRaw(TNR_DB.KEYS.adoptionHall);
  var existing=hallItems.find(function(h){return h.petId===petId;});
  if(existing){
    TNR_DB.update(TNR_DB.KEYS.adoptionHall,existing.id,{status:'published',publishedAt:new Date().toISOString().substr(0,10)});
  } else {
    TNR_DB.create(TNR_DB.KEYS.adoptionHall,{petId:petId,petCode:pet.code,hospitalId:getHospitalId(),hospitalName:getHospitalName(),publishedAt:new Date().toISOString().substr(0,10),status:'published'});
  }
  logOperation('发布至领养大厅：'+pet.code);
  TNR_UI.toast('已发布至领养大厅','success'); renderAdoptionInfo();
}
function unpublishFromHall(petId){
  var hallItems=TNR_DB.getAllRaw(TNR_DB.KEYS.adoptionHall);
  var item=hallItems.find(function(h){return h.petId===petId;});
  if(item){ TNR_DB.update(TNR_DB.KEYS.adoptionHall,item.id,{status:'unpublished'}); }
  logOperation('从领养大厅下架：'+petId);
  TNR_UI.toast('已从领养大厅下架','success'); renderAdoptionInfo();
}
function confirmAdoption(petId){
  var pet=TNR_DB.getById(TNR_DB.KEYS.pets,petId); if(!pet) return;
  TNR_UI.modal({title:'确认领养出库 · '+TNR_UI.escape(pet.code),size:'lg',body:function(bodyEl,closeFn){
    bodyEl.innerHTML='<div class="form-hint" style="padding:var(--sp-3);background:var(--bamboo-light);border-radius:var(--r-md);color:var(--bamboo-green);font-size:var(--fs-sm);margin-bottom:var(--sp-4);">领养人在捕捉点办理好线下手续后，到医院领取动物。确认后动物状态变更为「已领养」，并扣减活体库存。</div>'+
      '<div class="form-row"><div class="form-group"><label class="form-label">领养人姓名<span class="req">*</span></label><input type="text" class="form-input" id="adoptName" placeholder="请输入领养人姓名" /></div>'+
      '<div class="form-group"><label class="form-label">联系电话<span class="req">*</span></label><input type="text" class="form-input" id="adoptPhone" placeholder="请输入联系电话" /></div></div>'+
      '<div class="form-row"><div class="form-group"><label class="form-label">身份证号</label><input type="text" class="form-input" id="adoptIdCard" placeholder="请输入身份证号" /></div>'+
      '<div class="form-group"><label class="form-label">领养日期<span class="req">*</span></label><input type="date" class="form-input" id="adoptDate" value="'+new Date().toISOString().substr(0,10)+'" /></div></div>'+
      '<div class="form-group"><label class="form-label">备注</label><textarea class="form-textarea" id="adoptNote" placeholder="备注信息"></textarea></div>'+
      '<div style="display:flex;gap:var(--sp-3);justify-content:flex-end;margin-top:var(--sp-4);"><button class="btn btn-secondary" onclick="'+closeFn+'">取消</button><button class="btn btn-success" id="confirmAdoptBtn">确认领养出库</button></div>';
    bodyEl.querySelector('#confirmAdoptBtn').onclick=function(){
      var name=bodyEl.querySelector('#adoptName').value.trim(), phone=bodyEl.querySelector('#adoptPhone').value.trim(), date=bodyEl.querySelector('#adoptDate').value;
      if(!name){TNR_UI.toast('请输入领养人姓名','warning');return;} if(!phone){TNR_UI.toast('请输入联系电话','warning');return;} if(!date){TNR_UI.toast('请选择领养日期','warning');return;}
      var u=currentUser();
      TNR_DB.update(TNR_DB.KEYS.pets,petId,{status:'adopted'});
      TNR_DB.create(TNR_DB.KEYS.adoptions,{petId:petId,petCode:pet.code,adopterName:name,adopterPhone:phone,adopterIdCard:bodyEl.querySelector('#adoptIdCard').value.trim(),adopterAddress:'',qualification:'线下审核通过',commitmentLetter:'已签署',adoptionAgreement:'线下已签',hospitalId:getHospitalId(),hospitalName:getHospitalName(),status:'completed',adoptedAt:date,operator:u.id,operatorName:getHospitalName(),ledgerNo:TNR_DB._genLedgerNo('ADP'),districtId:u.districtId});
      var hallItems=TNR_DB.getAllRaw(TNR_DB.KEYS.adoptionHall);
      var hallItem=hallItems.find(function(h){return h.petId===petId;});
      if(hallItem) TNR_DB.update(TNR_DB.KEYS.adoptionHall,hallItem.id,{status:'adopted'});
      logOperation('确认领养出库：'+pet.code+'，领养人：'+name);
      TNR_UI.toast('领养出库成功，动物状态已变更为「已领养」','success'); closeFn(); renderAdoptionInfo();
    };
  }});
}

    return '<tr><td><div style="font-weight:500;">'+TNR_UI.escape(e.petCode||'')+'</div></td><td>'+TNR_UI.escape(e.reason||'')+'</td><td>'+TNR_UI.escape(e.euthanizedAt||'')+'</td><td>'+(e.bodyReceived?'<span class="badge badge-success">已移交</span>':'<span class="badge badge-warning">未移交</span>')+'</td><td>'+TNR_UI.escape(e.operatorName||'')+'</td><td><button class="btn-link" onclick="viewEuthanasiaDetail(\''+e.id+'\')">详情</button></td></tr>';
  }).join('');
  return '<div class="table-wrapper"><table class="data-table"><thead><tr><th>宠物编号</th><th>原因</th><th>处置日期</th><th>遗体移交</th><th>操作人</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function saveEuthanasia(){
  var petId=document.getElementById('euthPetSelect').value, date=document.getElementById('euthDate').value, reason=document.getElementById('euthReason').value, condition=document.getElementById('euthCondition').value.trim(), bodyTransfer=document.getElementById('euthBodyTransfer').checked;
  if(!petId){TNR_UI.toast('请选择动物','warning');return;} if(!date){TNR_UI.toast('请选择处置日期','warning');return;} if(!condition){TNR_UI.toast('请填写动物状况描述','warning');return;}
  var pet=TNR_DB.getById(TNR_DB.KEYS.pets,petId); var u=currentUser();
  TNR_UI.confirm('确认对该动物执行安乐死处置？此操作不可逆。','确认安乐死处置').then(function(ok){
    if(!ok) return;
    var record={petId:petId,petCode:pet.code,hospitalId:getHospitalId(),hospitalName:getHospitalName(),reason:reason,condition:condition,euthanizedAt:date,bodyReceived:bodyTransfer,bodyReceivedAt:bodyTransfer?date:'',bodyReceivedBy:bodyTransfer?'I001':'',bodyReceivedByName:bodyTransfer?'朝阳区流浪动物捕捉点':'',operator:u.id,operatorName:getHospitalName(),ledgerNo:TNR_DB._genLedgerNo('EUT'),districtId:u.districtId};
    TNR_DB.create(TNR_DB.KEYS.euthanasia,record);
    TNR_DB.update(TNR_DB.KEYS.pets,petId,{status:'euthanized'});
    if(bodyTransfer){ TNR_DB.create(TNR_DB.KEYS.materialTxns,{type:'body_transfer',materialId:'',materialName:'遗体移交',quantity:1,unit:'具',batchNo:'',fromTo:pet.code+' 遗体移交至捕捉点',hospitalId:getHospitalId(),operator:u.id,operatorName:getHospitalName(),date:date,ledgerNo:TNR_DB._genLedgerNo('BDY'),note:'安乐死后遗体移交'}); }
    logOperation('安乐死处置：'+pet.code+'，原因：'+reason);
    TNR_UI.toast('安乐死处置已登记，动物状态已更新','success'); renderEuthanasia();
  });
}
function viewEuthanasiaDetail(id){
  var e=TNR_DB.getById(TNR_DB.KEYS.euthanasia,id); if(!e) return;
  var pet=TNR_DB.getById(TNR_DB.KEYS.pets,e.petId);
  var html='<div class="detail-section"><div class="detail-section-title">动物信息</div>'+TNR_UI.renderDescList([
    {label:'宠物编号',value:TNR_UI.escape(e.petCode)},
    {label:'名称',value:pet?TNR_UI.escape(pet.name||''):'—'},
    {label:'物种/品种',value:pet?(TNR_UI.escape(pet.species||'')+' / '+TNR_UI.escape(pet.breed||'')):'—'}
  ])+'</div>';
  html+='<div class="detail-section"><div class="detail-section-title">处置信息</div>'+TNR_UI.renderDescList([
    {label:'处置日期',value:TNR_UI.escape(e.euthanizedAt)},
    {label:'原因',value:TNR_UI.escape(e.reason)},
    {label:'动物状况',value:TNR_UI.escape(e.condition),full:true},
    {label:'遗体移交',value:e.bodyReceived?'<span class="badge badge-success">已移交</span>':'<span class="badge badge-warning">未移交</span>'},
    {label:'移交日期',value:TNR_UI.escape(e.bodyReceivedAt||'—')},
    {label:'移交至',value:TNR_UI.escape(e.bodyReceivedByName||'—')},
    {label:'操作人',value:TNR_UI.escape(e.operatorName)},
    {label:'单据编号',value:TNR_UI.escape(e.ledgerNo)}
  ])+'</div>';
  TNR_UI.drawer({title:'安乐死处置详情 · '+TNR_UI.escape(e.petCode),body:html});
}

// ============================================
// 8. 单据台账
// ============================================
function renderLedger(){
  var page=document.getElementById('page-ledger');
  var transfers=getHospitalTransfers().length;
  var treatments=getHospitalTreatments().length;
  var matTxns=getHospitalMaterialTxns().length;
  var euthanasia=getHospitalEuthanasia().length;
  page.innerHTML='<div class="tabs">'+
    '<div class="tab-item '+(state.ledgerTab==='transfer'?'active':'')+'" onclick="switchLedgerTab(\'transfer\')">交接台账 ('+transfers+')</div>'+
    '<div class="tab-item '+(state.ledgerTab==='treatment'?'active':'')+'" onclick="switchLedgerTab(\'treatment\')">诊疗台账 ('+treatments+')</div>'+
    '<div class="tab-item '+(state.ledgerTab==='material'?'active':'')+'" onclick="switchLedgerTab(\'material\')">物料台账 ('+matTxns+')</div>'+
    '<div class="tab-item '+(state.ledgerTab==='euthanasia'?'active':'')+'" onclick="switchLedgerTab(\'euthanasia\')">安乐死台账 ('+euthanasia+')</div></div>'+
    '<div id="ledgerTabContent"></div>';
  renderLedgerTab();
}
function switchLedgerTab(tab){ state.ledgerTab=tab; document.querySelectorAll('#page-ledger .tab-item').forEach(function(el,i){el.classList.toggle('active',['transfer','treatment','material','euthanasia'][i]===tab);}); renderLedgerTab(); }
function renderLedgerTab(){
  var c=document.getElementById('ledgerTabContent');
  if(state.ledgerTab==='transfer') renderLedgerTransfer(c);
  else if(state.ledgerTab==='treatment') renderLedgerTreatment(c);
  else if(state.ledgerTab==='material') renderLedgerMaterial(c);
  else if(state.ledgerTab==='euthanasia') renderLedgerEuthanasia(c);
}
function renderLedgerTransfer(c){
  var data=getHospitalTransfers().sort(function(a,b){return (b.createdAt||'').localeCompare(a.createdAt||'');});
  if(data.length===0){c.innerHTML='<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">暂无交接台账</div></div>';return;}
  var rows=data.map(function(t){return '<tr><td>'+TNR_UI.escape(t.ledgerNo||'')+'</td><td>'+TNR_UI.escape(t.createdAt||'')+'</td><td>'+TNR_UI.escape(t.fromShelterName||'')+'</td><td>'+t.petCount+'</td><td>'+TNR_UI.escape((t.petCodes||[]).join(', '))+'</td><td>'+transferStatusBadge(t.status)+'</td><td>'+TNR_UI.escape(t.receivedAt||'—')+'</td></tr>';}).join('');
  c.innerHTML='<div style="display:flex;justify-content:flex-end;margin-bottom:var(--sp-3);"><button class="btn btn-outline btn-sm" onclick="exportLedger(\'交接台账\')">导出</button></div><div class="table-wrapper"><table class="data-table"><thead><tr><th>单据编号</th><th>创建时间</th><th>来源捕捉点</th><th>动物数量</th><th>宠物编号</th><th>状态</th><th>接收时间</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function renderLedgerTreatment(c){
  var data=getHospitalTreatments().sort(function(a,b){return (b.createdAt||'').localeCompare(a.createdAt||'');});
  if(data.length===0){c.innerHTML='<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">暂无诊疗台账</div></div>';return;}
  var rows=data.map(function(t){var items=[];if(t.items.sterilization)items.push('绝育');if(t.items.vaccine)items.push('疫苗');if(t.items.deworming)items.push('驱虫');if(t.items.chip)items.push('芯片');return '<tr><td>'+TNR_UI.escape(t.petCode||'')+'</td><td>'+(items.join('、')||'—')+'</td><td>'+TNR_UI.escape(t.hospitalName||'')+'</td><td>'+TNR_UI.escape(t.sterilization?t.sterilization.surgeon:(t.operatorName||'—'))+'</td><td>'+TNR_UI.escape(t.completedAt||t.createdAt||'')+'</td><td>'+treatmentStatusBadge(t.status)+'</td></tr>';}).join('');
  c.innerHTML='<div style="display:flex;justify-content:flex-end;margin-bottom:var(--sp-3);"><button class="btn btn-outline btn-sm" onclick="exportLedger(\'诊疗台账\')">导出</button></div><div class="table-wrapper"><table class="data-table"><thead><tr><th>宠物编号</th><th>诊疗项目</th><th>医院</th><th>医生</th><th>日期</th><th>状态</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function renderLedgerMaterial(c){
  var data=getHospitalMaterialTxns().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  if(data.length===0){c.innerHTML='<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">暂无物料台账</div></div>';return;}
  var typeMap={'purchase':'采购入库','dispatch':'捕捉点下发','receive':'接收入库','consume':'诊疗消耗','adjustment':'库存异动','body_transfer':'遗体移交'};
  var typeBadge={'purchase':'badge-success','dispatch':'badge-info','receive':'badge-success','consume':'badge-warning','adjustment':'badge-danger','body_transfer':'badge-default'};
  var rows=data.map(function(t){return '<tr><td>'+TNR_UI.escape(t.ledgerNo||'')+'</td><td><span class="badge '+(typeBadge[t.type]||'badge-default')+'">'+(typeMap[t.type]||t.type)+'</span></td><td>'+TNR_UI.escape(t.materialName||'')+'</td><td>'+(t.type==='consume'||t.type==='adjustment'?'-':'+')+t.quantity+' '+TNR_UI.escape(t.unit||'')+'</td><td>'+TNR_UI.escape(t.date||'')+'</td><td>'+TNR_UI.escape(t.operatorName||'')+'</td></tr>';}).join('');
  c.innerHTML='<div style="display:flex;justify-content:flex-end;margin-bottom:var(--sp-3);"><button class="btn btn-outline btn-sm" onclick="exportLedger(\'物料台账\')">导出</button></div><div class="table-wrapper"><table class="data-table"><thead><tr><th>单据编号</th><th>类型</th><th>物料</th><th>数量</th><th>日期</th><th>操作人</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function renderLedgerEuthanasia(c){
  var data=getHospitalEuthanasia().sort(function(a,b){return (b.euthanizedAt||'').localeCompare(a.euthanizedAt||'');});
  if(data.length===0){c.innerHTML='<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">暂无安乐死台账</div></div>';return;}
  var rows=data.map(function(e){return '<tr><td>'+TNR_UI.escape(e.ledgerNo||'')+'</td><td>'+TNR_UI.escape(e.petCode||'')+'</td><td>'+TNR_UI.escape(e.reason||'')+'</td><td>'+TNR_UI.escape(e.euthanizedAt||'')+'</td><td>'+(e.bodyReceived?'<span class="badge badge-success">已移交</span>':'<span class="badge badge-warning">未移交</span>')+'</td><td>'+TNR_UI.escape(e.operatorName||'')+'</td></tr>';}).join('');
  c.innerHTML='<div style="display:flex;justify-content:flex-end;margin-bottom:var(--sp-3);"><button class="btn btn-outline btn-sm" onclick="exportLedger(\'安乐死台账\')">导出</button></div><div class="table-wrapper"><table class="data-table"><thead><tr><th>单据编号</th><th>宠物编号</th><th>原因</th><th>处置日期</th><th>遗体移交</th><th>操作人</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function exportLedger(type){
  TNR_UI.toast(type+'已导出（模拟）','success');
  logOperation('导出台账：'+type);
}

// ============================================
// 9. 个人中心
// ============================================
function renderProfile(){
  var page=document.getElementById('page-profile');
  var u=currentUser();
  var inst=TNR_DB.getById(TNR_DB.KEYS.institutions,u.institutionId);
  var logs=getOperationLogs();
  page.innerHTML='<div class="card mb-5"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>账户信息</div></div><div class="card-body">'+
    TNR_UI.renderDescList([
      {label:'用户名',value:TNR_UI.escape(u.username||'')},
      {label:'姓名',value:TNR_UI.escape(u.name||'')},
      {label:'所属机构',value:TNR_UI.escape(inst?inst.name:'—')},
      {label:'机构类型',value:'宠物医院'},
      {label:'角色',value:'医院操作员'},
      {label:'联系电话',value:TNR_UI.escape(u.phone||'—')},
      {label:'用户编号',value:TNR_UI.escape(u.id||'')},
      {label:'创建时间',value:TNR_UI.escape(u.createdAt||'—')}
    ])+'</div></div>'+
    '<div class="card mb-5"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>修改密码</div></div><div class="card-body">'+
    '<div class="form-section"><div class="form-section-header"><div class="form-section-header-icon">🔒</div><div class="form-section-title">设置新密码</div></div><div class="form-section-body">'+
    '<div class="form-row"><div class="form-group"><label class="form-label">原密码<span class="req">*</span></label><input type="password" class="form-input" id="oldPassword" placeholder="请输入原密码" /></div>'+
    '<div class="form-group"><label class="form-label">新密码<span class="req">*</span></label><input type="password" class="form-input" id="newPassword" placeholder="至少6位" /></div></div>'+
    '<div class="form-row"><div class="form-group"><label class="form-label">确认新密码<span class="req">*</span></label><input type="password" class="form-input" id="confirmPassword" placeholder="再次输入新密码" /></div><div class="form-group"></div></div>'+
    '<div style="display:flex;justify-content:flex-end;"><button class="btn btn-primary" onclick="changePassword()">修改密码</button></div></div></div></div></div>'+
    '<div class="card"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>操作日志</div></div><div class="card-body-flush">'+
    (logs.length===0?'<div class="empty-state" style="padding:var(--sp-6);"><div class="empty-state-icon">📝</div><div class="empty-state-text">暂无操作记录</div></div>':
    '<div class="table-wrapper"><table class="data-table"><thead><tr><th>时间</th><th>操作内容</th></tr></thead><tbody>'+logs.map(function(l){return '<tr><td style="white-space:nowrap;">'+TNR_UI.escape(l.time)+'</td><td>'+TNR_UI.escape(l.action)+'</td></tr>';}).join('')+'</tbody></table></div>')+
    '</div></div>';
}
function changePassword(){
  var oldPwd=document.getElementById('oldPassword').value;
  var newPwd=document.getElementById('newPassword').value;
  var confirmPwd=document.getElementById('confirmPassword').value;
  var u=currentUser();
  if(u.password!==oldPwd){TNR_UI.toast('原密码错误','danger');return;}
  if(newPwd!==confirmPwd){TNR_UI.toast('两次输入的新密码不一致','warning');return;}
  if(newPwd.length<6){TNR_UI.toast('新密码长度不能少于6位','warning');return;}
  TNR_DB.update(TNR_DB.KEYS.users,u.id,{password:newPwd});
  u.password=newPwd; TNR_DB.setCurrentUser(u);
  logOperation('修改密码');
  TNR_UI.toast('密码修改成功','success');
  document.getElementById('oldPassword').value='';
  document.getElementById('newPassword').value='';
  document.getElementById('confirmPassword').value='';
}

// === 启动 ===
init();
</script>
