<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增捕捉登记 - 流浪动物 TNR 管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%); min-height: 100vh; display: flex; }
        .sidebar { width: 260px; background: linear-gradient(180deg, #2d3748 0%, #1a202c 100%); color: white; padding: 24px; display: flex; flex-direction: column; min-height: 100vh; position: fixed; left: 0; top: 0; }
        .sidebar-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-logo-icon { width: 44px; height: 44px; background: linear-gradient(135deg, #f6ad55, #ed8936); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .sidebar-logo h1 { font-size: 18px; font-weight: 600; color: white; }
        .nav-menu { flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: all 0.3s ease; color: rgba(255,255,255,0.8); text-decoration: none; }
        .nav-item:hover { background: rgba(255,255,255,0.1); color: white; }
        .nav-item.active { background: linear-gradient(135deg, #f6ad55, #ed8936); color: white; }
        .nav-icon { font-size: 20px; }
        .nav-label { font-size: 15px; font-weight: 500; }
        .nav-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 20px 0; }
        .user-section { padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .user-info { display: flex; align-items: center; gap: 10px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 10px; }
        .user-avatar { width: 36px; height: 36px; background: linear-gradient(135deg, #68d391, #48bb78); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .user-details { flex: 1; }
        .user-name { font-size: 14px; font-weight: 600; }
        .user-role { font-size: 12px; color: rgba(255,255,255,0.6); }
        .main-content { flex: 1; margin-left: 260px; padding: 24px; max-width: calc(100% - 260px); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-title { font-size: 24px; font-weight: 600; color: #2d3748; }
        .current-time { font-size: 14px; color: #718096; padding: 10px 20px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .section { background: white; border-radius: 16px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid #edf2f7; }
        .section-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #f6ad55, #ed8936); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .section-title { font-size: 18px; font-weight: 600; color: #2d3748; }
        .form-group { margin-bottom: 20px; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .form-label { display: block; font-size: 14px; font-weight: 500; color: #4a5568; margin-bottom: 8px; }
        .required::before { content: '*'; color: #f56565; margin-right: 4px; }
        .form-input, .form-select { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 14px; font-family: inherit; background: white; transition: all 0.3s; }
        .form-input:focus, .form-select:focus { outline: none; border-color: #f6ad55; box-shadow: 0 0 0 3px rgba(246,173,85,0.1); }
        .location-input-wrapper { position: relative; }
        .location-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); padding: 6px 12px; background: linear-gradient(135deg, #f6ad55, #ed8936); color: white; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.3s ease; }
        .location-btn:hover { background: #dd6b20; }
        .pet-id-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
        .pet-id-tag { display: inline-flex; align-items: center; padding: 8px 16px; background: linear-gradient(135deg, #fffaf0, #feebc8); color: #c05621; border-radius: 20px; font-size: 14px; font-weight: 500; }
        .pet-id-tag .id-number { background: linear-gradient(135deg, #f6ad55, #ed8936); color: white; padding: 2px 8px; border-radius: 12px; margin-left: 6px; }
        .upload-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; margin-top: 12px; }
        .upload-item { aspect-ratio: 1; border: 2px dashed #e2e8f0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s ease; background: #f7fafc; }
        .upload-item:hover { border-color: #f6ad55; background: #fffaf0; }
        .upload-icon { font-size: 32px; margin-bottom: 8px; color: #a0aec0; }
        .upload-text { font-size: 12px; color: #718096; }
        .photo-preview { position: relative; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
        .photo-tag { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: white; padding: 4px 8px; font-size: 12px; text-align: center; }
        .signature-pad { border: 2px solid #e2e8f0; border-radius: 12px; background: #f7fafc; margin-top: 12px; }
        .signature-canvas { width: 100%; height: 200px; border-radius: 10px; cursor: crosshair; }
        .signature-actions { display: flex; gap: 12px; margin-top: 12px; }
        .btn { padding: 12px 24px; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.3s ease; font-family: inherit; }
        .btn-primary { background: linear-gradient(135deg, #f6ad55, #ed8936); color: white; box-shadow: 0 4px 15px rgba(237,137,54,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(237,137,54,0.4); }
        .btn-green { background: linear-gradient(135deg, #68d391, #48bb78); color: white; }
        .btn-secondary { background: #f7fafc; color: #718096; border: 2px solid #e2e8f0; }
        .btn-large { padding: 16px 32px; font-size: 16px; }
        .info-box { background: linear-gradient(135deg, #fffaf0, #feebc8); border-left: 4px solid #f6ad55; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
        .info-box p { font-size: 14px; color: #c05621; line-height: 1.6; }
        .form-actions { display: flex; gap: 16px; justify-content: flex-end; margin-top: 32px; padding-top: 24px; border-top: 2px solid #edf2f7; }
        @media (max-width: 768px) { body { flex-direction: column; } .sidebar { width: 100%; position: relative; min-height: auto; } .nav-menu { display: none; } .main-content { margin-left: 0; max-width: 100%; padding: 16px; } .form-row { grid-template-columns: 1fr; } .form-actions { flex-direction: column; } .btn { width: 100%; } }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo"><div class="sidebar-logo-icon">🐾</div><h1>TNR管理系统</h1></div>
        <nav class="nav-menu">
            <a href="homepage.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">首页看板</span></a>
            <a href="add-shelter.html" class="nav-item active"><span class="nav-icon">➕</span><span class="nav-label">新增捕捉</span></a>
            <a href="owner-return.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">主人领回</span></a>
            <div class="nav-divider"></div>
            <a href="material.html" class="nav-item"><span class="nav-icon">📦</span><span class="nav-label">物料管理</span></a>
            <a href="transfer.html" class="nav-item"><span class="nav-icon">🚚</span><span class="nav-label">转运管理</span></a>
            <a href="release.html" class="nav-item"><span class="nav-icon">🌿</span><span class="nav-label">放归管理</span></a>
            <a href="adoption.html" class="nav-item"><span class="nav-icon">👤</span><span class="nav-label">领养管理</span></a>
            <div class="nav-divider"></div>
            <a href="report.html" class="nav-item"><span class="nav-icon">📊</span><span class="nav-label">数据报表</span></a>
            <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span><span class="nav-label">系统设置</span></a>
        </nav>
        <div class="user-section"><div class="user-info"><div class="user-avatar">管</div><div class="user-details"><div class="user-name">管理员</div><div class="user-role">系统管理员</div></div></div></div>
    </aside>
    <main class="main-content">
        <div class="header-bar"><h2 class="page-title">新增捕捉登记</h2><div class="current-time" id="currentTime"></div></div>
        <div class="section">
            <div class="section-header"><div class="section-icon">🏢</div><h3 class="section-title">小区物业信息</h3></div>
            <div class="form-row">
                <div class="form-group"><label class="form-label required">物业名称</label><input type="text" class="form-input" placeholder="请输入物业公司名称"></div>
                <div class="form-group"><label class="form-label required">所在小区</label><div class="location-input-wrapper"><input type="text" class="form-input" id="community" value="阳光花园小区" placeholder="自动定位或手动输入"><button class="location-btn" onclick="getLocation()">📍 定位</button></div></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label class="form-label required">详细门牌号</label><input type="text" class="form-input" placeholder="请输入详细地址"></div>
                <div class="form-group"><label class="form-label required">物业交接人姓名</label><input type="text" class="form-input" placeholder="请输入交接人姓名"></div>
            </div>
            <div class="form-group"><label class="form-label required">联系电话</label><input type="tel" class="form-input" placeholder="请输入联系电话"></div>
        </div>
        <div class="section">
            <div class="section-header"><div class="section-icon">🐱</div><h3 class="section-title">捕捉动物信息</h3></div>
            <div class="info-box"><p>💡 系统将根据您输入的捕捉数量，自动批量生成宠物唯一编号（格式：001、002、003...）</p></div>
            <div class="form-group"><label class="form-label required">捕捉总数量</label><input type="number" class="form-input" id="petCount" value="3" min="1" max="50" onchange="generatePetIds()"></div>
            <div class="form-group"><label class="form-label">自动生成宠物编号</label><div class="pet-id-list" id="petIdList"><span class="pet-id-tag">宠物编号 <span class="id-number">001</span></span><span class="pet-id-tag">宠物编号 <span class="id-number">002</span></span><span class="pet-id-tag">宠物编号 <span class="id-number">003</span></span></div></div>
            <div class="form-group"><label class="form-label required">整体合影上传</label><div class="upload-grid"><div class="upload-item" onclick="uploadPhoto(this)"><div class="upload-icon">📷</div><div class="upload-text">点击上传<br>批次合影</div></div></div></div>
            <div class="form-group"><label class="form-label required">单只编号单独拍照</label><div class="upload-grid" id="singlePhotoGrid"><div class="upload-item" onclick="uploadPhoto(this)"><div class="upload-icon">📷</div><div class="upload-text">编号 001<br>单独照片</div></div><div class="upload-item" onclick="uploadPhoto(this)"><div class="upload-icon">📷</div><div class="upload-text">编号 002<br>单独照片</div></div><div class="upload-item" onclick="uploadPhoto(this)"><div class="upload-icon">📷</div><div class="upload-text">编号 003<br>单独照片</div></div></div></div>
        </div>
        <div class="section">
            <div class="section-header"><div class="section-icon">✍️</div><h3 class="section-title">物业电子签名确认</h3></div>
            <div class="form-group"><label class="form-label required">请物业交接人在下方签字区域手写签名</label><div class="signature-pad"><canvas class="signature-canvas" id="signatureCanvas"></canvas></div><div class="signature-actions"><button class="btn btn-secondary" onclick="clearSignature()">🗑️ 清除重签</button></div></div>
            <div class="form-actions"><button class="btn btn-secondary">💾 暂存草稿</button><button class="btn btn-primary btn-large" onclick="submitForm()">✅ 提交保存并生成捕捉单据</button></div>
        </div>
    </main>
    <script>
        function updateTime(){const now=new Date();document.getElementById('currentTime').textContent=now.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});}setInterval(updateTime,1000);updateTime();
        function getLocation(){if(navigator.geolocation){navigator.geolocation.getCurrentPosition(()=>{document.getElementById('community').value='阳光花园小区 (已定位)';alert('定位成功！');},()=>{alert('定位失败，请手动输入小区名称');});}else{alert('您的浏览器不支持定位功能');}}
        function generatePetIds(){const count=parseInt(document.getElementById('petCount').value);const petIdList=document.getElementById('petIdList');const singlePhotoGrid=document.getElementById('singlePhotoGrid');petIdList.innerHTML='';singlePhotoGrid.innerHTML='';for(let i=1;i<=count;i++){const id=String(i).padStart(3,'0');const tag=document.createElement('span');tag.className='pet-id-tag';tag.innerHTML=`宠物编号 <span class="id-number">${id}</span>`;petIdList.appendChild(tag);const uploadItem=document.createElement('div');uploadItem.className='upload-item';uploadItem.onclick=function(){uploadPhoto(this);};uploadItem.innerHTML=`<div class="upload-icon">📷</div><div class="upload-text">编号 ${id}<br>单独照片</div>`;singlePhotoGrid.appendChild(uploadItem);}}
        function uploadPhoto(element){const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=(e)=>{const file=e.target.files[0];if(file){const reader=new FileReader();reader.onload=(event)=>{element.innerHTML=`<div class="photo-preview"><img src="${event.target.result}" alt="预览"><div class="photo-tag">已上传</div></div>`;};reader.readAsDataURL(file);}};input.click();}
        const canvas=document.getElementById('signatureCanvas');const ctx=canvas.getContext('2d');let isDrawing=false;let lastX=0;let lastY=0;
        function resizeCanvas(){canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';}
        resizeCanvas();window.addEventListener('resize',resizeCanvas);
        canvas.addEventListener('mousedown',startDrawing);canvas.addEventListener('mousemove',draw);canvas.addEventListener('mouseup',stopDrawing);canvas.addEventListener('mouseout',stopDrawing);
        canvas.addEventListener('touchstart',handleTouchStart);canvas.addEventListener('touchmove',handleTouchMove);canvas.addEventListener('touchend',stopDrawing);
        function startDrawing(e){isDrawing=true;[lastX,lastY]=[e.offsetX,e.offsetY];}
        function draw(e){if(!isDrawing)return;ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();[lastX,lastY]=[e.offsetX,e.offsetY];}
        function stopDrawing(){isDrawing=false;}
        function handleTouchStart(e){e.preventDefault();const touch=e.touches[0];const rect=canvas.getBoundingClientRect();lastX=touch.clientX-rect.left;lastY=touch.clientY-rect.top;isDrawing=true;}
        function handleTouchMove(e){e.preventDefault();if(!isDrawing)return;const touch=e.touches[0];const rect=canvas.getBoundingClientRect();const x=touch.clientX-rect.left;const y=touch.clientY-rect.top;ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);ctx.stroke();[lastX,lastY]=[x,y];}
        function clearSignature(){ctx.clearRect(0,0,canvas.width,canvas.height);}
        function submitForm(){alert('捕捉登记已提交保存！');}
    </script>
</body>
</html>
