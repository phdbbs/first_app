<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增收容登记 - 流浪动物 TNR 管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header-info {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-container {
            padding: 32px;
        }

        .section {
            margin-bottom: 32px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
        }

        .section-header {
            background: #f5f7fa;
            padding: 16px 24px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .section-body {
            padding: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: #555;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .required {
            color: #e74c3c;
        }

        .form-input {
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .location-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .location-btn:hover {
            transform: translateY(-2px);
        }

        .number-input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .number-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .generate-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }

        .pet-id-list {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .pet-id-tag {
            background: #e8f4fd;
            color: #667eea;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #667eea;
        }

        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 16px;
        }

        .upload-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .upload-hint {
            color: #999;
            font-size: 12px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .photo-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
            background: #f0f0f0;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            text-align: center;
        }

        .signature-pad {
            border: 2px solid #ddd;
            border-radius: 12px;
            background: white;
            cursor: crosshair;
            touch-action: none;
        }

        .signature-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .clear-btn {
            background: #f5f5f5;
            color: #666;
            border: 1px solid #ddd;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .submit-section {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            margin-top: 32px;
        }

        .cancel-btn {
            background: white;
            color: #666;
            border: 1px solid #ddd;
            padding: 14px 32px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .cancel-btn:hover {
            background: #f5f5f5;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-in-transit {
            background: #fff3cd;
            color: #856404;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
            
            .submit-section {
                flex-direction: column;
            }
            
            .cancel-btn, .submit-btn {
                width: 100%;
            }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .success-animation {
            text-align: center;
            padding: 40px 0;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #27ae60;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            color: white;
        }

        .document-preview {
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.8;
        }

        .document-title {
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🐾 新增收容登记</h1>
            <div class="header-info">
                <span id="currentDate"></span> | 
                <span id="operatorName">操作员：张管理员</span>
            </div>
        </div>

        <!-- 表单容器 -->
        <div class="form-container">
            <form id="shelterForm">
                <!-- 小区物业信息区 -->
                <div class="section">
                    <div class="section-header">
                        <div class="section-icon">🏢</div>
                        <div class="section-title">小区物业信息</div>
                    </div>
                    <div class="section-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">
                                    <span class="required">*</span> 物业名称
                                </label>
                                <input type="text" class="form-input" placeholder="请输入物业公司名称" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">
                                    <span class="required">*</span> 所在小区
                                </label>
                                <div class="number-input-wrapper">
                                    <input type="text" class="form-input" id="community" placeholder="点击定位自动填充" required>
                                    <button type="button" class="location-btn" onclick="getLocation()">
                                        📍 定位
                                    </button>
                                </div>
                            </div>
                            
                            <div class="form-group full-width">
                                <label class="form-label">
                                    <span class="required">*</span> 详细门牌号
                                </label>
                                <input type="text" class="form-input" placeholder="请输入详细地址，如：XX 栋 XX 单元 XX 号" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">
                                    <span class="required">*</span> 物业交接人姓名
                                </label>
                                <input type="text" class="form-input" placeholder="请输入交接人姓名" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">
                                    <span class="required">*</span> 联系电话
                                </label>
                                <input type="tel" class="form-input" placeholder="请输入手机号码" pattern="[0-9]{11}" required>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 收容动物信息区 -->
                <div class="section">
                    <div class="section-header">
                        <div class="section-icon">🐕</div>
                        <div class="section-title">收容动物信息</div>
                    </div>
                    <div class="section-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">
                                    <span class="required">*</span> 收容总数量
                                </label>
                                <div class="number-input-wrapper">
                                    <input type="number" class="form-input number-input" id="petCount" min="1" max="100" placeholder="输入数量" onchange="generatePetIds()" required>
                                    <button type="button" class="generate-btn" onclick="generatePetIds()">
                                        🔢 生成编号
                                    </button>
                                </div>
                            </div>
                            
                            <div class="form-group full-width">
                                <label class="form-label">自动生成宠物编号</label>
                                <div class="pet-id-list" id="petIdList">
                                    <span style="color: #999; font-size: 14px;">请输入收容数量后点击"生成编号"</span>
                                </div>
                            </div>
                            
                            <div class="form-group full-width">
                                <label class="form-label">
                                    <span class="required">*</span> 批次整体合影
                                </label>
                                <div class="upload-area" onclick="document.getElementById('groupPhoto').click()">
                                    <div class="upload-icon">📷</div>
                                    <div class="upload-text">点击上传批次整体合影</div>
                                    <div class="upload-hint">支持 JPG、PNG 格式，最大 10MB</div>
                                    <input type="file" id="groupPhoto" accept="image/*" style="display: none;" onchange="handlePhotoUpload(this, 'groupPreview')">
                                </div>
                                <div class="photo-grid" id="groupPreview"></div>
                            </div>
                            
                            <div class="form-group full-width">
                                <label class="form-label">
                                    <span class="required">*</span> 单只编号对应照片
                                </label>
                                <div class="upload-area" onclick="document.getElementById('singlePhotos').click()">
                                    <div class="upload-icon">📸</div>
                                    <div class="upload-text">点击上传单只宠物照片</div>
                                    <div class="upload-hint">可多选，按编号顺序上传</div>
                                    <input type="file" id="singlePhotos" accept="image/*" multiple style="display: none;" onchange="handleSinglePhotoUpload(this)">
                                </div>
                                <div class="photo-grid" id="singlePhotoPreview"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 确认区 -->
                <div class="section">
                    <div class="section-header">
                        <div class="section-icon">✍️</div>
                        <div class="section-title">物业电子签名确认</div>
                    </div>
                    <div class="section-body">
                        <div class="form-group">
                            <label class="form-label">请物业交接人在下方签名区域手写签名</label>
                            <canvas class="signature-pad" id="signaturePad" width="800" height="300"></canvas>
                            <div class="signature-actions">
                                <button type="button" class="clear-btn" onclick="clearSignature()">🗑️ 清除签名</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 提交按钮 -->
                <div class="submit-section">
                    <button type="button" class="cancel-btn" onclick="window.history.back()">❌ 取消</button>
                    <button type="submit" class="submit-btn">✅ 提交保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 提交成功弹窗 -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="success-animation">
                <div class="success-icon">✓</div>
                <h3 style="margin-bottom: 16px; color: #333;">收容登记成功！</h3>
                <p style="color: #666; margin-bottom: 24px;">
                    已生成收容单据，宠物状态：<span class="status-badge status-in-transit">在途</span>
                </p>
                
                <div class="document-preview">
                    <div class="document-title">流浪动物收容登记表</div>
                    <div id="documentContent"></div>
                </div>
                
                <div style="margin-top: 24px; display: flex; gap: 12px;">
                    <button class="cancel-btn" style="flex: 1;" onclick="printDocument()">🖨️ 打印单据</button>
                    <button class="submit-btn" style="flex: 1;" onclick="closeModal()">✓ 确定</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 显示当前日期
        function showCurrentDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long', hour: '2-digit', minute: '2-digit' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', options);
        }

        // 获取定位
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6);
                        const lng = position.coords.longitude.toFixed(6);
                        document.getElementById('community').value = `经纬度：${lat}, ${lng} (模拟：阳光花园小区)`;
                    },
                    () => {
                        alert('无法获取定位，请手动输入小区名称');
                        document.getElementById('community').value = '';
                    }
                );
            } else {
                alert('您的浏览器不支持定位功能');
            }
        }

        // 生成宠物编号
        function generatePetIds() {
            const count = parseInt(document.getElementById('petCount').value);
            const petIdList = document.getElementById('petIdList');
            
            if (!count || count < 1 || count > 100) {
                petIdList.innerHTML = '<span style="color: #e74c3c;">请输入有效的数量（1-100）</span>';
                return;
            }
            
            const date = new Date();
            const dateStr = date.getFullYear().toString().substr(-2) + 
                           (date.getMonth() + 1).toString().padStart(2, '0') + 
                           date.getDate().toString().padStart(2, '0');
            
            let html = '';
            for (let i = 1; i <= count; i++) {
                const petId = `TNR${dateStr}${i.toString().padStart(3, '0')}`;
                html += `<span class="pet-id-tag">${petId}</span>`;
            }
            petIdList.innerHTML = html;
        }

        // 处理合影上传
        function handlePhotoUpload(input, previewId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const preview = document.getElementById(previewId);
                    preview.innerHTML = `
                        <div class="photo-item">
                            <img src="${e.target.result}" alt="整体合影">
                            <div class="photo-label">整体合影</div>
                        </div>
                    `;
                };
                reader.readAsDataURL(file);
            }
        }

        // 处理单只照片上传
        function handleSinglePhotoUpload(input) {
            const files = input.files;
            const preview = document.getElementById('singlePhotoPreview');
            const petIds = document.querySelectorAll('.pet-id-tag');
            
            if (files.length === 0) return;
            
            let html = '';
            Array.from(files).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const petId = petIds[index] ? petIds[index].textContent : `未编号-${index + 1}`;
                    const photoDiv = document.createElement('div');
                    photoDiv.className = 'photo-item';
                    photoDiv.innerHTML = `
                        <img src="${e.target.result}" alt="${petId}">
                        <div class="photo-label">${petId}</div>
                    `;
                    preview.appendChild(photoDiv);
                };
                reader.readAsDataURL(file);
            });
        }

        // 签名板初始化
        const canvas = document.getElementById('signaturePad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // 适配高分辨率屏幕
        function resizeCanvas() {
            const ratio = Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            ctx.scale(ratio, ratio);
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        function startDrawing(e) {
            isDrawing = true;
            [lastX, lastY] = getCoordinates(e);
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            
            const [x, y] = getCoordinates(e);
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            
            [lastX, lastY] = [x, y];
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            return [
                clientX - rect.left,
                clientY - rect.top
            ];
        }

        // 鼠标事件
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // 触摸事件
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        // 清除签名
        function clearSignature() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // 表单提交
        document.getElementById('shelterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 检查是否有签名
            const isEmpty = ctx.getImageData(0, 0, canvas.width, canvas.height).data.every((val) => val === 0);
            if (isEmpty) {
                alert('请物业交接人先进行电子签名');
                return;
            }
            
            // 生成单据内容
            const community = document.getElementById('community').value;
            const petCount = document.getElementById('petCount').value;
            const petIds = Array.from(document.querySelectorAll('.pet-id-tag')).map(tag => tag.textContent).join(', ');
            const date = new Date().toLocaleString('zh-CN');
            
            const documentContent = `
                <div>单据编号：TNR-${Date.now()}</div>
                <div>登记时间：${date}</div>
                <div>操作员：张管理员</div>
                <div>------------------------</div>
                <div>所在小区：${community}</div>
                <div>收容数量：${petCount} 只</div>
                <div>宠物编号：${petIds}</div>
                <div>------------------------</div>
                <div>状态：<span class="status-badge status-in-transit">在途</span></div>
                <div>备注：已完成物业交接确认</div>
            `;
            
            document.getElementById('documentContent').innerHTML = documentContent;
            document.getElementById('successModal').classList.add('active');
        });

        // 关闭弹窗
        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
            // 可以跳转到列表页或首页
            // window.location.href = 'shelter-list.html';
        }

        // 打印单据
        function printDocument() {
            window.print();
        }

        // 初始化
        showCurrentDate();
    </script>
</body>
</html>
