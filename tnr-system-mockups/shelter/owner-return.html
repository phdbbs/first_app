<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主人领回登记 - 流浪动物 TNR 管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header-info {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-container {
            padding: 32px;
        }

        .alert-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: flex;
            align-items: start;
            gap: 12px;
        }

        .alert-icon {
            font-size: 24px;
        }

        .alert-content h3 {
            color: #856404;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .alert-content p {
            color: #856404;
            font-size: 14px;
            line-height: 1.6;
        }

        .section {
            margin-bottom: 24px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
        }

        .section-header {
            background: #f5f7fa;
            padding: 16px 24px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .section-body {
            padding: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: #555;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .required {
            color: #e74c3c;
        }

        .form-input {
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-textarea {
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .pet-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .pet-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .pet-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .pet-card.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .pet-card.selected::after {
            content: '✓';
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .pet-photo {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #f0f0f0;
        }

        .pet-info {
            font-size: 14px;
        }

        .pet-id {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 4px;
        }

        .pet-detail {
            color: #666;
            font-size: 13px;
        }

        .signature-pad {
            border: 2px solid #ddd;
            border-radius: 12px;
            background: white;
            cursor: crosshair;
            touch-action: none;
            width: 100%;
            height: 250px;
        }

        .signature-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .clear-btn {
            background: #f5f5f5;
            color: #666;
            border: 1px solid #ddd;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .submit-section {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            margin-top: 32px;
        }

        .cancel-btn {
            background: white;
            color: #666;
            border: 1px solid #ddd;
            padding: 14px 32px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .cancel-btn:hover {
            background: #f5f5f5;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-archived {
            background: #d4edda;
            color: #155724;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .success-animation {
            text-align: center;
            padding: 40px 0;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #27ae60;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            color: white;
        }

        .document-preview {
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.8;
            text-align: left;
        }

        .document-title {
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
            
            .submit-section {
                flex-direction: column;
            }
            
            .cancel-btn, .submit-btn {
                width: 100%;
            }
            
            .pet-selector {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🏠 主人领回登记</h1>
            <div class="header-info">
                <span id="currentDate"></span> | 
                <span id="operatorName">操作员：张管理员</span>
            </div>
        </div>

        <!-- 表单容器 -->
        <div class="form-container">
            <!-- 提示信息 -->
            <div class="alert-box">
                <div class="alert-icon">⚠️</div>
                <div class="alert-content">
                    <h3>注意事项</h3>
                    <p>此操作用于现场找到原主人的情况。录入宠主信息并电子签字确认后，系统将直接出库归档，终止后续诊疗转运流程。请确保信息真实有效。</p>
                </div>
            </div>

            <form id="ownerReturnForm">
                <!-- 选择在途宠物 -->
                <div class="section">
                    <div class="section-header">
                        <div class="section-icon">🐕</div>
                        <div class="section-title">选择在途宠物</div>
                    </div>
                    <div class="section-body">
                        <label class="form-label">
                            <span class="required">*</span> 请选择要被领回的宠物（状态：在途）
                        </label>
                        <div class="pet-selector" id="petSelector">
                            <!-- 宠物卡片将由 JS 动态生成 -->
                        </div>
                    </div>
                </div>

                <!-- 宠主信息区 -->
                <div class="section">
                    <div class="section-header">
                        <div class="section-icon">👤</div>
                        <div class="section-title">宠主信息登记</div>
                    </div>
                    <div class="section-body">
                        <div class="form-group">
                            <label class="form-label">
                                <span class="required">*</span> 宠主姓名
                            </label>
                            <input type="text" class="form-input" id="ownerName" placeholder="请输入宠主姓名" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">
                                <span class="required">*</span> 联系电话
                            </label>
                            <input type="tel" class="form-input" id="ownerPhone" placeholder="请输入手机号码" pattern="[0-9]{11}" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">
                                <span class="required">*</span> 身份证信息
                            </label>
                            <input type="text" class="form-input" id="ownerIdCard" placeholder="请输入身份证号码" pattern="[0-9]{17}[0-9Xx]" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">
                                <span class="required">*</span> 领回原因备注
                            </label>
                            <textarea class="form-textarea" id="returnReason" placeholder="请详细说明领回原因，如：走失寻找、临时寄养等" required></textarea>
                        </div>
                    </div>
                </div>

                <!-- 确认区 -->
                <div class="section">
                    <div class="section-header">
                        <div class="section-icon">✍️</div>
                        <div class="section-title">宠主电子签名确认</div>
                    </div>
                    <div class="section-body">
                        <div class="form-group">
                            <label class="form-label">请宠主在下方签名区域手写签名确认</label>
                            <canvas class="signature-pad" id="signaturePad"></canvas>
                            <div class="signature-actions">
                                <button type="button" class="clear-btn" onclick="clearSignature()">🗑️ 清除签名</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 提交按钮 -->
                <div class="submit-section">
                    <button type="button" class="cancel-btn" onclick="window.history.back()">❌ 取消</button>
                    <button type="submit" class="submit-btn">✅ 确认出库归档</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 提交成功弹窗 -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="success-animation">
                <div class="success-icon">✓</div>
                <h3 style="margin-bottom: 16px; color: #333;">主人领回登记成功！</h3>
                <p style="color: #666; margin-bottom: 24px;">
                    宠物已出库归档，状态：<span class="status-badge status-archived">已归档</span>
                </p>
                
                <div class="document-preview">
                    <div class="document-title">流浪动物主人领回登记表</div>
                    <div id="documentContent"></div>
                </div>
                
                <div style="margin-top: 24px; display: flex; gap: 12px;">
                    <button class="cancel-btn" style="flex: 1;" onclick="printDocument()">🖨️ 打印单据</button>
                    <button class="submit-btn" style="flex: 1;" onclick="closeModal()">✓ 确定</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 显示当前日期
        function showCurrentDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long', hour: '2-digit', minute: '2-digit' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', options);
        }

        // 模拟在途宠物数据
        const inTransitPets = [
            { id: 'TNR241215001', community: '阳光花园小区', date: '2024-12-15', photo: null },
            { id: 'TNR241215002', community: '阳光花园小区', date: '2024-12-15', photo: null },
            { id: 'TNR241215003', community: '阳光花园小区', date: '2024-12-15', photo: null },
            { id: 'TNR241214001', community: '幸福家园', date: '2024-12-14', photo: null },
            { id: 'TNR241214002', community: '幸福家园', date: '2024-12-14', photo: null },
            { id: 'TNR241213001', community: '绿色新城', date: '2024-12-13', photo: null }
        ];

        // 渲染宠物选择器
        function renderPetSelector() {
            const container = document.getElementById('petSelector');
            let html = '';
            
            inTransitPets.forEach(pet => {
                html += `
                    <div class="pet-card" onclick="selectPet(this, '${pet.id}')">
                        <img src="${pet.photo || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22 viewBox=%220 0 200 200%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2240%22 fill=%22%23ccc%22%3E🐕%3C/text%3E%3C/svg%3E'}" alt="${pet.id}" class="pet-photo">
                        <div class="pet-info">
                            <div class="pet-id">${pet.id}</div>
                            <div class="pet-detail">📍 ${pet.community}</div>
                            <div class="pet-detail">📅 ${pet.date}</div>
                            <div class="pet-detail">状态：在途</div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // 选择宠物
        let selectedPetId = null;
        function selectPet(card, petId) {
            // 移除其他选中状态
            document.querySelectorAll('.pet-card').forEach(c => c.classList.remove('selected'));
            // 添加当前选中状态
            card.classList.add('selected');
            selectedPetId = petId;
        }

        // 签名板初始化
        const canvas = document.getElementById('signaturePad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // 适配高分辨率屏幕和容器大小
        function resizeCanvas() {
            const container = canvas.parentElement;
            const ratio = Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = container.offsetWidth * ratio;
            canvas.height = 250 * ratio;
            ctx.scale(ratio, ratio);
            canvas.style.width = '100%';
            canvas.style.height = '250px';
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        function startDrawing(e) {
            isDrawing = true;
            [lastX, lastY] = getCoordinates(e);
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            
            const [x, y] = getCoordinates(e);
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            
            [lastX, lastY] = [x, y];
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            return [
                clientX - rect.left,
                clientY - rect.top
            ];
        }

        // 鼠标事件
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // 触摸事件
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        // 清除签名
        function clearSignature() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // 表单提交
        document.getElementById('ownerReturnForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 验证选择宠物
            if (!selectedPetId) {
                alert('请选择一只在途宠物');
                return;
            }
            
            // 验证签名
            const isEmpty = ctx.getImageData(0, 0, canvas.width, canvas.height).data.every((val) => val === 0);
            if (isEmpty) {
                alert('请宠主先进行电子签名');
                return;
            }
            
            // 获取表单数据
            const ownerName = document.getElementById('ownerName').value;
            const ownerPhone = document.getElementById('ownerPhone').value;
            const ownerIdCard = document.getElementById('ownerIdCard').value;
            const returnReason = document.getElementById('returnReason').value;
            const date = new Date().toLocaleString('zh-CN');
            
            // 生成单据内容
            const documentContent = `
                <div>单据编号：RETURN-${Date.now()}</div>
                <div>登记时间：${date}</div>
                <div>操作员：张管理员</div>
                <div>------------------------</div>
                <div>宠物编号：${selectedPetId}</div>
                <div>宠主姓名：${ownerName}</div>
                <div>联系电话：${ownerPhone}</div>
                <div>身份证号：${ownerIdCard.replace(/(\d{6})\d{8}(\d{4})/, '$1********$2')}</div>
                <div>领回原因：${returnReason}</div>
                <div>------------------------</div>
                <div>状态：<span class="status-badge status-archived">已归档</span></div>
                <div>备注：原主人认领，流程终止</div>
            `;
            
            document.getElementById('documentContent').innerHTML = documentContent;
            document.getElementById('successModal').classList.add('active');
        });

        // 关闭弹窗
        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
            // 可以跳转到列表页或首页
            // window.location.href = 'shelter-list.html';
        }

        // 打印单据
        function printDocument() {
            window.print();
        }

        // 初始化
        showCurrentDate();
        renderPetSelector();
    </script>
</body>
</html>
