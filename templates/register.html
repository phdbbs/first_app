<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>领养人注册 - TNR管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; }
        .card { background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); border-radius: 24px; padding: 48px 40px; width: 420px; border: 1px solid rgba(255,255,255,0.15); }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo-icon { width: 70px; height: 70px; background: linear-gradient(135deg, #22d3ee, #06b6d4); border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; font-size: 36px; margin-bottom: 12px; }
        .logo h1 { font-size: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 14px; margin-bottom: 6px; color: rgba(255,255,255,0.8); }
        .form-input { width: 100%; padding: 12px 16px; border: 2px solid rgba(255,255,255,0.1); border-radius: 10px; background: rgba(255,255,255,0.05); color: white; font-size: 14px; font-family: inherit; }
        .form-input:focus { outline: none; border-color: #22d3ee; }
        .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; color: white; background: linear-gradient(135deg, #22d3ee, #06b6d4); }
        .flash-msg { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; background: rgba(252,129,129,0.2); color: #fc8181; }
        .back-link { display: block; text-align: center; margin-top: 16px; color: rgba(255,255,255,0.5); text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">👤</div>
            <h1>领养人注册</h1>
        </div>
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}<div class="flash-msg">{{ message }}</div>{% endfor %}
        {% endwith %}
        <form method="POST">
            <div class="form-group"><label class="form-label">用户名</label><input type="text" name="username" class="form-input" required></div>
            <div class="form-group"><label class="form-label">密码</label><input type="password" name="password" class="form-input" required></div>
            <div class="form-group"><label class="form-label">姓名</label><input type="text" name="name" class="form-input" required></div>
            <div class="form-group"><label class="form-label">联系电话</label><input type="tel" name="phone" class="form-input" required></div>
            <button type="submit" class="btn">注 册</button>
        </form>
        <a href="{{ url_for('login', role='adopter') }}" class="back-link">← 已有账号，去登录</a>
    </div>
</body>
</html>
