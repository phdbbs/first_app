<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动物回收放归管理 - 流浪动物 TNR 管理系统</title>
    <link rel="stylesheet" href="../../assets/css/tnr-common.css">
    <link rel="stylesheet" href="../../assets/css/tnr-shelter.css">
</head>
<body>
    <script src="../../assets/js/tnr-common.js"></script>
    <script src="../../assets/js/tnr-shelter.js"></script>
    <script>injectSidebar("release");</script>
    <main class="main-content">
        <div class="header-bar"><h2 class="page-title">动物回收放归管理</h2><div class="current-time" id="currentTime"></div></div>
        <div class="stats-grid">
            <div class="stat-card purple"><span class="stat-icon">🏥</span><span class="stat-value">12</span><span class="stat-label">待回收</span></div>
            <div class="stat-card cyan"><span class="stat-icon">🌿</span><span class="stat-value">24</span><span class="stat-label">待放归</span></div>
            <div class="stat-card yellow"><span class="stat-icon">📋</span><span class="stat-value">12</span><span class="stat-label">待物业确认</span></div>
            <div class="stat-card green"><span class="stat-icon">✅</span><span class="stat-value">86</span><span class="stat-label">已放归</span></div>
        </div>
        <div class="tab-bar">
            <div class="tab-item active" onclick="switchTab('recover')">治愈回收</div>
            <div class="tab-item" onclick="switchTab('release')">放归登记</div>
            <div class="tab-item" onclick="switchTab('confirm')">放归确认</div>
            <div class="tab-item" onclick="switchTab('record')">放归台账</div>
        </div>
        <div id="recoverTab" class="tab-content active">
            <div class="section">
                <div class="section-header"><h3 class="section-title">治愈动物回收</h3><button class="btn btn-primary" onclick="openRecoverModal()">🏥 回收动物</button></div>
                <div class="filter-bar">
                    <select class="form-select"><option>全部医院</option><option>爱心宠物医院</option><option>瑞鹏宠物医院</option><option>芭比堂动物医院</option></select>
                    <select class="form-select"><option>全部状态</option><option>待回收</option><option>已回收</option></select>
                    <input type="text" class="form-input" placeholder="搜索动物编号..." style="min-width:200px;">
                </div>
                <div class="table-wrapper"><table>
                    <thead><tr><th>动物编号</th><th>动物名称</th><th>来源医院</th><th>绝育状态</th><th>芯片号</th><th>回收状态</th><th>操作</th></tr></thead>
                    <tbody>
                        <tr><td><strong>A001</strong></td><td>橘猫-大橘</td><td>爱心宠物医院</td><td>已绝育</td><td>Chip001</td><td><span class="badge badge-recover">待回收</span></td><td><div class="actions-cell"><button class="btn btn-sm btn-green" onclick="confirmRecover('A001')">确认回收</button><button class="btn btn-sm btn-secondary" onclick="viewAnimalDetail('A001')">详情</button></div></td></tr>
                        <tr><td><strong>A002</strong></td><td>狸花猫-花花</td><td>瑞鹏宠物医院</td><td>已绝育</td><td>Chip002</td><td><span class="badge badge-recover">待回收</span></td><td><div class="actions-cell"><button class="btn btn-sm btn-green" onclick="confirmRecover('A002')">确认回收</button><button class="btn btn-sm btn-secondary" onclick="viewAnimalDetail('A002')">详情</button></div></td></tr>
                        <tr><td><strong>A003</strong></td><td>奶牛猫-小黑</td><td>芭比堂动物医院</td><td>已绝育</td><td>Chip003</td><td><span class="badge badge-done">已回收</span></td><td><div class="actions-cell"><button class="btn btn-sm btn-secondary" onclick="viewAnimalDetail('A003')">详情</button></div></td></tr>
                        <tr><td><strong>A004</strong></td><td>三花猫-美美</td><td>爱心宠物医院</td><td>已绝育</td><td>Chip004</td><td><span class="badge badge-done">已回收</span></td><td><div class="actions-cell"><button class="btn btn-sm btn-secondary" onclick="viewAnimalDetail('A004')">详情</button></div></td></tr>
                    </tbody>
                </table></div>
            </div>
        </div>
    </main>
    <script>showCurrentDate();</script>
</body>
</html>
