# ============================================
# TNR 流浪动物管理系统 - Supervisor 配置
# 路径: /etc/supervisor/conf.d/tnr.conf
# 启用: supervisorctl reread && supervisorctl update
# ============================================

[program:tnr-gunicorn]
command=/opt/tnr/venv/bin/gunicorn --config /opt/tnr/gunicorn.conf.py tnr_system.wsgi:application
directory=/opt/tnr
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/tnr/gunicorn.log
stderr_logfile=/var/log/tnr/gunicorn-error.log
environment=DJANGO_SETTINGS_MODULE="tnr_system.settings"

[program:tnr-qworker]
command=/opt/tnr/venv/bin/python manage.py qcluster
directory=/opt/tnr
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/tnr/qworker.log
stderr_logfile=/var/log/tnr/qworker-error.log
